t} min","rw_kA":"Heat loss coefficient <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>","rw_kA_herkunft_ausgleich":"from the fitted line","rw_kA_herkunft_fest":"kept fixed","rw_kA_herkunft_messung":"from the measurement after 10 min","rw_kA_herkunft_vor":"preset {name}","rw_keine_rechnung":"No calculation","rw_misch":"Mixing temperature <math><mrow><msub><mi>ϑ<\/mi><mrow><mn>1,0<\/mn><\/mrow><\/msub><\/mrow><\/math>","rw_noch_nicht":"No calculated values yet","rw_satz_1":"cup 1 warmer","rw_satz_2":"cup 2 warmer","rw_satz_gleich":"same temperature","rw_schnitt":"Intersection of the curves","rw_schnitt_kein":"no intersection before adding the milk","rw_schnitt_spaeter":"shown once you have made your prediction for question 1","rw_schnitt_wert":"after {t} min","rw_tasse1":"Cup 1 <math><mrow><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>","rw_tasse2":"Cup 2 <math><mrow><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>","rw_unterschied":"Difference <math><mrow><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>","rw_unterschied_b3":"Difference cup 1 and mug 3","rw_vorgewaermt":"(mug preheated)","rw_vorhersage":"Your prediction","schalter_becher":"Include the heat capacity of the mug (ceramic)","schalter_kalt":"Mug cold when pouring (room temperature)","schalter_milch2Raum":"Milk for cup 2 at room temperature","schalter_trinkzeit":"Show when each cup reaches 60 °C (drinking temperature)","soll_f1":"about 56 min","soll_start":"3.85 K (default values)","soll_v1":"47.0 °C","soll_v2":"about 100 min","speicher_aus":"Values are not saved (browser storage blocked)","speicher_ok":"Values stay only in this browser","sprache_knopf":"<b>EN<\/b> ↔ DE","sprache_knopf_aria":"EN ↔ DE: switch language, now English","sprung_inhalt":"Skip to content","start_ausgangslage":"default values","start_k_label":"Approximate difference","start_opt_1":"Cup 1 (milk right away)","start_opt_2":"Cup 2 (milk later)","start_opt_gleich":"Both at the same temperature","start_text":"Both cups stand for 60 min; the milk comes straight from the fridge. Which cup is warmer after 60 min, and by roughly how much? Write down your own answer first, then agree as a pair.","start_titel":"Predict first","status_ansage":"Cup 1 {a} °C, cup 2 {b} °C, difference {d} K.","status_aufgedeckt":"Revealed without a prediction.","status_festgehalten":"Prediction recorded, curves and calculated values are visible.","tasse_n":"Cup {n}","text_annahmen":"<p>As on the problem sheet:<\/p>\n<ul>\n<li>The contents of the cup are perfectly mixed; the milk mixes in immediately and without heat loss.<\/li>\n<li>The heat capacity of the cup is neglected, except when you include the mug (part g): then the mug is always at the temperature of its contents, even when the milk is poured in.<\/li>\n<li>The total heat loss (including radiation and evaporation) is <math><mrow><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mi mathvariant=\"normal\">ab<\/mi><\/msub><mo>=<\/mo><mi>k<\/mi><mi>A<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><mi>ϑ<\/mi><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math> with a constant <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>;<\/span> the evaporated mass is neglected.<\/li>\n<li>Coffee (properties of water) and milk are incompressible (<span class=\"nb\"><math><mrow><msub><mi>c<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><msub><mi>c<\/mi><mi>v<\/mi><\/msub><\/mrow><\/math>)<\/span>; the material properties are constant.<\/li>\n<\/ul>\n<p>In addition, in the simulation:<\/p>\n<ul>\n<li><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> applies to both cups; “<math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> of cup 1, relative” changes this for cup 1 only. When kept fixed, <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> stays the same when you change amounts or temperatures (here the filling level does not change <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>)<\/span>; from the measurement, it is determined again every time.<\/li>\n<li>Presets marked with a star are estimates, not measured; measured are “Ceramic, open” (problem) and “Ceramic with lid” (one mug with a polystyrene lid, Ferreira 2025a).<\/li>\n<li>When the measured values are used, the readings taken before the milk is added count as black coffee with the same initial value and the same <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> (mean of the measured values).<\/li>\n<li>Perfect mixing and “mug at the temperature of its contents” are deliberately simplifying assumptions; the small Biot number of the ceramic wall (about 0.035) supports them, but does not prove them on its own.<\/li>\n<\/ul>","text_code":"<p>The page is a single file. The calculation is in two marked blocks: <code>MODELL<\/code> contains the same equations and default values as the calculation script <code>kaffee_modell.py<\/code> of the solution (functions <code>rechne<\/code> and <code>zwei_tassen<\/code>), <code>ERWEITERUNG<\/code> the extensions (fitted line, energy, keeping <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> fixed and the selected additions). For every setting the code calculates the curves in closed form; only the drawing samples them at 241 points. Automatic tests check it: 10 000 random parameter sets against <code>kaffee_modell.py<\/code>, the extensions against an independent calculation, operation in the browser from 360 to 1920 px, both languages. As of {stand}, version {version}. You can read the code with “View page source” in your browser.<\/p>","text_lesen":"<ul>\n<li><strong>Brown solid line:<\/strong> cup 1. The milk goes in at <math><mrow><mi>t<\/mi><\/mrow><\/math> = 0; the short dotted line at <math><mrow><mi>t<\/mi><\/mrow><\/math> = 0 is the mixing jump from 80 to 70.47 °C.<\/li>\n<li><strong>Black dashed line:<\/strong> cup 2, black coffee until the milk is added; the dotted line at the end is the mixing jump when the milk is poured in.<\/li>\n<li><strong>Circle:<\/strong> intersection of the two curves. To the left of it, the black coffee is warmer than cup 1 and releases more heat; to the right, less (with the same <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> for both cups).<\/li>\n<li><strong>Grey dotted line:<\/strong> room temperature. Both curves approach it.<\/li>\n<li><strong>Shapes:<\/strong> your measured values (circle mug 1, square mug 2, triangle mug 3).<\/li>\n<li><strong>Labelled box:<\/strong> your locked-in prediction. <strong>Faint curves:<\/strong> the stored comparison run.<\/li>\n<li><strong>Calculated values:<\/strong> temperatures directly after the milk is added to cup 2. The difference is <span class=\"nb\"><math><mrow><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>;<\/span> positive means that cup 1 is warmer. <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> is shown with its origin (from the measurement, kept fixed, preset, fitted line).<\/li>\n<li><strong>Energy up to adding the milk:<\/strong> heat that each cup has released up to adding the milk (part e). With the same milk, <math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> divided by <math><mrow><mi>m<\/mi><mspace width=\"0.167em\"/><msub><mi>c<\/mi><mi>p<\/mi><\/msub><\/mrow><\/math> of the mixture is exactly the difference; with milk at different temperatures, the milk contribution is added.<\/li>\n<li><strong>“Heat flow rate” view (going further):<\/strong> <math><mrow><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mi mathvariant=\"normal\">ab<\/mi><\/msub><\/mrow><\/math> of both cups over time. The area between the curves is an energy: before the intersection cup 2 releases more, afterwards less; the two areas are hatched differently, and their sum is <span class=\"nb\"><math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>.<\/span><\/li>\n<li><strong>“Measured values, linearised (ln)” view (going further):<\/strong> <math><mrow><mi>ln<\/mi><mo>&#x2061;<\/mo><mfrac><mrow><mi>ϑ<\/mi><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><mrow><msub><mi>ϑ<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math> over <math><mrow><mi>t<\/mi><\/mrow><\/math> for the mugs before the milk. With a constant <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>,<\/span> the points lie on a straight line through the origin with the slope <span class=\"nb\"><math><mrow><mo>−<\/mo><mi>k<\/mi><mi>A<\/mi><mo>/<\/mo><mo>(<\/mo><mi>m<\/mi><mspace width=\"0.167em\"/><msub><mi>c<\/mi><mi>p<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math>.<\/span> A pattern in the distances from the line shows that <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> or the measuring conditions were not constant; the line alone does not tell you which cause.<\/li>\n<li><strong>Rounding:<\/strong> temperatures to 0.01 K, heat to 0.01 kJ.<\/li>\n<\/ul>","text_macht":"<ol>\n<li>It takes <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> of the cup: kept fixed (default 0.3402 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">W<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> from the measurement in the problem, a preset or your own value) or from the initial temperature and the measurement after 10 min (part c, with a mug part g).<\/li>\n<li>Cup 1: it mixes coffee and milk at <math><mrow><mi>t<\/mi><\/mrow><\/math> = 0 (part a) and lets the mixture cool down until the milk is added to cup 2 (parts b and d).<\/li>\n<li>Cup 2: it lets the black coffee cool down until the milk is added and then mixes the milk in.<\/li>\n<li>It compares both cups directly after the milk is added, calculates the heat released from the energy balance (part e) and the intersection of the curves.<\/li>\n<li>It plots your measured values; if you want, it uses the initial temperature and the value after 10 min from the measurements or determines <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> from all points before the milk.<\/li>\n<\/ol>\n<p>It does not calculate: evaporation as a separate process (that is your homework), temperature differences within the cup, a heat loss that grows faster than linearly. All numbers are produced in your browser; the page sends nothing.<\/p>","text_probier":"<p><strong>Try it: first predict, then check.<\/strong> Work on the questions as a pair. Write down your own idea of what happens first, then agree and lock in your prediction in the field. Only then check in the diagram. The explanation appears in the card once your prediction is locked in.<\/p>","text_problem":"<p>Sunday morning in a shared kitchen: you have made filter coffee and filled two identical cups with 200 ml each. Then the phone rings, and the call will last an hour. Your flatmate pours his milk into the coffee straight away (cup 1). You put your cup next to it and want to add the milk only after the call (cup 2), so that the coffee “stays hot for longer”. In both cases the milk comes straight from the fridge.<\/p>\n<p>Your flatmate says: “It doesn’t matter whether you add the milk straight away or later. Energy is conserved, after all.” Which cup is warmer after an hour?<\/p>\n<p>Both cups release heat to the room through their surface, and the warmer the contents are compared with the room, the more heat they release. The simulation calculates the process with the transient lumped energy balance from Tutorial 5; when going further, you can change amounts, temperatures, cup and mug.<\/p>","text_rechenweg":"<p><strong>Balance.<\/strong> The control volume is the contents of one cup (with a mug: contents and mug). From the general energy balance (Lecture 05, slide 8), without mass flows and without work, only the change in internal energy and the heat flow rate to the surroundings remain:<\/p>\n<span class=\"formel\"><math display=\"block\"><mrow><mi>C<\/mi><mspace width=\"0.167em\"/><mfrac><mrow><mi mathvariant=\"normal\">d<\/mi><mi>T<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">d<\/mi><mi>t<\/mi><\/mrow><\/mfrac><mo>=<\/mo><mo>−<\/mo><mi>k<\/mi><mi>A<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><mi>T<\/mi><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math><\/span>\n<p>with <math><mrow><mi>C<\/mi><mo>=<\/mo><mi>m<\/mi><mspace width=\"0.167em\"/><msub><mi>c<\/mi><mi>p<\/mi><\/msub><\/mrow><\/math> of the contents (with a mug, plus <span class=\"nb\"><math><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><msub><mi>c<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><\/mrow><\/math>)<\/span>. Separation of variables with <math><mrow><mi>T<\/mi><mo>(<\/mo><mi>t<\/mi><mo>=<\/mo><mn>0<\/mn><mspace width=\"0.167em\"/><mi mathvariant=\"normal\">s<\/mi><mo>)<\/mo><mo>=<\/mo><msub><mi>T<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> gives<\/p>\n<span class=\"formel\"><math display=\"block\"><mrow><mi>T<\/mi><mo>(<\/mo><mi>t<\/mi><mo>)<\/mo><mo>=<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>+<\/mo><mo>(<\/mo><msub><mi>T<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><mi>exp<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mo>−<\/mo><mfrac><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><mrow><mi>C<\/mi><\/mrow><\/mfrac><mspace width=\"0.167em\"/><mi>t<\/mi><mo>)<\/mo><mo>,<\/mo><mspace width=\"2em\"/><mi>τ<\/mi><mo>=<\/mo><mfrac><mrow><mi>C<\/mi><\/mrow><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/mfrac><mo>.<\/mo><\/mrow><\/math><\/span>\n<p><strong>kA from the measurement.<\/strong> <math><mrow><mi>k<\/mi><mi>A<\/mi><mo>=<\/mo><mo>−<\/mo><mfrac><mrow><mi>C<\/mi><\/mrow><mrow><msub><mi>t<\/mi><mi mathvariant=\"normal\">mess<\/mi><\/msub><\/mrow><\/mfrac><mi>ln<\/mi><mo>&#x2061;<\/mo><mfrac><mrow><msub><mi>T<\/mi><mi mathvariant=\"normal\">mess<\/mi><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><mrow><msub><mi>T<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math> (part c).<\/p>\n<p><strong>Mixing.<\/strong> <math><mrow><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">misch<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">K<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/msub><mspace width=\"0.167em\"/><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">K<\/mi><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">M<\/mi><\/mrow><\/msub><mspace width=\"0.167em\"/><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><\/mrow><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">K<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">M<\/mi><\/mrow><\/msub><\/mrow><\/mfrac><\/mrow><\/math> (part a; with a mug, its heat capacity is added to the cup).<\/p>\n<p><strong>Heat released.<\/strong> <math><mrow><mi>Q<\/mi><mo>=<\/mo><mi>C<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">Anfang<\/mi><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">Ende<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math> (Anfang start, Ende end) for each control volume (part e); from this, directly after the milk is added, <span class=\"formel\"><math display=\"block\"><mrow><msub><mi>C<\/mi><mi mathvariant=\"normal\">G<\/mi><\/msub><mo>(<\/mo><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><mo>)<\/mo><mo>=<\/mo><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">M<\/mi><\/mrow><\/msub><mo>(<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">M1<\/mi><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">M2<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math><\/span>; with the same milk, the last term vanishes.<\/p>\n<p><strong>When the milk is added.<\/strong> If the milk is added later, the difference changes by <span class=\"nb\"><math><mrow><mfrac><mrow><mi mathvariant=\"normal\">d<\/mi><mo>(<\/mo><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><mo>)<\/mo><\/mrow><mrow><mi mathvariant=\"normal\">d<\/mi><msub><mi>t<\/mi><mi mathvariant=\"normal\">Z<\/mi><\/msub><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mrow><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mn>1<\/mn><\/msub><\/mrow><mrow><msub><mi>C<\/mi><mi mathvariant=\"normal\">G<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math>:<\/span> it grows as long as cup 2 releases more heat, and decreases afterwards. What this means for the largest difference is in the explanations of question 1 and V2.<\/p>\n<p><strong>kA from all measured points<\/strong> (going further): line through the origin in the “ln” view, slope <math><mrow><mi>b<\/mi><mo>=<\/mo><mo>∑<\/mo><msub><mi>t<\/mi><mi>i<\/mi><\/msub><msub><mi>y<\/mi><mi>i<\/mi><\/msub><mo>/<\/mo><mo>∑<\/mo><msubsup><mi>t<\/mi><mi>i<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math> with <span class=\"nb\"><math><mrow><msub><mi>y<\/mi><mi>i<\/mi><\/msub><mo>=<\/mo><mi>ln<\/mi><mo>&#x2061;<\/mo><mfrac><mrow><msub><mi>ϑ<\/mi><mi>i<\/mi><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><mrow><msub><mi>ϑ<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math>,<\/span> then <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><mo>=<\/mo><mo>−<\/mo><mi>C<\/mi><mspace width=\"0.167em\"/><mi>b<\/mi><\/mrow><\/math>.<\/span> The scatter about the line is not a measurement uncertainty of <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>,<\/span> because all points contain the same initial value.<\/p>\n<p><strong>Keeping kA fixed<\/strong> (going further): the tool works out the value after 10 min that belongs to this <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> and passes it to the unchanged model.<\/p>","text_regler_einleitung":"<p>The default values are those of the problem. The material properties are fixed: coffee 1000 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kg<\/mi><\/mrow><mrow><msup><mi mathvariant=\"normal\">m<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> and 4.18 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kJ<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">kg<\/mi><mo>·<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> (properties of water), milk 1030 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kg<\/mi><\/mrow><mrow><msup><mi mathvariant=\"normal\">m<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> and 3.94 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kJ<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">kg<\/mi><mo>·<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> (from the solution: Goff; Tutorial 8), mug 0.85 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kJ<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">kg<\/mi><mo>·<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> (part g, working value). Subscripts as in the lecture: K coffee (Kaffee), M milk (Milch), u surroundings (Umgebung), G mixture (Gemisch), B mug (Becher), Z adding (Zugabe), ab released (abgegeben), mess measured (Messung), misch mixture (Mischung).<\/p>","titel_seite":"Coffee with milk: simulation","trink_nach":"after {t} min","trink_nie":"never (room too warm)","trink_sofort":"already when poured","trinkzeit_text":"Drinking temperature 60 °C: cup 1 {a}, black coffee {b}.","v1_eingabe":"Approximate milk temperature","v1_text":"Write down your own answer first, then agree as a pair: how warm would the milk have to be for both cups to be at roughly the same temperature after 60 min? Does this temperature depend on the time of adding the milk?","v1_titel":"Milk temperature","v2_eingabe":"Approximate time","v2_text":"Write down your own answer first, then agree as a pair: with a lid, both cups cool down more slowly. Does the largest possible difference become larger, smaller or stay the same? When does it occur? Choose “Ceramic with lid” for <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> and, as in question 1, find the time of adding with the largest difference.","v2_titel":"Lid","v3_ausgangslage":"default values, mug included, <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> from the measurement after 10 min (as in part g)","v3_text":"Write down your own answer first, then agree as a pair: the cups are preheated ceramic mugs as in part g. Does the difference become larger or smaller, and is cup 1 still warmer?","v3_titel":"Mug","v4_opt_falsch":"wrong <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> of both mugs","v4_opt_ungleich":"different <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> of the mugs","v4_text":"Write down your own answer first, then agree as a pair: mug 1 has 5 % more <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> than mug 2 (a different surface underneath); or <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> of both mugs is 10 % off. Which distorts the difference more?","v4_titel":"Planning the experiment","v5_text":"Write down your own answer first, then agree as a pair: which mug keeps the coffee       h += "<tr><td>" + t("regler_" + r.id) + "</td><td>" + r.mathml + "</td><td>" + std + " " + einheit(r.einheit) + "</td><td>" + z(r.min, r.stellen > 2 ? 2 : r.stellen) + " " + nurText(t("bis")) + " " + z(r.max, r.stellen > 2 ? 2 : r.stellen) + ", " + z(r.schritt, r.schritt < 1 ? (r.schritt < 0.1 ? 2 : 1) : 0) + " " + einheit(r.einheit) + "</td><td>" + t(r.grundlage) + "</td></tr>";
    }
    h += "<tr><td>" + t("schalter_milch2Raum") + "</td><td></td><td></td><td></td><td>" + t("g_milch2Raum") + "</td></tr>";
    return h + "</tbody></table></div>";
  }
  function reiterTasten() {
    const leiste = $("reiter-leiste"), tabs = [...leiste.querySelectorAll("[role=tab]")];
    for (const b of tabs) b.addEventListener("click", () => { S.ansicht.reiter = b.getAttribute("data-tab"); sichern(); reiterZeichnen(); scrollbereichePruefen(); });
    leiste.addEventListener("keydown", ev => {
      const i = tabs.indexOf(document.activeElement); if (i < 0) return;
      let j = null;
      if (ev.key === "ArrowRight") j = (i + 1) % tabs.length; else if (ev.key === "ArrowLeft") j = (i + tabs.length - 1) % tabs.length;
      else if (ev.key === "Home") j = 0; else if (ev.key === "End") j = tabs.length - 1;
      if (j !== null) { ev.preventDefault(); S.ansicht.reiter = tabs[j].getAttribute("data-tab"); sichern(); reiterZeichnen(); scrollbereichePruefen(); tabs[j].focus(); }
    });
  }

  // ------------------------------------------------------------------ Rückfrage, Rücksetzen, Sprache
  function bestaetigen(frageText, wennJa, ausloeser) {
    const alt = $("rueck-box"); if (alt) alt.remove();
    const b = document.createElement("div");
    b.id = "rueck-box"; b.className = "banner rueck-box"; b.setAttribute("role", "group"); b.setAttribute("aria-labelledby", "rueck-frage");
    b.innerHTML = '<p id="rueck-frage">' + frageText + '</p><div class="knopfzeile"><button type="button" class="knopf-zweit" id="rueck-ja">' + t("ja") + '</button><button type="button" class="knopf-schlicht" id="rueck-nein">' + t("abbrechen") + "</button></div>";
    const ort = ausloeser || document.activeElement;
    if (ort && ort.parentNode && ort !== document.body) ort.parentNode.insertBefore(b, ort.nextSibling); else $("link-banner").after(b);
    $("rueck-ja").addEventListener("click", ev => { if (ev.detail > 1) return; b.remove(); wennJa(); if (frageText !== t("ohne_frage")) $("knopf-info").textContent = nurText(t("zurueckgesetzt")); });
    $("rueck-nein").addEventListener("click", () => { b.remove(); if (ort && ort.focus) ort.focus(); });
    b.addEventListener("keydown", ev => { if (ev.key === "Escape") $("rueck-nein").click(); });
    $("rueck-ja").focus();
  }
  function fussZeichnen() {
    $("fuss-reset").innerHTML = '<button type="button" class="knopf-schlicht" id="knopf-gruppe">' + t("knopf_gruppe_zuruecksetzen") + "</button>";
    $("knopf-gruppe").addEventListener("click", () => bestaetigen(t("gruppe_zuruecksetzen_frage"), () => {
      S.antworten = leereAntworten(); S.aktuell = "start"; S.e = standardE(); S.vergleich = null; S.f2Uebersprungen = false;
      S.ansicht = { reiter: "versuche", vertiefung: false, diagramm: "temperatur", anheften: true };
      rechnen(); sichern(); alles(); window.scrollTo(0, 0); fokus("frage-titel");
    }));
  }

  // ------------------------------------------------------------------ Zeichnen
  function teilZeichnen(fokusId) {     // nach Reglerbewegung: nur Ergebnisse neu, Regler bleiben (kein Fokusverlust)
    diagrammZeichnen(); rechenwerteZeichnen(); energieZeichnen(); bilanzZeichnen(); wertetabelle();
    for (const r of REGLER_DEF.regler) {
      const range = $("r-" + r.id), feld = $("z-" + r.id); if (!range) continue;
      const w = r.faktor ? S.e[r.key] * r.faktor : S.e[r.key];
      if (document.activeElement !== range) range.value = w;
      range.setAttribute("aria-valuetext", wertText(r, w));
      if (document.activeElement !== feld) { feld.value = z(w, r.stellen); feld.removeAttribute("aria-invalid"); }
    }

    if (info) info.innerHTML = infoKastenInhalt();

    if (fokusId === null) frageleisteZeichnen();
  }
  function alles() {
    rechnen(); texteSetzen(); frageleisteZeichnen(); reglerZeichnen(); diagrammZeichnen(); rechenwerteZeichnen(); energieZeichnen(); bilanzZeichnen();
    wertetabelle(); messblattZeichnen(); reiterZeichnen(); fussZeichnen(); anheftenPruefen(); scrollbereichePruefen();
  }
  function scrollbereichePruefen() {     // breite Formeln und Tabellen: nur wenn sie überlaufen, per Tastatur erreichbar (WCAG 2.1.1)
    for (const el of document.querySelectorAll(".formel, .tabelle-wrap")) {
      if (el.scrollWidth > el.clientWidth + 1) { el.setAttribute("tabindex", "0"); if (!el.hasAttribute("aria-labelledby")) { el.setAttribute("role", "region"); el.setAttribute("aria-label", nurText(t(el.classList.contains("formel") ? "bereich_formel" : "bereich_tabelle"))); } }
      else { el.removeAttribute("tabindex"); if (!el.hasAttribute("aria-labelledby")) { el.removeAttribute("role"); el.removeAttribute("aria-label"); } }
    }
  }
  function anheftenPruefen() {
    const vv = window.visualViewport, hoehe = vv ? vv.height : window.innerHeight;
    const feldFokus = document.activeElement && document.activeElement.type === "text" && !!document.activeElement.closest("#messblatt");   // Frageleiste nicht: sonst springt der Knopf beim Verlassen des Feldes (G9-01)
    const tastatur = feldFokus || vv && document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && document.activeElement.type !== "range" && hoehe < window.innerHeight * 0.8;
    const an = S.ansicht.anheften && freigabe() && hoehe >= 500 && !tastatur && window.innerWidth <= 767 && window.innerHeight > window.innerWidth;
    document.documentElement.classList.toggle("anheften", !!an);
    document.documentElement.classList.toggle("handy", freigabe() && window.innerWidth <= 767);   // Reihenfolge Diagramm, Frage, Regler (M-6)
    const moeglich = freigabe() && window.innerWidth <= 767 && window.innerHeight > window.innerWidth && hoehe >= 500;
    const kn = $("knopf-anheften");
    if (kn) { kn.hidden = !moeglich; kn.textContent = nurText(t("anheften_an")); kn.setAttribute("aria-pressed", S.ansicht.anheften ? "true" : "false"); }
    document.documentElement.style.setProperty("--anheft", an ? Math.ceil($("diagramm-halter").getBoundingClientRect().height) + "px" : "0px");
  }
  $("sprachknopf").addEventListener("click", () => { S.sprache = S.sprache === "de" ? "en" : "de"; $("knopf-info").textContent = ""; $("ansage").textContent = ""; sichern(); alles();
    try { if (/[?&]lang=/.test(location.search)) history.replaceState(null, "", location.pathname + location.search.replace(/([?&])lang=(de|en)(&|$)/, (m, a, b, c) => (c ? a : "")).replace(/\?$/, "") + location.hash); } catch (x) { }
    if ($("link-ja")) kurslinkPruefen();
    $("sprachknopf").focus(); });
  $("knopf-standard").addEventListener("click", () => { ausgangslage("standard"); rechnen(); sichern(); alles(); $("knopf-info").innerHTML = t("knopf_standard_info"); ansagen(); });
  $("knopf-versuch").addEventListener("click", () => { Object.assign(S.e, { tEnd_min: 60, becher: true, kAQuelle: "messung", kAHerkunft: "messung" }); if (!(S.e.thMess > S.e.thU && S.e.thMess < S.e.thK0)) S.e.thMess = 67; rechnen(); sichern(); alles(); $("knopf-info").innerHTML = t("knopf_versuch_info"); ansagen(); });
  for (const b of document.querySelectorAll("[data-ansicht]")) b.addEventListener("click", () => { S.ansicht.diagramm = b.getAttribute("data-ansicht"); sichern(); alles(); b.focus(); });
  $("vertiefung").addEventListener("toggle", () => { const auf = $("vertiefung").open; if (auf !== !!S.ansicht.vertiefung) { S.ansicht.vertiefung = auf; if (!auf && S.ansicht.diagramm !== "temperatur") S.ansicht.diagramm = "temperatur"; sichern(); alles(); } });
  reiterTasten();
  let groesse = null;
  document.addEventListener("toggle", scrollbereichePruefen, true);
  $("knopf-anheften").addEventListener("click", () => { S.ansicht.anheften = !S.ansicht.anheften; sichern(); anheftenPruefen(); $("knopf-anheften").focus(); });
  window.addEventListener("resize", () => { clearTimeout(groesse); groesse = setTimeout(() => { diagrammZeichnen(); anheftenPruefen(); scrollbereichePruefen(); }, 80); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", anheftenPruefen);
  document.addEventListener("focusin", anheftenPruefen); document.addEventListener("focusout", () => setTimeout(anheftenPruefen, 50));
  alles();
  kurslinkPruefen();
  window.addEventListener("storage", ev => {      // G8-R2-05: Fokus bleibt nach dem Abgleich
    if (!ev.key || ev.key.indexOf(SPEICHER) !== 0 || ev.key === SPEICHER + "probe") return;
    const fid = document.activeElement && document.activeElement.id;
    laden(); alles();
    if (fid && $(fid)) $(fid).focus({ preventScroll: true });
  });
  window.addEventListener("hashchange", kurslinkPruefen);
  window.KAFFEE = { zustand: () => JSON.parse(JSON.stringify({ e: S.e, antworten: S.antworten, aktuell: S.aktuell, kurs: S.kurs, ansicht: S.ansicht, sprache: S.sprache })), ergebnis: () => (freigabe() ? R : null), speicherOk: () => speicherOk, csv: () => csvBauen() };
})();
