/* ==== gemeinsam.css: Pflichtteile aller drei Entwürfe (vor der stil.css des Entwurfs eingebunden) ====
   1 Grundregeln, 2 Bildschirmleser und Sprungverweis, 3 Diagrammfarben über Attributselektoren,
   4 Handy nach der Freigabe: Diagramm, Frage, Regler (M-6) und Anheften, 5 reduzierte Bewegung, 6 erzwungene Farben.
   Die Entwürfe setzen nur die Variablen und alles Aussehen; die Abläufe hier gelten für alle. */

/* 1 Grundregeln */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; overflow-wrap: break-word; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled, input:disabled { cursor: not-allowed; }
table { border-collapse: collapse; }
.tabelle-wrap, .formel { max-width: 100%; overflow-x: auto; }
.formel { display: block; margin: .5em 0; }
math { font-family: var(--schrift-formel); }
.nb { white-space: nowrap; }
.knopf-text { min-height: 24px; }
:focus-visible { outline: 3px solid var(--fokus, #000); outline-offset: 2px; }

/* 2 Bildschirmleser und Sprungverweis */
.nur-leser { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.sprung { position: absolute; left: 8px; top: -100px; z-index: 50; display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; }
.sprung:focus { top: 8px; }

/* 3 Diagrammfarben: Das Skript schreibt feste Farbwerte als SVG-Attribute; CSS-Eigenschaften gehen Attributen vor.
   So bleibt das Skript unverändert, und jeder Entwurf setzt nur die Variablen. Bedeutung der Werte (heutiger Code):
   #8b5a2b Tasse 1 · #7a4e24 Beschriftung Tasse 1 · #222 Tasse 2 · #3d70a3 Becher 3 · #8a8984 Raum · #5a6b7f Achsen
   #142337 Achsentitel · #e6ebf0 Raster · #fff Fläche (Marker) · #173d5e Hilfslinien · #eef5fb und #102d49 Vorhersagekasten
   #227b48 und #14603f Vorhersagelinie, Trinklinie · #fbecec #b63434 #862828 ungültig · #f3e9df Tasseninhalt (Bilanzraum) */
svg text { fill: var(--dia-text); font-family: var(--schrift-dia); }
svg [stroke="#8b5a2b"] { stroke: var(--k1); }
svg [fill="#8b5a2b"] { fill: var(--k1); }
svg [fill="#7a4e24"] { fill: var(--k1-text); }
svg [stroke="#222"] { stroke: var(--k2); }
svg [fill="#222"] { fill: var(--k2); }
svg [stroke="#3d70a3"] { stroke: var(--k3); }
svg [fill="#3d70a3"] { fill: var(--k3); }
svg [stroke="#8a8984"] { stroke: var(--raum); }
svg [stroke="#5a6b7f"] { stroke: var(--achse); }
svg [fill="#5a6b7f"] { fill: var(--achse-text); }
svg [fill="#142337"] { fill: var(--dia-text); }
svg [stroke="#e6ebf0"] { stroke: var(--gitter); }
svg [fill="#fff"] { fill: var(--dia-grund); }
svg [stroke="#fff"] { stroke: var(--dia-grund); }
svg [stroke="#173d5e"] { stroke: var(--hilfslinie); }
svg [fill="#173d5e"] { fill: var(--hilfslinie); }
svg [fill="#eef5fb"] { fill: var(--vh-grund); }
svg [fill="#102d49"] { fill: var(--vh-text); }
svg [stroke="#227b48"], svg [stroke="#14603f"] { stroke: var(--gruen); }
svg [fill="#14603f"] { fill: var(--gruen); }
svg [fill="#fbecec"] { fill: var(--fehler-grund); }
svg [stroke="#b63434"] { stroke: var(--fehler); }
svg [fill="#862828"] { fill: var(--fehler); }
svg [fill="#f3e9df"] { fill: var(--tasse-grund); }
#diagramm { display: block; }

/* 4 Handy nach der Freigabe (Klasse „handy“ setzt das Skript): Diagramm oben, darunter die Frage, dann der Regler (M-6).
   Die Hüllen werden mit display: contents aufgelöst, damit die Reihenfolge im Flex-Fluss der Simulation gilt. */
@media (max-width: 767px) {
  html.handy .simulation { display: flex; flex-direction: column; }
  html.handy .sim-raster, html.handy .diagramm { display: contents; }
  html.handy .diagramm-halter { order: 1; }
  html.handy .frageleiste { order: 2; }
  html.handy .knopf-anheften { order: 3; }
  html.handy .regler-pflicht { order: 4; }
  html.handy .ansichten { order: 5; }
  html.handy .diagramm figcaption { order: 6; }
  html.handy .wertetabelle { order: 7; }
  html.handy .knoepfe { order: 8; }
  html.handy .regler-raster { order: 9; }
  html.handy .messblatt { order: 10; }
  html.anheften .diagramm-halter { position: sticky; top: 0; z-index: 6; }
}

/* 5 Reduzierte Bewegung */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* 6 Erzwungene Farben (Windows-Kontrastmodus): Linienart und Beschriftung tragen die Bedeutung weiter */
@media (forced-colors: active) {
  svg [stroke] { stroke: CanvasText; }
  svg text { fill: CanvasText; }
  :focus-visible { outline-color: Highlight; }
}
/* ==== Entwurf B „Kaffeehaus“: Milchschaum, Crema, Espresso; große weiche Karten, Serifen für Überschriften ====
   Schriften: Fraunces (Überschriften, Kernzahlen), Source Sans 3 (Text), STIX Two Math (Formeln). Kontraste siehe RICHTUNGEN.md.
   Anpassung der TL (06.11.2026): Diagramm auf einer rechteckigen Fläche, so groß wie möglich; die Wärme kommt aus Farben,
   Schrift und Karten. */
:root {
  --schaum: #fbf6ee; --karte: #ffffff; --crema: #f3e6d3; --crema-tief: #e9d6bb; --espresso: #3b2416; --text: #2b1d14; --leise: #6a5646;
  --rand: #e3d3bd; --rand-stark: #8c7660; --karamell: #9a5a22; --pistazie: #3f6b4f; --pistazie-hell: #e8f0ea; --rot: #a12a24; --rot-hell: #fbeceb;
  --fokus: #3f6b4f;
  --schatten: 0 1px 2px rgba(59, 36, 22, .06), 0 10px 28px rgba(59, 36, 22, .07);
  --schrift: "Source Sans 3", "STIX Two Math", system-ui, sans-serif;
  --schrift-titel: "Fraunces", Georgia, serif;
  --schrift-formel: "STIX Two Math", "Source Sans 3", math;
  /* Diagramm */
  --k1: #9a5a22; --k1-text: #87501d; --k2: #1f140d; --k3: #2f5f8a; --raum: #857464; --achse: #6a5646; --achse-text: #6a5646;
  --dia-text: #2b1d14; --gitter: #e2d0b6; --dia-grund: #fdf8f1; --hilfslinie: #3b2416; --vh-grund: #e8f0ea; --vh-text: #24432f;
  --gruen: #3f6b4f; --fehler: #a12a24; --fehler-grund: #fbeceb; --tasse-grund: #f3e6d3;
  --schrift-dia: "Source Sans 3", "STIX Two Math", sans-serif;
  --dia-schrift: 13; --dia-zeichenbreite: 0.52; --dia-rand-links: 50; --dia-max-breite: 1100; --dia-verhaeltnis: 0.58; --dia-hoehe: 0.6;
  --dia-handy-verhaeltnis: 0.74; --dia-handy-hoehe: 0.31;
}
html { background: var(--schaum); color: var(--text); font-family: var(--schrift); line-height: 1.55; }
body { background: var(--schaum); font-size: 1.0625rem; }
h1, h2, h3 { font-family: var(--schrift-titel); font-weight: 600; line-height: 1.15; margin: 0 0 .45em; letter-spacing: -.005em; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.15rem; }
p { margin: 0 0 .75em; }
a { color: var(--pistazie); }
strong, b { font-weight: 600; }
code { font-size: .92em; background: var(--crema); padding: .05em .35em; border-radius: 6px; }
.klein { font-size: .9rem; color: var(--leise); }
.hinweis { color: var(--leise); }
.hinweis strong { color: var(--text); }
:focus-visible { outline: 3px solid var(--fokus); outline-offset: 3px; border-radius: 6px; }

.sprung { background: var(--espresso); color: #fff8ee; border-radius: 999px; font-weight: 600; text-decoration: none; }
.banner { margin: 12px 16px 0; padding: 14px 18px; background: var(--karte); border: 2px solid var(--pistazie); border-radius: 16px; box-shadow: var(--schatten); }
.rueck-box { margin: 12px 0; }

/* Kopf: ruhig, mit Espresso-Marke */
.kopf { display: flex; align-items: center; gap: 14px; max-width: 1360px; margin: 0 auto; padding: 18px 20px 6px; }
.kopf-marke { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--espresso); color: #fff8ee; display: grid; place-content: center; font-family: var(--schrift-titel); font-weight: 600; font-size: 1rem; }
.kopf-texte { flex: 1; min-width: 0; }
.kopf-zeile { margin: 0; font-size: .9rem; color: var(--leise); }
.kopf-titel { margin: 0; font-size: 1.75rem; }
.kopf-rechts { display: flex; align-items: center; gap: 12px; }
.kopf-speicher { margin: 0; font-size: .85rem; color: var(--leise); max-width: 15em; text-align: right; }
.kopf-speicher.aus { color: var(--rot); font-weight: 600; }
.sprachknopf { min-height: 44px; padding: 0 16px; border: 1.5px solid var(--rand-stark); border-radius: 999px; background: var(--karte); }
.sprachknopf:hover { background: var(--crema); }
@media (max-width: 600px) {
  .kopf { padding: 12px 14px 2px; gap: 10px; }
  .kopf-marke { width: 38px; height: 38px; font-size: .85rem; }
  .kopf-titel { font-size: 1.3rem; }
  .kopf-zeile { font-size: .8rem; }
  .kopf-speicher { display: none; }
}

main { display: block; }
main:focus { outline: none; }
.seite { max-width: 1360px; margin: 0 auto; padding: 14px 20px 28px; }
@media (max-width: 600px) { .seite { padding: 10px 12px 24px; } }
.simulation { display: grid; gap: 18px; }

/* Karten */
.frageleiste, .diagramm, .energie, .bilanz, .rechenwerte, .vertiefung, .messblatt, .reiter-panel { background: var(--karte); border: 1px solid var(--rand); border-radius: 20px; box-shadow: var(--schatten); }

/* Frageleiste als große Karte */
.frageleiste { padding: 22px 24px; }
.frage-nr { display: inline-block; margin: 0 0 8px; padding: 3px 12px; border-radius: 999px; background: var(--crema); color: var(--espresso); font-size: .85rem; font-weight: 600; }
#frage-titel { font-size: 1.75rem; }
.frage-text { font-size: 1.08rem; }
.frage-text-zu > summary { min-height: 44px; display: inline-flex; align-items: center; cursor: pointer; color: var(--pistazie); font-weight: 600; }
.frage-eingabe { margin: 16px 0 8px; display: grid; gap: 16px; }
.frage-eingabe fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.frage-eingabe legend { padding: 0; margin-bottom: 8px; font-weight: 600; }
.wahl { display: grid; gap: 10px; }
.wahl label, .radio-zeile label { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 16px; border: 2px solid var(--rand); border-radius: 16px; background: var(--karte); cursor: pointer; font-size: 1.05rem; }
.radio-zeile { display: grid; gap: 8px; }
.radio-zeile label { min-height: 48px; font-size: 1rem; }
.wahl label:hover, .radio-zeile label:hover { border-color: var(--rand-stark); background: #fffaf3; }
.wahl label:has(input:checked), .radio-zeile label:has(input:checked) { background: var(--espresso); border-color: var(--espresso); color: #fff8ee; font-weight: 600; }
input[type="radio"] { appearance: none; -webkit-appearance: none; flex: none; width: 22px; height: 22px; margin: 0; border-radius: 50%; border: 2px solid var(--rand-stark); background: var(--karte); display: grid; place-content: center; }
input[type="radio"]::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--espresso); transform: scale(0); }
input[type="radio"]:checked { border-color: #fff8ee; background: #fff8ee; }
input[type="radio"]:checked::before { transform: scale(1); }
input[type="checkbox"] { appearance: none; -webkit-appearance: none; flex: none; width: 44px; height: 26px; margin: 0; border-radius: 999px; background: #d8c6ae; border: 2px solid var(--rand-stark); position: relative; }
input[type="checkbox"]::before { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--karte); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
input[type="checkbox"]:checked { background: var(--pistazie); border-color: var(--pistazie); }
input[type="checkbox"]:checked::before { left: 20px; }
input[type="checkbox"]:disabled { opacity: .55; }
.feld { display: grid; gap: 6px; font-weight: 600; }
.feld-einheit { display: inline-flex; align-items: center; gap: 8px; font-weight: 400; }
.feld input, .zahlfeld, .messtabelle input, .mess-zusatz input { min-height: 46px; padding: 8px 12px; border: 1.5px solid var(--rand-stark); border-radius: 12px; background: var(--karte); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.feld input { width: 7.5em; }
.feld-breit input { width: 100%; }
input[aria-invalid="true"] { border-color: var(--rot); background: var(--rot-hell); }
.frage-knoepfe { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 14px 0 4px; }
.frage-nav { display: flex; gap: 8px; }
.auftrag { padding: 12px 16px; border-radius: 14px; background: var(--pistazie-hell); color: #24432f; font-weight: 600; }
.auftrag .klein { color: #24432f; font-weight: 400; }
.rueckblick { padding: 14px 16px 6px; margin-bottom: 18px; border-radius: 16px; background: var(--schaum); border: 1px dashed var(--rand-stark); }
.aufloesung { padding: 14px 16px; margin: 12px 0; border-radius: 16px; background: #f6efe4; border-left: 6px solid var(--karamell); }
.vergleich-ok { color: #2f6b45; font-weight: 600; }
.vergleich-nein { color: var(--rot); font-weight: 600; }

/* Knöpfe als Pillen */
.knopf-haupt, .knopf-zweit, .knopf-schlicht, .umschalter, .pm, .hilfe-knopf { min-height: 44px; min-width: 44px; border-radius: 999px; font-weight: 600; line-height: 1.2; }
.knopf-haupt { min-height: 54px; padding: 12px 26px; background: var(--espresso); color: #fff8ee; border: 0; font-size: 1.05rem; box-shadow: 0 6px 16px rgba(59, 36, 22, .22); }
.knopf-haupt:hover:not(:disabled) { background: #24150c; }
.knopf-haupt:disabled { background: #e6dccd; color: #6a5646; box-shadow: none; }
.knopf-zweit { padding: 10px 20px; background: var(--karte); color: var(--espresso); border: 2px solid var(--espresso); }
.knopf-zweit:hover:not(:disabled) { background: var(--crema); }
.knopf-schlicht { padding: 10px 18px; background: var(--crema); color: var(--espresso); border: 1px solid var(--rand); }
.knopf-schlicht:hover:not(:disabled) { background: var(--crema-tief); }
.knopf-text { padding: 2px 0; background: none; border: 0; color: var(--pistazie); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.knopf-zweit:disabled, .knopf-schlicht:disabled, .pm:disabled, .hilfe-knopf:disabled { color: #7a6a5c; border-color: #d8c9b6; background: #f4ede3; }
.knopfzeile { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.knopf-info { margin: 0; color: var(--leise); }

/* Ansichten als Segmentschalter */
.ansichten { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 999px; background: var(--crema); width: fit-content; max-width: 100%; }
.umschalter { padding: 8px 16px; background: transparent; border: 0; color: var(--espresso); }
.umschalter[aria-pressed="true"] { background: var(--espresso); color: #fff8ee; }
.voreinstellungen .umschalter { background: var(--crema); border: 1px solid var(--rand); }
.voreinstellungen .umschalter[aria-pressed="true"] { background: var(--espresso); color: #fff8ee; }

/* Diagramm: rechteckige Fläche, so groß wie möglich */
.diagramm { margin: 0; padding: 14px 14px 16px; min-width: 0; }
.diagramm-halter { display: flex; flex-direction: column; background: var(--dia-grund); border: 1px solid var(--crema-tief); border-radius: 6px; padding: 6px 4px 0; }
#diagramm { margin: 0 auto; }
.kernzahlen { display: flex; flex-wrap: wrap; gap: 6px 28px; padding: 10px 14px 12px; border-top: 1px solid var(--crema-tief); background: var(--karte); border-radius: 0 0 6px 6px; margin: 4px -4px 0; }
.kernzahlen:empty { display: none; }
.kernzahlen span, .kern-leiste span { display: flex; align-items: baseline; gap: 8px; color: var(--leise); font-size: .95rem; }
.kernzahlen b, .kern-leiste b { font-family: var(--schrift-titel); font-size: 1.7rem; font-weight: 600; color: var(--text); font-variant-numeric: lining-nums tabular-nums; }
.kernzahlen span:last-child b { color: var(--karamell); }
.vorhersage-zeile, .kurven-legende { margin: 6px 12px; font-size: .95rem; }
.sym { width: 1.4em; height: .9em; vertical-align: middle; }
.sym-flaeche { width: 1em; height: 1em; }
.knopf-anheften { margin: 6px 4px 0; }
.regler-pflicht { padding: 12px 4px 0; }
.diagramm figcaption { padding: 6px 4px 0; color: var(--leise); }
.lesehinweis { margin: 4px 0; font-size: .95rem; }
.legende-mess, .flaechen { margin: 4px 0; color: var(--text); }
.wertetabelle { margin: 6px 4px 0; }
.wertetabelle > summary, .vertiefung > summary, .karte > summary, .abschnitt > summary { min-height: 48px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; list-style: none; }
summary::-webkit-details-marker { display: none; }
.wertetabelle > summary, .karte > summary, .abschnitt > summary, .vertiefung > summary { position: relative; }
.wertetabelle > summary::after, .karte > summary::after, .abschnitt > summary::after, .vertiefung > summary::after { content: ""; flex: none; width: 10px; height: 10px; border-right: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: rotate(45deg); margin-left: auto; margin-right: 6px; }
details[open] > summary::after { transform: rotate(-135deg); }
.wertetabelle > summary { color: var(--pistazie); width: fit-content; }
.wertetabelle > summary::after { margin-left: 4px; }
#diagramm polyline[stroke="#8b5a2b"] { stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
#diagramm polyline[stroke="#222"] { stroke-width: 2.8; }
#diagramm text[font-weight="600"] { font-weight: 600; }

/* Tabellen */
.tabelle-wrap { margin: 10px 0; border-radius: 12px; }
table { font-size: .95rem; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--rand); }
thead th { background: var(--crema); text-align: left; vertical-align: bottom; font-weight: 600; }
tbody th { text-align: left; font-weight: 400; color: var(--leise); }

/* Energie, Bilanzraum, Rechenwerte */
.knoepfe { display: flex; flex-wrap: wrap; align-content: start; gap: 10px; min-width: 0; }
.knoepfe .knopf-info { flex-basis: 100%; }
.energie, .bilanz, .rechenwerte { flex-basis: 100%; padding: 18px 20px; }
.kasten-titel { font-size: 1.1rem; }
.energie svg, .bilanz svg { display: block; width: 100%; max-width: 340px; height: auto; }
.energie-satz { margin: 10px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--crema); font-weight: 600; }
.rechenwerte dl { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.rechenwerte dt, .rechenwerte dd { overflow-wrap: anywhere; }
.rechenwerte dl > div.breit { grid-column: 1 / -1; }
.rechenwerte dt { font-size: .9rem; color: var(--leise); }
.rechenwerte dd { margin: 0; font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }

/* Regler: dicke runde Spur, runder Karamell-Griff */
.regler-gitter { display: grid; gap: 18px; }
.regler { min-width: 0; }
.regler-kopf { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.regler-name { font-weight: 600; }
.hilfe-knopf { width: 44px; height: 44px; padding: 0; border: 1.5px solid var(--rand); background: var(--schaum); color: var(--espresso); font-family: var(--schrift-titel); font-size: 1.05rem; flex: none; }
.hilfe-text { padding: 10px 14px; border-radius: 12px; background: var(--schaum); font-size: .95rem; }
.regler-zeile { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px 5.6em; gap: 10px; align-items: center; }
.pm { width: 44px; padding: 0; background: var(--crema); border: 1px solid var(--rand); color: var(--espresso); font-size: 1.3rem; }
.pm:hover:not(:disabled) { background: var(--crema-tief); }
.zahlfeld { width: 100%; text-align: right; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; height: 44px; margin: 0; background: transparent; }
input[type="range"]::-webkit-slider-runnable-track { height: 12px; border-radius: 999px; background: linear-gradient(90deg, var(--crema-tief), var(--karamell)); border: 1px solid var(--rand-stark); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -10px; border-radius: 50%; background: var(--karte); border: 6px solid var(--espresso); box-shadow: 0 2px 6px rgba(59, 36, 22, .3); }
input[type="range"]::-moz-range-track { height: 12px; border-radius: 999px; background: linear-gradient(90deg, var(--crema-tief), var(--karamell)); border: 1px solid var(--rand-stark); }
input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--karte); border: 6px solid var(--espresso); }
input[type="range"]:disabled::-webkit-slider-runnable-track { background: #eee5d8; border-color: #d8c9b6; }
input[type="range"]:disabled::-webkit-slider-thumb { border-color: #a9978a; box-shadow: none; }
.gesperrt .regler-name { color: var(--leise); }
.feld-fehler { margin: 6px 0 0; font-size: .92rem; color: var(--rot); }
.feld-fehler:empty { display: none; }
.feld-fehler.neutral { color: var(--leise); }
.fehler-meldung { padding: 12px 16px; border-radius: 14px; background: var(--rot-hell); color: var(--rot); border: 1.5px solid var(--rot); font-weight: 600; }
.schalter { display: flex; align-items: center; gap: 12px; min-height: 44px; flex-direction: row-reverse; justify-content: flex-end; cursor: pointer; }
.gruppe { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 14px; }
.gruppe-titel { font-size: 1.2rem; margin: 6px 0 0; }
.voreinstellungen { display: flex; flex-wrap: wrap; gap: 8px; }
.info-kasten { padding: 12px 14px; border-radius: 14px; background: var(--schaum); border: 1px solid var(--rand); }

/* Vertiefung, Messblatt */
.regler-raster { display: grid; gap: 18px; min-width: 0; }
.regler-bereich { min-width: 0; }
.vertiefung > summary { padding: 6px 22px; font-family: var(--schrift-titel); font-size: 1.3rem; min-height: 60px; }
.vertiefung-inhalt { padding: 4px 22px 22px; }
.hinweis-frueh { margin: 0 22px 12px; padding: 12px 16px; border-radius: 14px; background: var(--pistazie-hell); color: #24432f; }
.kern-leiste { display: none; }
.messblatt { padding: 20px 22px; min-width: 0; }
.messblatt h2 { font-size: 1.4rem; }
.messtabelle input { width: 5.6em; text-align: right; }
.messtabelle td { padding: 4px 6px; }
.messtabelle input:disabled { background: #f1eadf; border-color: #e0d3c2; }
.mess-zusatz { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: end; margin: 12px 0; }
.mess-zusatz .feld input { width: 6em; }
#link-ausgabe input, #link-ausgabe textarea { width: 100%; min-height: 44px; border-radius: 12px; }

/* Reiter als Pillen */
.reiter-bereich { margin-top: 32px; }
.reiter { display: flex; flex-wrap: wrap; gap: 6px; padding: 5px; border-radius: 999px; background: var(--crema); width: fit-content; max-width: 100%; margin-bottom: 14px; }
.reiter [role="tab"] { min-height: 44px; padding: 8px 20px; border: 0; border-radius: 999px; background: transparent; color: var(--espresso); font-weight: 600; }
.reiter [role="tab"][aria-selected="true"] { background: var(--espresso); color: #fff8ee; }
.reiter-panel { padding: 20px 24px; }
.reiter-panel:focus-visible { outline-offset: -4px; }
.karte, .abschnitt { border-bottom: 1px solid var(--rand); }
.karte:last-of-type, .abschnitt:last-of-type { border-bottom: 0; }
.karte > summary, .abschnitt > summary { font-family: var(--schrift-titel); font-size: 1.1rem; }
.karte[open], .abschnitt[open] { padding-bottom: 12px; }
.karte-status { font-family: var(--schrift); font-weight: 400; font-size: .9rem; color: var(--leise); }
.reiter-panel ul { padding-left: 1.2em; }
.reiter-panel li { margin-bottom: .4em; }

.fuss { max-width: 1360px; margin: 10px auto 0; padding: 18px 20px 28px; font-size: .9rem; color: var(--leise); }

/* ---- Laptop und Beamer: eine breite Mittelspalte. Vor der Vorhersage steht die Startkarte oben, danach das Diagramm
   (über die ganze Breite), darunter Frage und Energie nebeneinander, dann Vertiefung mit Rechenwerten und Messblatt.
   „Danach“ erkennt die CSS daran, dass die Vertiefung sichtbar ist (das Skript blendet sie erst nach der Freigabe ein). ---- */
@media (min-width: 1024px) {
  .simulation { grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); column-gap: 22px; align-items: start;
    grid-template-areas: "frage frage" "ansichten ansichten" "dia dia" "seite seite" "regler regler" "mess mess"; }
  .simulation:has(#vertiefung:not([hidden])) { grid-template-areas: "ansichten ansichten" "dia dia" "frage seite" "regler regler" "mess mess"; }
  .frageleiste { grid-area: frage; padding: 24px 28px; }
  .simulation:not(:has(#vertiefung:not([hidden]))) .frageleiste { max-width: 860px; }
  .ansichten { grid-area: ansichten; }
  .sim-raster { display: contents; }
  .diagramm { grid-area: dia; }
  .knoepfe { grid-area: seite; }
  .regler-raster { grid-area: regler; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); align-items: start; }
  .messblatt { grid-area: mess; }
  .vertiefung-inhalt .regler-gitter { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-items: start; }
  .diagramm .regler-pflicht, .diagramm figcaption, .diagramm .wertetabelle, .diagramm .knopf-anheften { max-width: 900px; }
}
@media (min-width: 1024px) and (max-height: 800px) {
  .kopf { padding-top: 10px; }
  .kopf-titel { font-size: 1.45rem; }
  .seite { padding-top: 8px; }
  .diagramm { padding: 10px 10px 12px; }
  .kernzahlen b { font-size: 1.45rem; }
}

/* ---- Handy ---- */
@media (max-width: 767px) {
  .frageleiste { padding: 18px 16px; border-radius: 18px; }
  #frage-titel { font-size: 1.45rem; }
  .diagramm { padding: 10px 8px 12px; border-radius: 18px; }
  .diagramm-halter { padding: 4px 0 0; }
  .kernzahlen { gap: 4px 16px; padding: 6px 10px 8px; margin: 2px 0 0; }
  .kernzahlen span { font-size: .85rem; gap: 5px; }
  .kernzahlen b { font-size: 1.2rem; }
  .vorhersage-zeile, .kurven-legende { font-size: .82rem; margin: 2px 8px 4px; line-height: 1.3; }
  html.handy .diagramm-halter { margin: 0 -2px; box-shadow: 0 6px 14px rgba(59, 36, 22, .12); border-radius: 0 0 12px 12px; }
  html.handy .regler-pflicht, html.handy .knopf-anheften, html.handy .diagramm figcaption, html.handy .wertetabelle { padding-left: 4px; padding-right: 4px; }
  .regler-zeile { grid-template-columns: 44px minmax(0, 1fr) 44px 4.6em; gap: 6px; }
  .vertiefung > summary { padding: 6px 16px; }
  .vertiefung-inhalt { padding: 4px 16px 18px; }
  .messblatt, .reiter-panel { padding: 16px; }
  .messtabelle input { width: 4.4em; }
  .reiter { border-radius: 18px; }
}
@media (max-width: 380px) {
  .kernzahlen { flex-wrap: nowrap; justify-content: space-between; gap: 6px; padding: 6px 8px 8px; }
  .kernzahlen span { white-space: nowrap; font-size: .78rem; gap: 3px; }
  .kernzahlen b { font-size: 1.05rem; }
}

<script>// Kaffee mit Milch: Simulation. Gebaut aus simulation/site/src mit simulation/site/bauen.py (Stand 2026-11-05, Quellen bad8a5feda).
// MODELL-ANFANG: gleiche Gleichungen und Standardwerte wie kaffee_modell.py (rechne, zwei_tassen)
const P = { V_K: 200e-6, rho_K: 1000.0, cp_K: 4180.0, V_M: 30e-6, rho_M: 1030.0, cp_M: 3940.0, th_K0: 80.0, th_M: 5.0,
            th_U: 20.0, t_end: 60 * 60.0, t_mess: 10 * 60.0, th_mess: 67.0, th_Mh: 60.0, m_B: 0.300, c_B: 850.0 };
const K = 273.15;

function rechne(p) {
  const r = Object.assign({}, p);
  r.m_K = p.rho_K * p.V_K;
  r.m_M = p.rho_M * p.V_M;
  r.C_K = r.m_K * p.cp_K;
  r.C_M = r.m_M * p.cp_M;
  r.C_G = r.C_K + r.C_M;
  const T_K0 = p.th_K0 + K, T_M = p.th_M + K, T_U = p.th_U + K;
  Object.assign(r, { T_K0: T_K0, T_M: T_M, T_U: T_U, T_mess: p.th_mess + K });
  r.ln_mess = Math.log((r.T_mess - T_U) / (T_K0 - T_U));
  r.kA = -r.C_K / p.t_mess * r.ln_mess;
  r.a_K = r.kA / r.C_K;
  r.a_G = r.kA / r.C_G;
  const mix = TK => (r.C_K * TK + r.C_M * T_M) / r.C_G;
  r.T1_0 = mix(T_K0);
  r.e_G = Math.exp(-r.a_G * p.t_end);
  r.T1 = T_U + (r.T1_0 - T_U) * r.e_G;
  r.e_K = Math.exp(-r.a_K * p.t_end);
  r.T2_K = T_U + (T_K0 - T_U) * r.e_K;
  r.T2 = mix(r.T2_K);
  r.dT = r.T1 - r.T2;
  r.Q1 = r.C_G * (r.T1_0 - r.T1);
  r.Q2 = r.C_K * (T_K0 - r.T2_K);
  const d = r.a_K - r.a_G;
  r.t_schnitt = d > 0 ? Math.log((T_K0 - T_U) / (r.T1_0 - T_U)) / d : Infinity;
  return r;
}

function zweiTassen(p, C_T = 0.0, th_M1 = null, th_M2 = null, kA1_faktor = 1.0, t_end = null) {
  const r = rechne(p);
  th_M1 = th_M1 === null ? p.th_M : th_M1;
  th_M2 = th_M2 === null ? th_M1 : th_M2;
  const t = t_end === null ? p.t_end : t_end;
  const CKT = r.C_K + C_T, CGT = r.C_G + C_T;
  const kA = -CKT / p.t_mess * r.ln_mess;
  const T10 = (CKT * r.T_K0 + r.C_M * (th_M1 + K)) / CGT;
  const T1 = r.T_U + (T10 - r.T_U) * Math.exp(-kA1_faktor * kA * t / CGT);
  const T2K = r.T_U + (r.T_K0 - r.T_U) * Math.exp(-kA * t / CKT);
  const T2 = (CKT * T2K + r.C_M * (th_M2 + K)) / CGT;
  return { kA: kA, T1_0: T10, T1: T1, T2_K: T2K, T2: T2, dT: T1 - T2, th1: T1 - K, th2: T2 - K };
}

// Einstellungen des Werkzeugs (Einheiten der Regler) in die Größen des Modells übersetzen und auswerten
function berechne(e) {
  const p = Object.assign({}, P, { V_K: e.VK_ml * 1e-6, V_M: e.VM_ml * 1e-6, th_K0: e.thK0, th_M: e.thM, th_U: e.thU,
                                   th_mess: e.thMess, m_B: e.mB_g / 1000, t_end: e.tEnd_min * 60.0 });
  const r = rechne(p);
  const C_T = e.becher ? p.m_B * p.c_B : 0.0;
  const th_M2 = e.milch2Raum ? p.th_U : p.th_M;
  const z = zweiTassen(p, C_T, p.th_M, th_M2, e.kA1Faktor, p.t_end);
  const CKT = r.C_K + C_T, CGT = r.C_G + C_T;
  const a1 = e.kA1Faktor * z.kA / CGT, a2 = z.kA / CKT;          // Abklingraten von Tasse 1 und vom schwarzen Kaffee
  // abgegebene Wärme bis zur Zugabe: Energiebilanz um den Bilanzraum (Inhalt, mit Becher auch der Becher), wie Teil e
  const Q1 = CGT * (z.T1_0 - z.T1), Q2 = CKT * (r.T_K0 - z.T2_K);
  // Schnittpunkt der beiden Kurven vor der Zugabe, in beiden Richtungen (wie t_schnitt in rechne(), dort nur für a2 > a1):
  // (T_K0 - T_U) exp(-a2 t) = (T1_0 - T_U) exp(-a1 t)  =>  t = ln((T_K0 - T_U) / (T1_0 - T_U)) / (a2 - a1), gültig für t > 0
  const d = a2 - a1, q = (r.T_K0 - r.T_U) / (z.T1_0 - r.T_U);
  let tS = Infinity;
  if (d !== 0 && q > 0) { const t = Math.log(q) / d; if (t > 0) tS = t; }
  return { kA: z.kA, T1_0: z.T1_0, T1: z.T1, T2_K: z.T2_K, T2: z.T2, dT: z.dT, th1: z.th1, th2: z.th2, Q1: Q1, Q2: Q2,
           t_schnitt: tS, kaffee_danach_kuehler: d > 0, T_K0: r.T_K0, T_U: r.T_U,
           kurve1: t => r.T_U + (z.T1_0 - r.T_U) * Math.exp(-a1 * t),          // Tasse 1, t in s
           kurve2: t => r.T_U + (r.T_K0 - r.T_U) * Math.exp(-a2 * t) };        // Tasse 2 vor der Zugabe
}
// MODELL-ENDE
// ERWEITERUNG-ANFANG: Erweiterungen nach KONZEPT.md Fassung 2, Abschnitt 8.2 (M2, M3, M4, M8, M9, M10), ohne Bezug zur Oberfläche.
// Setzt auf dem unveränderten Block MODELL auf (P, K, rechne, zweiTassen, berechne). Python-Referenz: simulation/modell/kaffee_erweitert.py.
// Einstellungen e: VK_ml, VM_ml, thK0, thM, thU (°C), tEnd_min (Zugabe, min), becher, mB_g, milch2Raum, kA1Faktor,
// kAQuelle ("fest" oder "messung"), kA (W/K bei "fest"), thMess (°C bei "messung").
const ERW = (() => {
  const VOREINSTELLUNGEN = [
    { id: "keramik", faktor: 1.00, art: "belegt" },
    { id: "keramik_deckel", faktor: 0.56, art: "belegt" },
    { id: "glas", faktor: 1.00, art: "richtwert" },
    { id: "pappe", faktor: 1.00, art: "richtwert" },
    { id: "edelstahl", faktor: 0.90, art: "richtwert" },
    { id: "thermo_offen", faktor: 0.44, art: "richtwert" }
  ];
  const KA_AUFGABE = rechne(P).kA;                      // Teil c: 80 auf 67 °C in 10 min, 200 ml, ohne Becher

  function kapazitaeten(e) {
    const C_K = P.rho_K * e.VK_ml * 1e-6 * P.cp_K, C_M = P.rho_M * e.VM_ml * 1e-6 * P.cp_M;
    const C_B = e.becher ? e.mB_g / 1000 * P.c_B : 0.0;
    return { C_K: C_K, C_M: C_M, C_B: C_B, C_KB: C_K + C_B, C_GB: C_K + C_M + C_B };
  }
  // M8: gleichwertiger Messwert nach 10 min, aus dem der Block MODELL genau dieses kA rechnet (nie als Messung angezeigt)
  function messwertFuer(kA, e) {
    return e.thU + (e.thK0 - e.thU) * Math.exp(-kA * 600 / kapazitaeten(e).C_KB);
  }
  // Gültigkeit wie im geprüften Werkzeug (D116); bei kA festhalten zusätzlich kA > 0. Leer heißt gültig.
  function fehler(e) {
    if (!(e.thK0 > e.thU)) return "anfang_ueber_raum";
    if (e.kAQuelle === "fest") return e.kA > 0 ? "" : "kA_positiv";
    if (!(e.thMess > e.thU && e.thMess < e.thK0)) return "messung_zwischen";
    return "";
  }
  function modellEinstellung(e) {
    return e.kAQuelle === "fest" ? Object.assign({}, e, { thMess: messwertFuer(e.kA, e) }) : e;
  }
  function auswerten(e) {
    const em = modellEinstellung(e), m = berechne(em), m3 = berechne(Object.assign({}, em, { milch2Raum: true }));
    const c = kapazitaeten(e), T_U = e.thU + K, T_K0 = e.thK0 + K, kA = m.kA, f1 = e.kA1Faktor;
    const a1 = f1 * kA / c.C_GB, a2 = kA / c.C_KB, thM2 = e.milch2Raum ? e.thU : e.thM;
    const T1 = t => T_U + (m.T1_0 - T_U) * Math.exp(-a1 * t), T2K = t => T_U + (T_K0 - T_U) * Math.exp(-a2 * t);
    const dQ = t => c.C_KB * (T_K0 - T2K(t)) - c.C_GB * (m.T1_0 - T1(t));       // Q2(t) - Q1(t) in J
    let t_q = Infinity;                                                          // gleiche Wärmeströme
    const zq = (T_K0 - T_U) / (f1 * (m.T1_0 - T_U));
    if (a2 !== a1 && zq > 0) { const t = Math.log(zq) / (a2 - a1); if (t > 0) t_q = t; }
    const tz = e.tEnd_min * 60;
    const vor = t_q < tz ? dQ(t_q) : dQ(tz), nach = t_q < tz ? dQ(tz) - dQ(t_q) : 0;
    const milch = c.C_M * (e.thM - thM2);
    return {
      kA: kA, thMessModell: em.thMess, th10: m.T1_0 - K, th1: m.th1, th2: m.th2, th2K: m.T2_K - K, th2Raum: m3.th2,
      dT: m.dT, Q1: m.Q1 / 1e3, Q2: m.Q2 / 1e3, milch: milch / 1e3,
      energieRest: (c.C_GB * m.dT - (m.Q2 - m.Q1) - milch) / 1e3,
      tSchnitt: m.t_schnitt / 60, kaffeeDanachKuehler: m.kaffee_danach_kuehler, tWaermestrom: t_q / 60,
      flaecheVor: vor / 1e3, flaecheNach: nach / 1e3,
      qdot1: t_min => f1 * kA * (T1(t_min * 60) - T_U), qdot2: t_min => kA * (T2K(t_min * 60) - T_U),
      kurve1: t_min => m.kurve1(t_min * 60) - K, kurve2: t_min => m.kurve2(t_min * 60) - K,
      schwarz30: m.kurve2(1800) - K, tauMin: c.C_KB / kA / 60,
      C_K: c.C_K, C_M: c.C_M, C_B: c.C_B, C_KB: c.C_KB, C_GB: c.C_GB
    };
  }
  // M4 (kann): beide Tassen nach der Zugabe bis tV, Tasse 1 mit f1 kA
  function nachZugabe(e, tV_min) {
    const r = auswerten(e), c = kapazitaeten(e), dt = (tV_min - e.tEnd_min) * 60;
    const th1 = e.thU + (r.th1 - e.thU) * Math.exp(-e.kA1Faktor * r.kA * dt / c.C_GB);
    const th2 = e.thU + (r.th2 - e.thU) * Math.exp(-r.kA * dt / c.C_GB);
    return { th1: th1, th2: th2, dT: th1 - th2 };
  }
  // M9 (kann): Becher beim Eingießen auf Raumtemperatur, sofortiger Ausgleich bei t = 0; nur mit kA festhalten und Becher an
  function becherKalt(e) {
    const c = kapazitaeten(e), kA = e.kA, t = e.tEnd_min * 60;
    const th1_0 = (c.C_K * e.thK0 + c.C_M * e.thM + c.C_B * e.thU) / c.C_GB;
    const thK_0 = (c.C_K * e.thK0 + c.C_B * e.thU) / c.C_KB;
    const th1 = e.thU + (th1_0 - e.thU) * Math.exp(-e.kA1Faktor * kA * t / c.C_GB);
    const thK = e.thU + (thK_0 - e.thU) * Math.exp(-kA * t / c.C_KB);
    const th2 = (c.C_KB * thK + c.C_M * (e.milch2Raum ? e.thU : e.thM)) / c.C_GB;
    return { th1_0: th1_0, thK_0: thK_0, th1: th1, th2: th2, dT: th1 - th2 };
  }
  // M10 (kann): Zeit in min bis zur Trinktemperatur thT
  function trinkzeit(e, thT) {
    const r = auswerten(e);
    const zeit = (th0, C, f) => th0 <= thT ? 0 : (thT <= e.thU ? Infinity : C / (f * r.kA) * Math.log((th0 - e.thU) / (thT - e.thU)) / 60);
    return { tasse1: zeit(r.th10, r.C_GB, e.kA1Faktor), schwarz: zeit(e.thK0, r.C_KB, 1) };
  }
  // M2: Ausgleichsgerade durch den Ursprung und mit freiem Achsenabschnitt; punkte = [[t_min, theta], ...] ohne Startpunkt
  function ausgleich(punkte, th0, thU, C_KB) {
    const xs = punkte.map(p => p[0] * 60), ys = punkte.map(p => Math.log((p[1] - thU) / (th0 - thU)));
    let sxy = 0, sxx = 0; for (let i = 0; i < xs.length; i++) { sxy += xs[i] * ys[i]; sxx += xs[i] * xs[i]; }
    const b0 = sxy / sxx, X = [0].concat(xs), Y = [0].concat(ys), n = X.length;
    const mx = X.reduce((a, v) => a + v, 0) / n, my = Y.reduce((a, v) => a + v, 0) / n;
    let s1 = 0, s2 = 0; for (let i = 0; i < n; i++) { s1 += (X[i] - mx) * (Y[i] - my); s2 += (X[i] - mx) ** 2; }
    const b1 = s1 / s2;
    return { kA_ursprung: -C_KB * b0, kA_frei: -C_KB * b1, achsenabschnitt: my - b1 * mx, n: punkte.length };
  }
  // Konzept 8.1: größter Unterschied über t_Z bei gleichem kA (analytisch über den Schnitt)
  function groessterUnterschied(e) {
    const c = kapazitaeten(e), r = auswerten(Object.assign({}, e, { tEnd_min: 1 }));
    const q = (e.thK0 - e.thU) / (r.th10 - e.thU), thx = e.thU + (e.thK0 - e.thU) * Math.pow(q, -c.C_GB / c.C_M);
    return { dT_max: c.C_M * (thx - e.thM) / c.C_GB, th_x: thx, t_min: Math.log(q) / (r.kA / c.C_KB - r.kA / c.C_GB) / 60 };
  }
  return { VOREINSTELLUNGEN, KA_AUFGABE, kapazitaeten, messwertFuer, fehler, modellEinstellung, auswerten, nachZugabe,
           becherKalt, trinkzeit, ausgleich, groessterUnterschied };
})();
// ERWEITERUNG-ENDE
// HILFEN-ANFANG: Zahlen lesen und schreiben, Kurslink (ZUSTAENDE.md, Abschnitt 5). Ohne Bezug zur Oberfläche, in Node testbar.
const HILFEN = (() => {
  // Eine Zahl nur, wenn der ganze Text eine Zahl ist (Komma oder Punkt), sonst NaN; aus dem geprüften Werkzeug (Befund Simulation 5),
  // ergänzt: mehr als ein Trennzeichen gilt als Tausendertrennung und wird abgelehnt ("tausender").
  function zahlLesen(text) {
    const t = String(text).trim().replace("−", "-");
    if ((t.match(/[.,]/g) || []).length > 1) return { wert: NaN, grund: "tausender" };
    const u = t.replace(",", ".");
    return /^[+-]?\d+(\.\d+)?$/.test(u) ? { wert: Number(u), grund: "" } : { wert: NaN, grund: t === "" ? "leer" : "keine_zahl" };
  }
  function zahlText(x, stellen, sprache) {
    if (!isFinite(x)) return "";
    let s = (Math.abs(x) < 0.5 * Math.pow(10, -stellen) ? 0 : x).toFixed(stellen);
    if (s.charAt(0) === "-") s = "−" + s.slice(1);
    return sprache === "de" ? s.replace(".", ",") : s;
  }
  // Kurslink, Format Version 1: #kurs1=u:21.5;m:6;d:0;b:1.2;b1:...;b2:...;b3:...  (acht Werte je Becher)
  const ZEILEN = 8, MAX_LAENGE = 400;
  function kurslinkBauen(kurs) {
    const z = v => (v === null || v === undefined || !isFinite(v)) ? "" : String(Math.round(v * 100) / 100);
    const becher = ["1", "2"].concat(kurs.b3 ? ["3"] : []);
    const teile = [];          // Messreihen zuerst, Kopfwerte am Ende: der Link endet nie auf einem Komma (G8-07)
    for (const b of becher) teile.push("b" + b + ":" + kurs.werte["b" + b].map(z).join(","));
    teile.push("u:" + z(kurs.u), "m:" + z(kurs.m), "d:" + (kurs.d ? 1 : 0), "b:" + becher.join("."));
    return "kurs1=" + teile.join(";");
  }
  function kurslinkLesen(hash) {
    const h = String(hash || "").replace(/^#/, "");
    if (!h) return { art: "leer" };
    if (!/^kurs1=/.test(h)) return { art: "fremd" };
    if (h.length > MAX_LAENGE) return { art: "defekt", grund: "zu_lang" };
    let roh;
    try { roh = decodeURIComponent(h.slice(6)); } catch (e) { return { art: "defekt", grund: "kodierung" }; }
    const felder = {};
    for (const teil of roh.split(";")) {
      const i = teil.indexOf(":");
      if (i < 1) return { art: "defekt", grund: "feld" };
      const k = teil.slice(0, i), v = teil.slice(i + 1);
      if (!/^(u|m|d|b|b1|b2|b3)$/.test(k) || k in felder) return { art: "defekt", grund: "feld:" + k };
      felder[k] = v;
    }
    const zahl = (v, lo, hi, name) => {
      if (v === "" || v === undefined) return { ok: true, wert: null };
      if (!/^-?\d{1,3}(\.\d{1,2})?$/.test(v)) return { ok: false, grund: name };

ung. Die Zeilen folgen dem Versuchsablauf: Becher 1 hat die Milch schon bei 0 min (Zeile 0 nach dem Umrühren) und keine Zeile „60 nach der Milch“; Becher 3 rechnet mit Milch bei Raumtemperatur.","mess_feld_aria":"{becher}, {zeile}","mess_grund_fehlt":"Es fehlen Messwerte von Becher 2 bei 0 und 10 min.","mess_grund_wert":"{was} {wert} °C liegt außerhalb {min} bis {max} °C","mess_kopf_b1":"Becher 1 (Milch sofort) [°C]","mess_kopf_b2":"Becher 2 (Milch nach 60 min) [°C]","mess_kopf_b3":"Becher 3 (Milch mit Raumtemperatur) [°C]","mess_kopf_t":"<math><mrow><mi>t<\/mi><\/mrow><\/math> [min]","mess_loeschen":"Kurswerte löschen","mess_loeschen_frage":"Alle Kurswerte löschen? Eure Antworten bleiben.","mess_milch":"Milchtemperatur [°C]","mess_nicht_uebernommen":"Nicht übernommen, nichts verändert: {grund}","mess_raum":"Raumtemperatur [°C]","mess_teilen":"Kurswerte als Link teilen","mess_titel":"Messwerte aus dem Versuch","mess_uebernehmen":"Einstellungen aus den Messwerten übernehmen","mess_uebernommen":"Übernommen (Mittel der Becher vor der Milch, ungerundet): Start {a} °C, nach 10 min {b} °C, Raum {u} °C, Milch {m} °C; Zugabe nach 60 min, Becher an, <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> aus der Messung.","mess_ungueltig":"Bitte eine Temperatur zwischen 0 und 100 °C als Zahl eingeben, zum Beispiel 66,5.","mess_was_milch":"Milchtemperatur","mess_was_raum":"Raumtemperatur","mess_was_start":"Anfangstemperatur (Mittel bei 0 min)","mess_was_zehn":"Messwert nach 10 min (Mittel)","mess_zeile_60n":"60 nach der Milch","mess_zeile_60v":"60 vor der Milch","modell_annahmen":"Annahmen","modell_lesen":"So liest du die Ergebnisse","modell_macht":"Was die Simulation macht","modell_problem":"Physikalisches Problem","modell_regler":"Regler und Einheiten","ohne_frage":"Ohne eigene Vorhersage aufdecken? Die Auflösung ist dann sofort sichtbar.","ohne_vorhersage":"ohne Vorhersage","passt":"Auswahl passt","passt_nicht":"Auswahl passt nicht","rechenwerte":"Rechenwerte","regler_VK":"Kaffeemenge","regler_VM":"Milchmenge","regler_gesperrt":"Erst eure Vorhersage zu Frage 1 festhalten.","regler_gesperrt_start":"Erst die Startfrage beantworten.","regler_kA":"Wärmeabgabe der Tasse","regler_kA1":"<math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> von Tasse 1 relativ","regler_mB":"Masse des Bechers","regler_tEnd":"Zugabe in Tasse 2 nach","regler_tabelle_kopf":"Größe|Zeichen|Standard|Bereich, Schritt|Grundlage","regler_thK0":"Kaffeetemperatur am Anfang","regler_thM":"Milchtemperatur","regler_thMess":"Messung nach 10 min","regler_thU":"Raumtemperatur","reiter_aria":"Erklärungen zur Simulation","reiter_code":"So rechnet der Code","reiter_modell":"Modell","reiter_verdeckt":"Dieser Teil erscheint, sobald ihr eure Vorhersage auf der Startkarte festgehalten habt.","reiter_versuche":"Versuche","rueckblick_energie":"abgegeben bis zur Zugabe: Tasse 1 {q1} kJ, Tasse 2 {q2} kJ","rw_Q":"abgegeben <math><mrow><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> / <math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>","rw_becher3":"Becher 3 (Milch mit Raumtemperatur)","rw_bezug":"direkt nach der Zugabe nach {t} min","rw_kA":"Wärmeabgabe <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>","rw_kA_herkunft_ausgleich":"aus der Ausgleichsgeraden","rw_kA_herkunft_fest":"festgehalten","rw_kA_herkunft_messung":"aus der Messung nach 10 min","rw_kA_herkunft_vor":"Voreinstellung {name}","rw_keine_rechnung":"Keine Rechnung","rw_misch":"Mischtemperatur <math><mrow><msub><mi>ϑ<\/mi><mrow><mn>1,0<\/mn><\/mrow><\/msub><\/mrow><\/math>","rw_noch_nicht":"Noch keine Rechenwerte","rw_satz_1":"Tasse 1 wärmer","rw_satz_2":"Tasse 2 wärmer","rw_satz_gleich":"gleich warm","rw_schnitt":"Schnitt der Kurven","rw_schnitt_kein":"kein Schnitt bis zur Zugabe","rw_schnitt_spaeter":"sichtbar nach eurer Vorhersage zu Frage 1","rw_schnitt_wert":"nach {t} min","rw_tasse1":"Tasse 1 <math><mrow><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>","rw_tasse2":"Tasse 2 <math><mrow><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>","rw_unterschied":"Unterschied <math><mrow><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>","rw_unterschied_b3":"Unterschied Tasse 1 und Becher 3","rw_vorgewaermt":"(Becher vorgewärmt)","rw_vorhersage":"Eure Vorhersage","schalter_becher":"Wärmekapazität des Bechers berücksichtigen (Keramik)","schalter_kalt":"Becher beim Eingießen kalt (Raumtemperatur)","schalter_milch2Raum":"Milch für Tasse 2 bei Raumtemperatur","schalter_trinkzeit":"Trinkzeit bis 60 °C zeigen","soll_f1":"etwa 56 min","soll_start":"3,85 K (Standardwerte)","soll_v1":"47,0 °C","soll_v2":"etwa 100 min","speicher_aus":"Werte werden nicht gespeichert (Speicher im Browser gesperrt)","speicher_ok":"Werte bleiben nur in diesem Browser","sprache_knopf":"<b>DE<\/b> ↔ EN","sprache_knopf_aria":"DE ↔ EN: Sprache wechseln, jetzt Deutsch","sprung_inhalt":"Zum Inhalt springen","start_ausgangslage":"Standardwerte","start_k_label":"Unterschied etwa","start_opt_1":"Tasse 1 (Milch sofort)","start_opt_2":"Tasse 2 (Milch später)","start_opt_gleich":"beide gleich warm","start_text":"Beide Tassen stehen 60 min, die Milch kommt aus dem Kühlschrank. Welche Tasse ist nach 60 min wärmer, und um etwa wie viel? Notiere zuerst für dich, dann einigt euch.","start_titel":"Erst vorhersagen","status_ansage":"Tasse 1 {a} °C, Tasse 2 {b} °C, Unterschied {d} K.","status_aufgedeckt":"Ohne Vorhersage aufgedeckt.","status_festgehalten":"Vorhersage festgehalten, Kurven und Rechenwerte sind sichtbar.","tasse_n":"Tasse {n}","text_annahmen":"<p>Wie auf dem Aufgabenblatt (in du-Form ohne inhaltliche Änderung):<\/p>\n<ul>\n<li>Der Tasseninhalt ist ideal durchmischt, die Milch mischt sich sofort und ohne Wärmeverlust.<\/li>\n<li>Die Wärmekapazität der Tasse wird vernachlässigt, außer wenn du den Becher einschaltest (Teil g): Dann ist der Becher immer so warm wie sein Inhalt, auch beim Zugießen.<\/li>\n<li>Die gesamte Wärmeabgabe (auch durch Strahlung und Verdunstung) ist <math><mrow><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mi mathvariant=\"normal\">ab<\/mi><\/msub><mo>=<\/mo><mi>k<\/mi><mi>A<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><mi>ϑ<\/mi><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math> mit konstantem <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>;<\/span> die verdunstete Masse wird vernachlässigt.<\/li>\n<li>Kaffee (Stoffdaten von Wasser) und Milch sind inkompressibel (<span class=\"nb\"><math><mrow><msub><mi>c<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><msub><mi>c<\/mi><mi>v<\/mi><\/msub><\/mrow><\/math>)<\/span>, die Stoffdaten konstant.<\/li>\n<\/ul>\n<p>Zusätzlich in der Simulation:<\/p>\n<ul>\n<li><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> gilt für beide Tassen; „<math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> von Tasse 1 relativ“ ändert das nur für Tasse 1. Festgehalten bleibt <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> gleich, wenn du Mengen oder Temperaturen änderst (die Füllhöhe ändert <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> hier nicht); aus der Messung wird es jedes Mal neu bestimmt.<\/li>\n<li>Voreinstellungen mit Stern sind Richtwerte, geschätzt, nicht gemessen; gemessen sind „Keramik offen“ (Aufgabe) und „Keramik mit Deckel“ (ein Becher mit Styropordeckel, Ferreira 2025a).<\/li>\n<li>Für die Übernahme gelten die Becher vor der Milch als schwarzer Kaffee mit gleichem Startwert und gleichem <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> (Mittel der Messwerte).<\/li>\n<li>Ideale Durchmischung und „Becher so warm wie der Inhalt“ sind bewusst vereinfachende Annahmen; die kleine Biot-Zahl der Keramikwand (etwa 0,035) spricht dafür, beweist sie aber nicht allein.<\/li>\n<\/ul>","text_code":"<p>Die Seite ist eine einzige Datei. Die Rechnung steht in zwei gekennzeichneten Blöcken: <code>MODELL<\/code> enthält dieselben Gleichungen und Standardwerte wie das Rechenskript <code>kaffee_modell.py<\/code> der Lösung (Funktionen <code>rechne<\/code> und <code>zwei_tassen<\/code>), <code>ERWEITERUNG<\/code> die Erweiterungen (Ausgleichsgerade, Energie, <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> festhalten und die gewählten Zusätze). Für jede Einstellung rechnet der Code die Kurven geschlossen aus; nur die Zeichnung tastet sie in 241 Punkten ab. Geprüft wird mit automatischen Tests: 10 000 Zufallssätze gegen <code>kaffee_modell.py<\/code>, die Erweiterungen gegen eine eigene Rechnung, Bedienung im Browser bei 360 bis 1920 px, beide Sprachen. Stand {stand}, Version {version}. Du kannst den Code mit „Quelltext anzeigen“ im Browser lesen.<\/p>","text_lesen":"<ul>\n<li><strong>Braune durchgezogene Linie:<\/strong> Tasse 1. Die Milch kommt bei <math><mrow><mi>t<\/mi><\/mrow><\/math> = 0 hinein; der kurze gepunktete Strich bei <math><mrow><mi>t<\/mi><\/mrow><\/math> = 0 ist der Mischsprung von 80 auf 70,47 °C.<\/li>\n<li><strong>Schwarze gestrichelte Linie:<\/strong> Tasse 2, schwarzer Kaffee bis zur Zugabe der Milch; der gepunktete Strich am Ende ist der Mischsprung beim Zugießen.<\/li>\n<li><strong>Kreis:<\/strong> Schnittpunkt der beiden Kurven. Links davon ist der schwarze Kaffee wärmer als Tasse 1 und gibt mehr Wärme ab, rechts davon weniger (bei gleichem <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> beider Tassen).<\/li>\n<li><strong>Graue gepunktete Linie:<\/strong> Raumtemperatur. Beide Kurven nähern sich ihr.<\/li>\n<li><strong>Formen:<\/strong> deine Messwerte (Kreis Becher 1, Quadrat Becher 2, Dreieck Becher 3).<\/li>\n<li><strong>Beschrifteter Kasten:<\/strong> eure festgehaltene Vorhersage. <strong>Blasse Kurven:<\/strong> der gemerkte Vergleichslauf.<\/li>\n<li><strong>Rechenwerte:<\/strong> Temperaturen direkt nach der Zugabe in Tasse 2. Der Unterschied ist <span class=\"nb\"><math><mrow><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>;<\/span> positiv heißt: Tasse 1 ist wärmer. <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> steht mit seiner Herkunft da (aus der Messung, festgehalten, Voreinstellung, Ausgleichsgerade).<\/li>\n<li><strong>Energie bis zur Zugabe:<\/strong> Wärme, die jede Tasse bis zur Zugabe abgegeben hat (Teil e). Bei gleicher Milch ist <math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> geteilt durch <math><mrow><mi>m<\/mi><mspace width=\"0.167em\"/><msub><mi>c<\/mi><mi>p<\/mi><\/msub><\/mrow><\/math> des Gemischs genau der Unterschied; bei verschieden warmer Milch kommt der Milchbeitrag dazu.<\/li>\n<li><strong>Ansicht „Wärmestrom“ (Vertiefung):<\/strong> <math><mrow><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mi mathvariant=\"normal\">ab<\/mi><\/msub><\/mrow><\/math> beider Tassen über der Zeit. Die Fläche zwischen den Kurven ist eine Energie: vor dem Schnitt gibt Tasse 2 mehr ab, danach weniger; beide Teilflächen sind verschieden schraffiert, ihre Summe ist <span class=\"nb\"><math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>.<\/span><\/li>\n<li><strong>Ansicht „Messwerte linear (ln)“ (Vertiefung):<\/strong> <math><mrow><mi>ln<\/mi><mo>&#x2061;<\/mo><mfrac><mrow><mi>ϑ<\/mi><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><mrow><msub><mi>ϑ<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math> über <math><mrow><mi>t<\/mi><\/mrow><\/math> für die Becher vor der Milch. Bei konstantem <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> liegen die Punkte auf einer Geraden durch den Ursprung mit der Steigung <span class=\"nb\"><math><mrow><mo>−<\/mo><mi>k<\/mi><mi>A<\/mi><mo>/<\/mo><mo>(<\/mo><mi>m<\/mi><mspace width=\"0.167em\"/><msub><mi>c<\/mi><mi>p<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math>.<\/span> Ein Muster in den Abständen zur Geraden zeigt, dass <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> oder die Messbedingungen nicht konstant waren; welche Ursache, sagt die Gerade allein nicht.<\/li>\n<li><strong>Rundung:<\/strong> Temperaturen auf 0,01 K, Wärmen auf 0,01 kJ.<\/li>\n<\/ul>","text_macht":"<ol>\n<li>Sie nimmt <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> der Tasse: festgehalten (Standard 0,3402 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">W<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> aus der Messung der Aufgabe, Voreinstellung oder eigener Wert) oder aus Anfangstemperatur und Messung nach 10 min (Teil c, mit Becher Teil g).<\/li>\n<li>Tasse 1: Sie mischt Kaffee und Milch bei <math><mrow><mi>t<\/mi><\/mrow><\/math> = 0 (Teil a) und lässt das Gemisch bis zur Zugabe abkühlen (Teil b und d).<\/li>\n<li>Tasse 2: Sie lässt den schwarzen Kaffee bis zur Zugabe abkühlen und mischt dann die Milch hinein.<\/li>\n<li>Sie vergleicht beide Tassen direkt nach der Zugabe, berechnet die abgegebene Wärme aus der Energiebilanz (Teil e) und den Schnittpunkt der Kurven.<\/li>\n<li>Sie zeichnet deine Messwerte ein; auf Wunsch übernimmt sie Starttemperatur und Messwert nach 10 min aus den Messungen oder bestimmt <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> aus allen Punkten vor der Milch.<\/li>\n<\/ol>\n<p>Sie rechnet nicht: Verdunstung als eigenen Vorgang (das ist deine Hausaufgabe), Temperaturunterschiede in der Tasse, eine Wärmeabgabe, die stärker als linear wächst. Alle Zahlen entstehen in deinem Browser; die Seite sendet nichts.<\/p>","text_probier":"<p><strong>Probier es aus: erst vorhersagen, dann prüfen.<\/strong> Bearbeitet die Fragen zu zweit. Notiere zuerst für dich, was passiert, dann einigt euch und haltet eure Vorhersage im Feld fest. Erst dann prüft ihr im Diagramm. Die Auflösung erscheint in der Karte, sobald eure Vorhersage festgehalten ist.<\/p>","text_problem":"<p>Sonntagmorgen in der WG-Küche: Du hast Filterkaffee gekocht und zwei gleiche Tassen mit je 200 ml gefüllt. Da klingelt das Telefon, das Gespräch wird eine Stunde dauern. Dein Mitbewohner gießt seine Milch sofort in den Kaffee (Tasse 1). Du stellst deine Tasse daneben und willst die Milch erst nach dem Telefonat hineingießen (Tasse 2), damit der Kaffee „länger heiß bleibt“. Die Milch kommt in beiden Fällen direkt aus dem Kühlschrank.<\/p>\n<p>Dein Mitbewohner meint: „Ob man die Milch sofort oder später hineingießt, ist egal. Die Energie bleibt ja erhalten.“ Welche Tasse ist nach einer Stunde wärmer?<\/p>\n<p>Beide Tassen geben über ihre Oberfläche Wärme an den Raum ab, und zwar umso mehr, je wärmer der Inhalt als der Raum ist. Die Simulation rechnet den Vorgang mit der instationären globalen Energiebilanz aus Tutorium 5; in der Vertiefung kannst du Mengen, Temperaturen, Tasse und Becher verändern.<\/p>","text_rechenweg":"<p><strong>Bilanz.<\/strong> Bilanzraum ist der Inhalt einer Tasse (mit Becher: Inhalt und Becher). Aus der allgemeinen Energiebilanz (Foliensatz 05, Folie 8) bleiben ohne Stoffströme und ohne Arbeit nur die Änderung der inneren Energie und der Wärmestrom an die Umgebung:<\/p>\n<span class=\"formel\"><math display=\"block\"><mrow><mi>C<\/mi><mspace width=\"0.167em\"/><mfrac><mrow><mi mathvariant=\"normal\">d<\/mi><mi>T<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">d<\/mi><mi>t<\/mi><\/mrow><\/mfrac><mo>=<\/mo><mo>−<\/mo><mi>k<\/mi><mi>A<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><mi>T<\/mi><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math><\/span>\n<p>mit <math><mrow><mi>C<\/mi><mo>=<\/mo><mi>m<\/mi><mspace width=\"0.167em\"/><msub><mi>c<\/mi><mi>p<\/mi><\/msub><\/mrow><\/math> des Inhalts (mit Becher zuzüglich <span class=\"nb\"><math><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><msub><mi>c<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><\/mrow><\/math>)<\/span>. Trennung der Variablen mit <math><mrow><mi>T<\/mi><mo>(<\/mo><mi>t<\/mi><mo>=<\/mo><mn>0<\/mn><mspace width=\"0.167em\"/><mi mathvariant=\"normal\">s<\/mi><mo>)<\/mo><mo>=<\/mo><msub><mi>T<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> ergibt<\/p>\n<span class=\"formel\"><math display=\"block\"><mrow><mi>T<\/mi><mo>(<\/mo><mi>t<\/mi><mo>)<\/mo><mo>=<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>+<\/mo><mo>(<\/mo><msub><mi>T<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><mi>exp<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mo>−<\/mo><mfrac><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><mrow><mi>C<\/mi><\/mrow><\/mfrac><mspace width=\"0.167em\"/><mi>t<\/mi><mo>)<\/mo><mo>,<\/mo><mspace width=\"2em\"/><mi>τ<\/mi><mo>=<\/mo><mfrac><mrow><mi>C<\/mi><\/mrow><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/mfrac><mo>.<\/mo><\/mrow><\/math><\/span>\n<p><strong>kA aus der Messung.<\/strong> <math><mrow><mi>k<\/mi><mi>A<\/mi><mo>=<\/mo><mo>−<\/mo><mfrac><mrow><mi>C<\/mi><\/mrow><mrow><msub><mi>t<\/mi><mi mathvariant=\"normal\">mess<\/mi><\/msub><\/mrow><\/mfrac><mi>ln<\/mi><mo>&#x2061;<\/mo><mfrac><mrow><msub><mi>T<\/mi><mi mathvariant=\"normal\">mess<\/mi><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><mrow><msub><mi>T<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math> (Teil c).<\/p>\n<p><strong>Mischen.<\/strong> <math><mrow><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">misch<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">K<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/msub><mspace width=\"0.167em\"/><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">K<\/mi><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">M<\/mi><\/mrow><\/msub><mspace width=\"0.167em\"/><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><\/mrow><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">K<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">M<\/mi><\/mrow><\/msub><\/mrow><\/mfrac><\/mrow><\/math> (Teil a; mit Becher dessen Wärmekapazität bei der Tasse dazu).<\/p>\n<p><strong>Abgegebene Wärme.<\/strong> <math><mrow><mi>Q<\/mi><mo>=<\/mo><mi>C<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">Anfang<\/mi><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">Ende<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math> für jeden Bilanzraum (Teil e); daraus direkt nach der Zugabe <span class=\"formel\"><math display=\"block\"><mrow><msub><mi>C<\/mi><mi mathvariant=\"normal\">G<\/mi><\/msub><mo>(<\/mo><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><mo>)<\/mo><mo>=<\/mo><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">M<\/mi><\/mrow><\/msub><mo>(<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">M1<\/mi><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">M2<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math><\/span>; bei gleicher Milch fällt der letzte Teil weg.<\/p>\n<p><strong>Zeitpunkt der Zugabe.<\/strong> Verschiebt man die Zugabe, ändert sich der Unterschied mit <span class=\"nb\"><math><mrow><mfrac><mrow><mi mathvariant=\"normal\">d<\/mi><mo>(<\/mo><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><mo>)<\/mo><\/mrow><mrow><mi mathvariant=\"normal\">d<\/mi><msub><mi>t<\/mi><mi mathvariant=\"normal\">Z<\/mi><\/msub><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mrow><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mn>1<\/mn><\/msub><\/mrow><mrow><msub><mi>C<\/mi><mi mathvariant=\"normal\">G<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math>:<\/span> Er wächst, solange Tasse 2 mehr Wärme abgibt, und sinkt danach. Was daraus für den größten Unterschied folgt, steht in den Auflösungen zu Frage 1 und V2.<\/p>\n<p><strong>kA aus allen Messpunkten<\/strong> (Vertiefung): Ausgleichsgerade durch den Ursprung in der Ansicht „ln“, Steigung <math><mrow><mi>b<\/mi><mo>=<\/mo><mo>∑<\/mo><msub><mi>t<\/mi><mi>i<\/mi><\/msub><msub><mi>y<\/mi><mi>i<\/mi><\/msub><mo>/<\/mo><mo>∑<\/mo><msubsup><mi>t<\/mi><mi>i<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math> mit <span class=\"nb\"><math><mrow><msub><mi>y<\/mi><mi>i<\/mi><\/msub><mo>=<\/mo><mi>ln<\/mi><mo>&#x2061;<\/mo><mfrac><mrow><msub><mi>ϑ<\/mi><mi>i<\/mi><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><mrow><msub><mi>ϑ<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math>,<\/span> dann <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><mo>=<\/mo><mo>−<\/mo><mi>C<\/mi><mspace width=\"0.167em\"/><mi>b<\/mi><\/mrow><\/math>.<\/span> Die Streuung der Geraden ist keine Messunsicherheit von <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>,<\/span> weil alle Punkte denselben Startwert enthalten.<\/p>\n<p><strong>kA festhalten<\/strong> (Vertiefung): Das Werkzeug gibt dem Modell den Messwert nach 10 min, der zu diesem <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> gehört, und rechnet sonst unverändert.<\/p>","text_regler_einleitung":"<p>Standardwerte sind die Werte der Aufgabe. Fest sind die Stoffwerte: Kaffee 1000 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kg<\/mi><\/mrow><mrow><msup><mi mathvariant=\"normal\">m<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> und 4,18 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kJ<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">kg<\/mi><mo>·<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> (Stoffwerte von Wasser), Milch 1030 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kg<\/mi><\/mrow><mrow><msup><mi mathvariant=\"normal\">m<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> und 3,94 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kJ<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">kg<\/mi><mo>·<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> (aus der Lösung: Goff; Tutorium 8), Becher 0,85 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kJ<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">kg<\/mi><mo>·<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> (Teil g, Arbeitswert). Indizes: K Kaffee, M Milch, u Umgebung, G Gemisch, B Becher, Z Zugabe, ab abgegeben, mess Messung, misch Mischung.<\/p>","titel_seite":"Kaffee mit Milch: Simulation","trink_nach":"nach {t} min","trink_nie":"nie (Raum zu warm)","trink_sofort":"schon beim Eingießen","trinkzeit_text":"Trinktemperatur 60 °C: Tasse 1 {a}, schwarzer Kaffee {b}.","v1_eingabe":"Milchtemperatur etwa","v1_text":"Notiere zuerst für dich, dann einigt euch zu zweit: Wie warm müsste die Milch sein, damit beide Tassen nach 60 min ungefähr gleich warm sind? Hängt diese Temperatur vom Zeitpunkt der Zugabe ab?","v1_titel":"Milchtemperatur","v2_eingabe":"Zeitpunkt etwa","v2_text":"Notiere zuerst für dich, dann einigt euch zu zweit: Mit Deckel kühlen beide Tassen langsamer ab. Wird der größte mögliche Unterschied größer, kleiner oder bleibt er gleich? Wann tritt er ein? Wähle bei <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> „Keramik mit Deckel“ und suche wie in Frage 1 den Zeitpunkt mit dem größten Unterschied.","v2_titel":"Deckel","v3_ausgangslage":"Standardwerte, Becher an, <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> aus der Messung nach 10 min (wie Teil g)","v3_text":"Notiere zuerst für dich, dann einigt euch zu zweit: Die Tassen sind vorgewärmte Keramikbecher wie in Teil g. Wird der Unterschied größer oder kleiner, und bleibt Tasse 1 wärmer?","v3_titel":"Becher","v4_opt_falsch":"falsches <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> beider Becher","v4_opt_ungleich":"ungleiches <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> der Becher","v4_text":"Notiere zuerst für dich, dann einigt euch zu zweit: Becher 1 hat 5 % mehr <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> als Becher 2 (andere Unterlage); oder <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> beider Becher ist um 10 % falsch bestimmt. Was verfälscht den Unterschied mehr?","v4_titel":"Versuchsplan","v5_text":"Notiere zuerst für dich, dann einigt euch zu zweit: Welcher Becher hält den Kaffee am längsten warm? Ändert sich damit der größte mögliche Unterschied zwischen den Tassen? Probiere die Voreinstellungen bei <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> aus.","v5_titel":"Welcher Becher?","v_einleitung":"Für Schnelle, zum Nachbereiten und zum Selbstlernen. Jede Frage wieder mit Vorhersage; „Prüfen“ stellt ihre Ausgangslage ein.","v_opt_gleich":"bleibt gleich","v_opt_groesser":"größer","v_opt_kleiner":"kleiner","vergleich_text":"Blass: gemerkter Vergleichslauf (Zugabe nach {t} min): Tasse 1 {a} °C, Tasse 2 {b} °C, Unterschied {d} K.","vergleich_zahl":"Eure Zahl: {ist} · Modell: {soll}","vertiefung_frueh":"Die Vertiefung ist für danach gedacht. Erst Frage 1 und 2.","vor_edelstahl":"Edelstahl einwandig offen","vor_glas":"Glas offen","vor_kein_thermo_deckel":"Thermobecher mit Deckel ist nicht dabei: Es gibt dafür keinen belastbaren Messwert.","vor_keramik":"Keramik offen","vor_keramik_deckel":"Keramik mit Deckel","vor_pappe":"Pappbecher offen","vor_text_edelstahl":"Blankes Metall strahlt weniger Wärme ab; die offene Oberfläche bleibt.","vor_text_glas":"Glas gibt etwa so viel Wärme ab wie Keramik.","vor_text_keramik":"Becher der Aufgabe: 200 ml kühlen in 10 min von 80 auf 67 °C.","vor_text_keramik_deckel":"Ein Deckel bremst Verdunstung und Luftbewegung an der Oberfläche: <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> wird 44 % kleiner.","vor_text_pappe":"Die dünne Wand bremst kaum; Pappe strahlt ähnlich ab wie Keramik.","vor_text_thermo_offen":"Die Vakuumwand hält fast alles; Wärme geht vor allem über die offene Oberfläche.","vor_thermo_offen":"Thermobecher offen","werte_tabelle":"Werte als Tabelle","werte_tabelle_kopf_1":"Tasse 1 [°C]","werte_tabelle_kopf_2":"Tasse 2 [°C]","werte_tabelle_kopf_t":"<math><mrow><mi>t<\/mi><\/mrow><\/math> [min]","zurueckgesetzt":"Zurückgesetzt."},"en":{"abbrechen":"Cancel","anheften_an":"Pin diagram at the top","ansicht_aria":"View of the diagram","ansicht_ln":"Measured values, linearised (ln)","ansicht_temperatur":"Temperature","ansicht_waermestrom":"Heat flow rate","aufl_f1":"At about 56 min (3.86 K; the display shows 3.86 K from 53 to 59 min), exactly at the intersection of the curves. As long as the black coffee is warmer than cup 1, it releases more heat and the difference grows; afterwards it releases less. The difference does not go to zero: the limit is 1.91 K (20 °C versus 18.09 °C), because the cold milk cools cup 2 again when it is mixed in.","aufl_f2":"This depends on your measurement. Often, with an open mug and <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> from the first 10 min, later points lie above the curves. Possible causes: the heat loss grows faster than linearly with <math><mrow><mi>ϑ<\/mi><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/math> (evaporation, free convection), the room temperature is not right, a start-up effect when pouring (mug not fully preheated), the position of the thermometer, mugs that are not the same. Measurements to test this: a mug with a lid, the room temperature measured next to the mugs, the same surface under each mug, the measurement series in the “ln” view (going further). The difference between mug 1 and mug 2 often fits better than the individual values.","aufl_start":"Cup 1, 3.85 K (34.05 versus 30.19 °C). Up to the moment the milk is added, cup 2 was hotter and therefore released more heat: <math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> = 3.69 kJ; 3.69 kJ divided by 957.7 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">J<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> (coffee and milk) gives 3.85 K.","aufl_v1":"47.0 °C; 60.9 °C when the milk is added after 30 min, 37.3 °C after 90 min.","aufl_v2":"The same (3.86 K), but later: when the milk is added after about 100 min instead of 56 min (display 3.86 K from 94 to 106 min). After 60 min the difference with a lid is smaller (3.51 K). Reason: <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> appears only in the product <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><mspace width=\"0.167em\"/><mi>t<\/mi><\/mrow><\/math>;<\/span> the lid stretches the time axis. This holds when both cups have the same <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>.<\/span>","aufl_v3":"Smaller: 3.08 instead of 3.85 K; the heat released increases (46.60 and 50.34 kJ instead of 34.88 and 38.57 kJ) because the mug cools down too; cup 1 stays warmer.","aufl_v4":"Different <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>:<\/span> the difference drops from 3.85 to 2.98 K. A wrong <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> of both mugs changes it by at most 0.04 K. Identical mugs and conditions matter more than an exact <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>.<\/span>","aufl_v5":"The open vacuum mug keeps it warm the longest (estimate: from 80 to 63.5 °C in 30 min, compared with 48.8 °C for the open ceramic mug), followed by ceramic with a lid. The largest difference stays 3.86 K; it only comes later (open vacuum mug after about 127 min). Glass and paper are roughly like ceramic: the wall is not the main resistance; what matters is the open surface and the radiation.","auftrag_erklaeren":"Does your prediction match? Explain to each other why.","auftrag_start":"Explain the difference using <math><mrow><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> and <span class=\"nb\"><math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>.<\/span>","ausgangslage":"Starting point","ausgangslage_gesetzt":"Starting point set: {was}.","ausgleich_genommen":"<math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> from the fitted line kept fixed; the measured value after 10 min stays in the measurement sheet.","ausgleich_nehmen":"Keep <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> from the fitted line","ausgleich_text":"<math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> from all points before the milk ({becher}): {ka} <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">W<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> (line through the origin, {n} points, {von} to {bis} min); with a free intercept {kaf} <span class=\"nb\"><math><mrow><mfrac><mrow><mi mathvariant=\"normal\">W<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math>.<\/span>","becher_und":"{a} and {b}","begruendung_label":"Why? (one sentence, optional)","bereich_formel":"formula, scrolls horizontally","bereich_simulation":"Simulation","bereich_tabelle":"table, scrolls horizontally","bilanz_text":"Dashed: the system boundary around the contents of each cup (with a mug, around contents and mug). The arrow shows the heat flow rate <math><mrow><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mi mathvariant=\"normal\">ab<\/mi><\/msub><\/mrow><\/math> just before the milk is added; its width grows with the heat flow rate.","bilanz_titel":"Control volume","bis":"to","csv_becher":"Measured mug {n} [°C]","csv_datei":"coffee_simulation.csv
