:root {
  --navy: #102d49; --navy-2: #173d5e; --kopfblau: #39718e; --text: #142337; --neben: #5a6b7f; --linie: #d8e1ea;
  --flaeche: #eef5fb; --hellblau: #a9d5ef; --seite: #ffffff; --fehler-rand: #b63434; --fehler-text: #862828;
  --tabkopf: #174d68; --richtig: #227b48; --falsch: #a23838; --radius: 4px;
  --tasse1: #8b5a2b; --tasse2: #222222; --becher3: #3d70a3; --raum: #8a8984; --zweit-rand: #c9dfed; --umsch-aktiv: #d9edf9;
  --umsch-rand: #93bbd4; --reiter-inaktiv: #edf2f6;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--seite); color: var(--text); font: 1rem/1.58 "Fira Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
math { font-family: "Fira Math", "Fira Sans", math; font-size: 1.02em; }
html[data-formeln-fett="1"] math { font-weight: 700; }                 /* K1: zentraler Schalter, vorläufig fett */
math:not([display="block"]) mfrac { font-size: 0.72em; }               /* K3: Bruch im Satz klein, Zeile bleibt */
.formel { display: block; overflow-x: auto; max-width: 100%; margin: 0.6em 0; }
math[display="block"] { margin: 0; }
.punkt { font-weight: 700; }
.sym { width: 0.78em; height: 0.78em; vertical-align: -0.06em; }
.sym-flaeche { width: 1em; height: 1em; vertical-align: -0.15em; }
h1, h2, h3 { color: var(--kopfblau); line-height: 1.25; }
h2 { font-size: 1.15rem; margin: 0 0 0.5rem; }
h3 { font-size: 1.02rem; margin: 0.8rem 0 0.4rem; }
p { margin: 0.4rem 0; }
a { color: var(--navy-2); }
code { font-size: 0.92em; background: var(--flaeche); padding: 0 0.2em; border-radius: 3px; }
.nur-leser { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.klein { font-size: 0.86rem; color: var(--neben); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--navy-2); outline-offset: 2px; }
.kopf :focus-visible { outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 5px var(--navy); }   /* G5-03: Fokus im dunklen Kopf */
.sprung { position: absolute; left: -999px; top: 0; background: var(--navy); color: #fff; padding: 0.5rem 0.8rem; z-index: 50; }
.sprung:focus { left: 0.5rem; top: 0.5rem; }

/* Kopf */
.kopf { background: var(--navy); color: #eef7fc; display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 1rem; }
.kopf-marke { width: 38px; height: 38px; flex: none; border-radius: var(--radius); background: var(--hellblau); color: var(--navy); display: grid; place-items: center; font-weight: 700; }
.kopf-texte { min-width: 0; }
.kopf-zeile { margin: 0; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.9; }
.kopf-titel { margin: 0; font-size: 1.2rem; color: #fff; }
.kopf-rechts { margin-left: auto; display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; justify-content: flex-end; }
.kopf-speicher { margin: 0; font-size: 0.78rem; opacity: 0.9; max-width: 16rem; text-align: right; }
.sprachknopf { white-space: nowrap;  min-height: 44px; min-width: 44px; padding: 0.3rem 0.7rem; border: 1px solid var(--zweit-rand); border-radius: var(--radius); background: #fff; color: var(--navy); font: 600 0.85rem "Fira Sans", sans-serif; cursor: pointer; }

/* Rahmen */
main:focus { outline: none; }
.seite { max-width: 1240px; margin: 0 auto; padding: 0.8rem 1rem 2rem; display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); }
.banner { background: #fff7e0; border-bottom: 1px solid #e8d48f; padding: 0.7rem 1rem; }
.banner p { margin: 0.2rem 0; }
.banner .knopfzeile { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.4rem; }

/* Knöpfe: Rangfolge wie v8 (eine dunkle Hauptaktion) */
button { font: inherit; cursor: pointer; }
.knopf-haupt { min-height: 44px; padding: 0.55rem 1rem; border: 1px solid var(--navy); border-radius: var(--radius); background: var(--navy); color: #fff; font-weight: 600; }
.knopf-haupt:disabled { background: #8a99a8; border-color: #8a99a8; cursor: not-allowed; }
.knopf-zweit { min-height: 44px; padding: 0.5rem 0.8rem; border: 1px solid var(--zweit-rand); border-radius: var(--radius); background: var(--flaeche); color: var(--kopfblau); font-weight: 600; text-align: center; }
.knopf-zweit:disabled { color: #8a99a8; cursor: not-allowed; }
.knopf-schlicht { min-height: 44px; padding: 0.45rem 0.8rem; border: 1px solid var(--linie); border-radius: var(--radius); background: #fff; color: var(--navy-2); font-weight: 600; }
.knopf-text { min-height: 44px; padding: 0.3rem 0.2rem; border: 0; background: none; color: var(--navy-2); text-decoration: underline; font-size: 0.9rem; }
.knopf-text:disabled { color: #8a99a8; cursor: not-allowed; }
.umschalter { min-height: 44px; padding: 0.45rem 0.8rem; border: 1px solid var(--zweit-rand); border-radius: var(--radius); background: var(--flaeche); color: var(--kopfblau); font-weight: 600; }
.umschalter[aria-pressed="true"] { background: var(--umsch-aktiv); color: var(--navy); border-color: var(--umsch-rand); box-shadow: inset 0 -2px 0 var(--kopfblau); }
.knopfzeile { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }

/* Frageleiste */
.frageleiste { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); padding: 0.8rem 1rem; }
.frageleiste h2 { margin: 0 0 0.3rem; font-size: 1.05rem; }
.frage-nr { color: var(--neben); font-weight: 600; font-size: 0.85rem; margin: 0; }
.frage-text { margin: 0.3rem 0 0.6rem; }
.frage-eingabe { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: flex-end; margin: 0.5rem 0; }
.frage-eingabe fieldset { border: 0; padding: 0; margin: 0; }
.frage-eingabe legend { font-weight: 600; font-size: 0.9rem; padding: 0; margin-bottom: 0.2rem; }
.wahl { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.wahl label { display: inline-flex; align-items: center; gap: 0.4rem; min-height: 44px; padding: 0.3rem 0.7rem; border: 1px solid var(--zweit-rand); border-radius: var(--radius); background: #fff; cursor: pointer; }
.wahl input { width: 20px; height: 20px; margin: 0; accent-color: var(--navy-2); }
.wahl label:has(input:checked) { border-color: var(--navy-2); background: var(--umsch-aktiv); }
.feld { display: grid; gap: 0.15rem; font-size: 0.9rem; font-weight: 600; }
.feld input[type="text"] { font: 400 16px "Fira Sans", sans-serif; min-height: 44px; width: 7.5rem; padding: 0.35rem 0.5rem; border: 1px solid #9fb1c2; border-radius: var(--radius); background: #fff; color: var(--text); }
.feld-breit input[type="text"] { width: min(32rem, 100%); }
.feld-breit { flex: 1 1 18rem; }
.feld-einheit { display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 400; }
.feld input[aria-invalid="true"], .zelle input[aria-invalid="true"] { border-color: var(--fehler-rand); border-width: 2px; }
.feld-fehler { color: var(--fehler-text); font-size: 0.85rem; font-weight: 400; margin: 0.1rem 0 0; }
.feld-fehler.neutral { color: var(--neben); }
/* G5-15, G6-07: Aufklappzeichen sichtbar, auch wenn summary flex ist */
summary { list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸" / ""; display: inline-block; width: 1.1em; flex: none; color: var(--navy-2); }
details[open] > summary::before { content: "▾" / ""; }
.rueck-box { border: 1px solid #e8d48f; border-radius: var(--radius); margin: 0.5rem 0; }
.kern-leiste { display: none; }
@media (min-width: 768px) { .kern-leiste { display: flex; gap: 1.2rem; position: sticky; top: 0; z-index: 4; background: #fff; border-bottom: 2px solid var(--hellblau); padding: 0.3rem 0.2rem; font-size: 0.9rem; } .kern-leiste b { font-variant-numeric: tabular-nums; } }
html { scroll-padding-top: calc(var(--anheft, 0px) + 8px); }   /* G5-02, G6-02: Fokus nicht unter dem angehefteten Diagramm */
.knopf-anheften { display: none; }

.frage-knoepfe { display: flex; flex-wrap: wrap; gap: 0.5rem 0.8rem; align-items: center; margin-top: 0.5rem; }
.frage-nav { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-left: auto; }
.auftrag { margin: 0.6rem 0 0; padding: 0.5rem 0.7rem; border-left: 3px solid var(--kopfblau); background: #fff; }
.aufloesung { margin-top: 0.6rem; padding: 0.6rem 0.8rem; background: #fff; border: 1px solid var(--linie); border-radius: var(--radius); }
.vergleich-ok { color: var(--richtig); font-weight: 600; }
.vergleich-nein { color: var(--falsch); font-weight: 600; }
.hinweis { color: var(--neben); font-size: 0.88rem; margin: 0.3rem 0; }

/* Simulation: Raster wie v8 */
.ansichten { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.6rem; }
.sim-raster { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
.diagramm { margin: 0; min-width: 0; }
.diagramm-halter { position: relative; max-width: 780px; background: #fff; }
#diagramm { display: block; width: 100%; height: auto; font-family: "Fira Sans", sans-serif; }
.vorhersage-zeile { margin: 0.2rem 0 0; font-size: 0.85rem; color: var(--navy); background: var(--flaeche); border: 1px solid var(--navy-2); border-radius: var(--radius); padding: 0.1rem 0.4rem; display: inline-block; }
.lesehinweis { font-size: 0.92rem; margin: 0.4rem 0 0; }
.legende-mess, .flaechen { font-size: 0.88rem; color: var(--neben); margin: 0.2rem 0 0; }
.kernzahlen { display: none; }
.wertetabelle { margin-top: 0.4rem; font-size: 0.9rem; }
.wertetabelle summary, details > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; color: var(--navy-2); }
.knoepfe { display: grid; gap: 0.6rem; align-content: start; }
.knopf-info { font-size: 0.85rem; color: var(--neben); margin: 0; min-height: 1.2em; }
.energie, .bilanz { border: 1px solid var(--linie); border-radius: var(--radius); padding: 0.6rem 0.7rem; background: #fff; }
.kasten-titel { font-size: 0.95rem; margin: 0 0 0.3rem; }
.energie svg, .bilanz svg { display: block; width: 100%; max-width: 17rem; height: auto; margin: 0 auto; }
.energie-satz { font-size: 0.88rem; margin: 0.3rem 0 0; }

/* Regler */
.regler-raster { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
.regler-bereich { min-width: 0; }
.rueckblick { border: 1px solid var(--linie); border-left: 3px solid var(--kopfblau); background: #fff; padding: 0.5rem 0.8rem; margin: 0 0 0.8rem; border-radius: var(--radius); }
.regler-pflicht .regler-gitter { grid-template-columns: minmax(0, 34rem) !important; }
.regler-gitter { display: grid; gap: 0.9rem 1.4rem; grid-template-columns: repeat(auto-fill, minmax(min(19rem, 100%), 1fr)); }
.regler { min-width: 0; }
.regler-kopf { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.4rem; }
.regler-name { font-size: 0.78rem; font-weight: 700; line-height: 1.35; padding-top: 0.2rem; }
.hilfe-knopf { flex: none; width: 44px; height: 44px; margin: -8px -10px -8px 0; border: 0; background: none; display: grid; place-items: center; }
.hilfe-knopf span { width: 22px; height: 22px; border-radius: 50%; background: var(--flaeche); border: 1px solid var(--zweit-rand); color: var(--navy-2); font-weight: 700; font-size: 0.8rem; display: grid; place-items: center; }
.hilfe-text { font-size: 0.82rem; color: var(--neben); margin: 0.1rem 0 0.3rem; }
.regler-zeile { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px auto; gap: 0.3rem; align-items: center; }
.regler-zeile input[type="range"] { width: 100%; min-width: 0; height: 44px; margin: 0; accent-color: var(--navy-2); }
.pm { width: 44px; height: 44px; border: 1px solid var(--zweit-rand); border-radius: var(--radius); background: var(--flaeche); color: var(--navy-2); font-weight: 700; font-size: 1.1rem; display: grid; place-items: center; padding: 0; }
.pm:disabled { color: #8a99a8; }
.zahlfeld { font: 400 16px "Fira Sans", sans-serif; width: 5.6rem; min-height: 44px; padding: 0.3rem 0.4rem; border: 1px solid #9fb1c2; border-radius: var(--radius); text-align: right; font-variant-numeric: tabular-nums; }
.zahlfeld[aria-invalid="true"] { border-color: var(--fehler-rand); border-width: 2px; }
.regler.gesperrt .regler-zeile { opacity: 0.55; }
.schalter { display: flex; gap: 0.5rem; align-items: center; min-height: 44px; font-size: 0.9rem; }
.schalter input { width: 22px; height: 22px; margin: 0; accent-color: var(--navy-2); flex: none; }
.fehler-meldung { color: var(--fehler-text); background: #fbecec; border: 1px solid var(--fehler-rand); border-radius: var(--radius); padding: 0.4rem 0.6rem; }
.vertiefung { margin-top: 0.8rem; border-top: 1px solid var(--linie); }
.vertiefung > summary { font-size: 1.05rem; color: var(--kopfblau); }
.gruppe { border: 0; padding: 0; margin: 0.6rem 0 0; }
.gruppe > summary, .gruppe-titel { font-weight: 700; color: var(--kopfblau); }
.gruppe-inhalt { padding: 0.3rem 0 0.4rem; }
.voreinstellungen { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.3rem 0; }
.info-kasten { background: var(--flaeche); border-radius: var(--radius); padding: 0.5rem 0.7rem; font-size: 0.9rem; margin: 0.4rem 0; }
.radio-zeile { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; }
.radio-zeile label { display: inline-flex; align-items: center; gap: 0.4rem; min-height: 44px; font-size: 0.9rem; }
.radio-zeile input { width: 20px; height: 20px; margin: 0; accent-color: var(--navy-2); }
.hinweis-frueh { background: #fff7e0; border-radius: var(--radius); padding: 0.4rem 0.6rem; font-size: 0.9rem; }

/* Rechenwerte */
.rechenwerte { background: var(--flaeche); border-radius: var(--radius); padding: 0.7rem 0.8rem; }
.rechenwerte dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.4rem 0.8rem; margin: 0.3rem 0 0; }
.rechenwerte dt { font-size: 0.8rem; color: var(--neben); }
.rechenwerte dd { margin: 0; font-size: 0.95rem; font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.rechenwerte .breit { grid-column: 1 / -1; }

/* Messblatt */
.messblatt { border-top: 1px solid var(--linie); padding-top: 0.8rem; margin-top: 0.8rem; }
.messtabelle { border-collapse: collapse; width: 100%; max-width: 46rem; font-size: 0.9rem; }
.messtabelle th { background: var(--tabkopf); color: #fff; font-weight: 600; padding: 0.35rem 0.4rem; text-align: left; vertical-align: bottom; }
.messtabelle tbody th { background: var(--flaeche); color: var(--text); font-weight: 600; vertical-align: middle; border-bottom: 1px solid var(--linie); }
.messtabelle td { border-bottom: 1px solid var(--linie); padding: 0.2rem 0.3rem; }
.messtabelle th:first-child, .messtabelle td:first-child { white-space: nowrap; }
.zelle input { font: 400 16px "Fira Sans", sans-serif; width: 100%; min-width: 3.6rem; min-height: 44px; padding: 0.25rem 0.35rem; border: 1px solid #9fb1c2; border-radius: var(--radius); text-align: right; }
.zelle input:disabled { background: #f0f2f4; border-color: #d0d6dc; }
.mess-zusatz { display: flex; flex-wrap: wrap; gap: 0.5rem 1.2rem; margin: 0.6rem 0; align-items: flex-end; }
.link-ausgabe { word-break: break-all; font-size: 0.85rem; background: var(--flaeche); padding: 0.4rem; border-radius: var(--radius); }

/* Reiter (K5, R12-09) */
.reiter-bereich { margin-top: 0.5rem; }
.reiter { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: stretch; margin-top: 1rem; }
.reiter button { min-width: 0; min-height: 44px; padding: 0.65rem 0.4rem; border: 1px solid var(--linie); border-bottom: 0; border-radius: 6px 6px 0 0; background: var(--reiter-inaktiv); color: var(--neben); font: 600 13px/1.3 "Fira Sans", sans-serif; position: relative; }
.reiter button[aria-selected="true"] { background: #fff; border-color: var(--kopfblau); border-top-width: 3px; color: var(--kopfblau); z-index: 1; }
.reiter button[aria-selected="true"]::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: #fff; }
.reiter-panel { border: 1px solid var(--kopfblau); border-radius: 0 0 var(--radius) var(--radius); padding: 0.9rem 1rem; line-height: 1.65; }
.karte { border-top: 1px solid var(--linie); padding: 0.5rem 0; }
.karte > summary { font-weight: 700; color: var(--text); }
.karte-status { font-weight: 400; color: var(--neben); font-size: 0.85rem; margin-left: 0.4rem; }
.abschnitt > summary { font-weight: 700; color: var(--kopfblau); }
.tabelle-wrap { overflow-x: auto; max-width: 100%; }
.reiter-panel table { border-collapse: collapse; font-size: 0.88rem; }
.reiter-panel th { background: var(--tabkopf); color: #fff; text-align: left; padding: 0.3rem 0.4rem; font-weight: 600; }
.reiter-panel td { border-bottom: 1px solid var(--linie); padding: 0.3rem 0.4rem; vertical-align: top; }

/* Fuß */
.fuss { border-top: 1px solid var(--linie); color: var(--neben); font-size: 0.85rem; padding: 1rem; max-width: 1240px; margin: 0 auto; }
.fuss-reset { margin-top: 0.6rem; }

/* ab 768 px: Bild links, Knöpfe 180 px rechts */
@media (min-width: 768px) {
  .sim-raster { grid-template-columns: minmax(0, 780px) 240px; justify-content: start; }
  .regler-raster { grid-template-columns: minmax(0, 1fr) 300px; }
}
/* ab 1200 px: Regler in drei Spalten, Rechenwerte rechts (v8) */
@media (min-width: 1200px) {
  .seite { padding: 1rem 1.5rem 2rem; }
  .sim-raster { grid-template-columns: minmax(0, 780px) 200px; }
  .regler-raster { grid-template-columns: minmax(0, 1fr) 320px; }
}
/* bis 767 px: eine Spalte, Bild oben angeheftet (höchstens 45 % der sichtbaren Höhe) */
@media (max-width: 767px) {
  .kopf { padding: 0.5rem 0.7rem; }
  .kopf-speicher { display: none; }
  .kopf-titel { font-size: 1.05rem; }
  .seite { padding: 0.5rem 0.7rem 2rem; }
  .simulation { display: flex; flex-direction: column; }
  /* Anheften: Raster und Figur geben ihre Box ab, damit der Diagrammhalter innerhalb des ganzen Simulationsbereichs
     (Regler, Vertiefung, Messblatt) oben bleibt; sonst endet „sticky“ am Ende der Figur. */
  html.handy .sim-raster, html.handy #diagramm-figur { display: contents; }
  /* M-6: Diagramm oben angeheftet, Frage direkt darunter, dann der Regler „Zugabe nach“ */
  html.handy .simulation { display: flex; flex-direction: column; }
  html.handy .diagramm-halter { order: -3; }
  html.handy .frageleiste { order: -2; margin-top: 0.6rem; }
  html.handy .regler-pflicht { order: -1; }
  .knopf-anheften:not([hidden]) { display: inline-flex; min-height: 44px; font-size: 0.85rem; }
  .kopf-speicher.aus { display: block; max-width: none; text-align: left; }

  html.anheften .diagramm-halter { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 3px solid var(--hellblau); }
  html.anheften .kernzahlen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.3rem; background: #fff; padding: 0.2rem 0.3rem; font-size: 0.8rem; }
  .kernzahlen b { display: block; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
  .reiter button { font-size: 13px; padding: 0.55rem 0.2rem; }
  .regler-zeile { grid-template-columns: 44px minmax(0, 1fr) 44px 5.2rem; }
  .zahlfeld { width: 5.2rem; }
  .messtabelle { font-size: 0.82rem; }
  .messtabelle th { padding: 0.3rem 0.25rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
@media print { .kopf, .knoepfe, .regler-raster, .messblatt, .fuss-reset, .sprachknopf { display: none !important; } }

/* Korrekturen Runde 1 */
input[type="text"] { border-color: #7d8fa1 !important; }                          /* G5-09: Rand mindestens 3:1 */
.hinweis, .karte-status, .aufloesung, .rueckblick, .link-ausgabe { overflow-wrap: anywhere; }   /* G8-14 */
.nb { white-space: nowrap; }                                                      /* G1-14, G6-17: Satzzeichen nicht allein */
@media (forced-colors: active) { #diagramm, .energie svg, .bilanz svg, .sym { forced-color-adjust: none; background: #fff; } }   /* G5-23 */
@media (min-width: 1200px) { .sim-raster { grid-template-columns: minmax(0, 780px) minmax(0, 300px); } }   /* G6-06, G6-12 */
.wertetabelle th, .wertetabelle td { text-align: right; font-variant-numeric: tabular-nums; }   /* G6-31 */
.frage-text-zu > summary { font-weight: 600; min-height: 44px; }   /* G7-03 */
@media (min-width: 768px) { html { scroll-padding-top: var(--kern, 56px); } html.kern-frei .kern-leiste { position: static; } }   /* G5-R2-01, X5-04: Abstand aus der gemessenen Höhe der Kernleiste */
.kurven-legende { margin: 0.2rem 0 0; font-size: 0.85rem; }
.sym-linie { width: 1.6em; }
/* X5-05: Reglerzeile bricht um, wenn der Platz fehlt (große Schrift, schmale Spalte): Regler oben, Minus, Zahlenfeld, Plus darunter */
.regler { container-type: inline-size; }
@container (max-width: 17.5rem) {
  .regler-zeile { grid-template-columns: 44px minmax(0, 1fr) 44px !important; }
  .regler-zeile input[type="range"] { grid-row: 1; grid-column: 1 / -1; }
  .regler-zeile .pm[data-pm="-1"] { grid-row: 2; grid-column: 1; }
  .regler-zeile .zahlfeld { grid-row: 2; grid-column: 2; width: 100%; max-width: 8rem; justify-self: center; }
  .regler-zeile .pm[data-pm="1"] { grid-row: 2; grid-column: 3; }
}
/* X5-05: bei großer Schrift nichts breiter als die Spalte */
.hilfe-knopf { margin-right: 0; }
.knoepfe > *, .regler-bereich, .gruppe { min-width: 0; }
.knopf-haupt, .knopf-zweit, .knopf-schlicht, .umschalter { max-width: 100%; overflow-wrap: anywhere; }
.rechenwerte dl { grid-template-columns: repeat(auto-fit, minmax(min(8.5rem, 100%), 1fr)); }
.rechenwerte dt { overflow-wrap: anywhere; }
.schalter, .karte > summary, .reiter-panel { overflow-wrap: anywhere; min-width: 0; }
.schalter > span, .schalter { flex-wrap: wrap; }
/* G6-R3-04: Zeile der Ersatzlegende bleibt frei, damit der Regler darunter beim Schieben nicht springt */
.kurven-legende { min-height: 1.7em; }
.kurven-legende[hidden] { display: block !important; visibility: hidden; }

<script>// Kaffee mit Milch: Simulation. Gebaut aus simulation/site/src mit simulation/site/bauen.py (Stand 2026-11-05, Quellen 448e594d3a).
// MODELL-ANFANG: gleiche Gleichungen und Standardwerte wie kaffee_modell.py (rechne, zwei_tassen)
const P = { V_K: 200e-6, rho_K: 1000.0, cp_K: 4180.0, V_M: 30e-6, rho_M: 1030.0, cp_M: 3940.0, th_K0: 80.0, th_M: 5.0,
            th_U: 20.0, t_end: 60 * 60.0, t_mess: 10 * 60.0, th_mess: 67.0, th_Mh: 60.0, m_B: 0.300, c_B: 850.0 };
const K = 273.15;

function rechne(p) {
  const r = Object.assign({}, p);
  r.m_K = p.rho_K * p.V_K;
  r.m_M = p.rho_M * p.V_M;
  r.C_K = r.m_K * p.cp_K;
  r.C_M = r.m_M * p.cp_M;
  r.C_G = r.C_K + r.C_M;
  const T_K0 = p.th_K0 + K, T_M = p.th_M + K, T_U = p.th_U + K;
  Object.assign(r, { T_K0: T_K0, T_M: T_M, T_U: T_U, T_mess: p.th_mess + K });
  r.ln_mess = Math.log((r.T_mess - T_U) / (T_K0 - T_U));
  r.kA = -r.C_K / p.t_mess * r.ln_mess;
  r.a_K = r.kA / r.C_K;
  r.a_G = r.kA / r.C_G;
  const mix = TK => (r.C_K * TK + r.C_M * T_M) / r.C_G;
  r.T1_0 = mix(T_K0);
  r.e_G = Math.exp(-r.a_G * p.t_end);
  r.T1 = T_U + (r.T1_0 - T_U) * r.e_G;
  r.e_K = Math.exp(-r.a_K * p.t_end);
  r.T2_K = T_U + (T_K0 - T_U) * r.e_K;
  r.T2 = mix(r.T2_K);
  r.dT = r.T1 - r.T2;
  r.Q1 = r.C_G * (r.T1_0 - r.T1);
  r.Q2 = r.C_K * (T_K0 - r.T2_K);
  const d = r.a_K - r.a_G;
  r.t_schnitt = d > 0 ? Math.log((T_K0 - T_U) / (r.T1_0 - T_U)) / d : Infinity;
  return r;
}

function zweiTassen(p, C_T = 0.0, th_M1 = null, th_M2 = null, kA1_faktor = 1.0, t_end = null) {
  const r = rechne(p);
  th_M1 = th_M1 === null ? p.th_M : th_M1;
  th_M2 = th_M2 === null ? th_M1 : th_M2;
  const t = t_end === null ? p.t_end : t_end;
  const CKT = r.C_K + C_T, CGT = r.C_G + C_T;
  const kA = -CKT / p.t_mess * r.ln_mess;
  const T10 = (CKT * r.T_K0 + r.C_M * (th_M1 + K)) / CGT;
  const T1 = r.T_U + (T10 - r.T_U) * Math.exp(-kA1_faktor * kA * t / CGT);
  const T2K = r.T_U + (r.T_K0 - r.T_U) * Math.exp(-kA * t / CKT);
  const T2 = (CKT * T2K + r.C_M * (th_M2 + K)) / CGT;
  return { kA: kA, T1_0: T10, T1: T1, T2_K: T2K, T2: T2, dT: T1 - T2, th1: T1 - K, th2: T2 - K };
}

// Einstellungen des Werkzeugs (Einheiten der Regler) in die Größen des Modells übersetzen und auswerten
function berechne(e) {
  const p = Object.assign({}, P, { V_K: e.VK_ml * 1e-6, V_M: e.VM_ml * 1e-6, th_K0: e.thK0, th_M: e.thM, th_U: e.thU,
                                   th_mess: e.thMess, m_B: e.mB_g / 1000, t_end: e.tEnd_min * 60.0 });
  const r = rechne(p);
  const C_T = e.becher ? p.m_B * p.c_B : 0.0;
  const th_M2 = e.milch2Raum ? p.th_U : p.th_M;
  const z = zweiTassen(p, C_T, p.th_M, th_M2, e.kA1Faktor, p.t_end);
  const CKT = r.C_K + C_T, CGT = r.C_G + C_T;
  const a1 = e.kA1Faktor * z.kA / CGT, a2 = z.kA / CKT;          // Abklingraten von Tasse 1 und vom schwarzen Kaffee
  // abgegebene Wärme bis zur Zugabe: Energiebilanz um den Bilanzraum (Inhalt, mit Becher auch der Becher), wie Teil e
  const Q1 = CGT * (z.T1_0 - z.T1), Q2 = CKT * (r.T_K0 - z.T2_K);
  // Schnittpunkt der beiden Kurven vor der Zugabe, in beiden Richtungen (wie t_schnitt in rechne(), dort nur für a2 > a1):
  // (T_K0 - T_U) exp(-a2 t) = (T1_0 - T_U) exp(-a1 t)  =>  t = ln((T_K0 - T_U) / (T1_0 - T_U)) / (a2 - a1), gültig für t > 0
  const d = a2 - a1, q = (r.T_K0 - r.T_U) / (z.T1_0 - r.T_U);
  let tS = Infinity;
  if (d !== 0 && q > 0) { const t = Math.log(q) / d; if (t > 0) tS = t; }
  return { kA: z.kA, T1_0: z.T1_0, T1: z.T1, T2_K: z.T2_K, T2: z.T2, dT: z.dT, th1: z.th1, th2: z.th2, Q1: Q1, Q2: Q2,
           t_schnitt: tS, kaffee_danach_kuehler: d > 0, T_K0: r.T_K0, T_U: r.T_U,
           kurve1: t => r.T_U + (z.T1_0 - r.T_U) * Math.exp(-a1 * t),          // Tasse 1, t in s
           kurve2: t => r.T_U + (r.T_K0 - r.T_U) * Math.exp(-a2 * t) };        // Tasse 2 vor der Zugabe
}
// MODELL-ENDE
// ERWEITERUNG-ANFANG: Erweiterungen nach KONZEPT.md Fassung 2, Abschnitt 8.2 (M2, M3, M4, M8, M9, M10), ohne Bezug zur Oberfläche.
// Setzt auf dem unveränderten Block MODELL auf (P, K, rechne, zweiTassen, berechne). Python-Referenz: simulation/modell/kaffee_erweitert.py.
// Einstellungen e: VK_ml, VM_ml, thK0, thM, thU (°C), tEnd_min (Zugabe, min), becher, mB_g, milch2Raum, kA1Faktor,
// kAQuelle ("fest" oder "messung"), kA (W/K bei "fest"), thMess (°C bei "messung").
const ERW = (() => {
  const VOREINSTELLUNGEN = [
    { id: "keramik", faktor: 1.00, art: "belegt" },
    { id: "keramik_deckel", faktor: 0.56, art: "belegt" },
    { id: "glas", faktor: 1.00, art: "richtwert" },
    { id: "pappe", faktor: 1.00, art: "richtwert" },
    { id: "edelstahl", faktor: 0.90, art: "richtwert" },
    { id: "thermo_offen", faktor: 0.44, art: "richtwert" }
  ];
  const KA_AUFGABE = rechne(P).kA;                      // Teil c: 80 auf 67 °C in 10 min, 200 ml, ohne Becher

  function kapazitaeten(e) {
    const C_K = P.rho_K * e.VK_ml * 1e-6 * P.cp_K, C_M = P.rho_M * e.VM_ml * 1e-6 * P.cp_M;
    const C_B = e.becher ? e.mB_g / 1000 * P.c_B : 0.0;
    return { C_K: C_K, C_M: C_M, C_B: C_B, C_KB: C_K + C_B, C_GB: C_K + C_M + C_B };
  }
  // M8: gleichwertiger Messwert nach 10 min, aus dem der Block MODELL genau dieses kA rechnet (nie als Messung angezeigt)
  function messwertFuer(kA, e) {
    return e.thU + (e.thK0 - e.thU) * Math.exp(-kA * 600 / kapazitaeten(e).C_KB);
  }
  // Gültigkeit wie im geprüften Werkzeug (D116); bei kA festhalten zusätzlich kA > 0. Leer heißt gültig.
  function fehler(e) {
    if (!(e.thK0 > e.thU)) return "anfang_ueber_raum";
    if (e.kAQuelle === "fest") return e.kA > 0 ? "" : "kA_positiv";
    if (!(e.thMess > e.thU && e.thMess < e.thK0)) return "messung_zwischen";
    return "";
  }
  function modellEinstellung(e) {
    return e.kAQuelle === "fest" ? Object.assign({}, e, { thMess: messwertFuer(e.kA, e) }) : e;
  }
  function auswerten(e) {
    const em = modellEinstellung(e), m = berechne(em), m3 = berechne(Object.assign({}, em, { milch2Raum: true }));
    const c = kapazitaeten(e), T_U = e.thU + K, T_K0 = e.thK0 + K, kA = m.kA, f1 = e.kA1Faktor;
    const a1 = f1 * kA / c.C_GB, a2 = kA / c.C_KB, thM2 = e.milch2Raum ? e.thU : e.thM;
    const T1 = t => T_U + (m.T1_0 - T_U) * Math.exp(-a1 * t), T2K = t => T_U + (T_K0 - T_U) * Math.exp(-a2 * t);
    const dQ = t => c.C_KB * (T_K0 - T2K(t)) - c.C_GB * (m.T1_0 - T1(t));       // Q2(t) - Q1(t) in J
    let t_q = Infinity;                                                          // gleiche Wärmeströme
    const zq = (T_K0 - T_U) / (f1 * (m.T1_0 - T_U));
    if (a2 !== a1 && zq > 0) { const t = Math.log(zq) / (a2 - a1); if (t > 0) t_q = t; }
    const tz = e.tEnd_min * 60;
    const vor = t_q < tz ? dQ(t_q) : dQ(tz), nach = t_q < tz ? dQ(tz) - dQ(t_q) : 0;
    const milch = c.C_M * (e.thM - thM2);
    return {
      kA: kA, thMessModell: em.thMess, th10: m.T1_0 - K, th1: m.th1, th2: m.th2, th2K: m.T2_K - K, th2Raum: m3.th2,
      dT: m.dT, Q1: m.Q1 / 1e3, Q2: m.Q2 / 1e3, milch: milch / 1e3,
      energieRest: (c.C_GB * m.dT - (m.Q2 - m.Q1) - milch) / 1e3,
      tSchnitt: m.t_schnitt / 60, kaffeeDanachKuehler: m.kaffee_danach_kuehler, tWaermestrom: t_q / 60,
      flaecheVor: vor / 1e3, flaecheNach: nach / 1e3,
      qdot1: t_min => f1 * kA * (T1(t_min * 60) - T_U), qdot2: t_min => kA * (T2K(t_min * 60) - T_U),
      kurve1: t_min => m.kurve1(t_min * 60) - K, kurve2: t_min => m.kurve2(t_min * 60) - K,
      schwarz30: m.kurve2(1800) - K, tauMin: c.C_KB / kA / 60,
      C_K: c.C_K, C_M: c.C_M, C_B: c.C_B, C_KB: c.C_KB, C_GB: c.C_GB
    };
  }
  // M4 (kann): beide Tassen nach der Zugabe bis tV, Tasse 1 mit f1 kA
  function nachZugabe(e, tV_min) {
    const r = auswerten(e), c = kapazitaeten(e), dt = (tV_min - e.tEnd_min) * 60;
    const th1 = e.thU + (r.th1 - e.thU) * Math.exp(-e.kA1Faktor * r.kA * dt / c.C_GB);
    const th2 = e.thU + (r.th2 - e.thU) * Math.exp(-r.kA * dt / c.C_GB);
    return { th1: th1, th2: th2, dT: th1 - th2 };
  }
  // M9 (kann): Becher beim Eingießen auf Raumtemperatur, sofortiger Ausgleich bei t = 0; nur mit kA festhalten und Becher an
  function becherKalt(e) {
    const c = kapazitaeten(e), kA = e.kA, t = e.tEnd_min * 60;
    const th1_0 = (c.C_K * e.thK0 + c.C_M * e.thM + c.C_B * e.thU) / c.C_GB;
    const thK_0 = (c.C_K * e.thK0 + c.C_B * e.thU) / c.C_KB;
    const th1 = e.thU + (th1_0 - e.thU) * Math.exp(-e.kA1Faktor * kA * t / c.C_GB);
    const thK = e.thU + (thK_0 - e.thU) * Math.exp(-kA * t / c.C_KB);
    const th2 = (c.C_KB * thK + c.C_M * (e.milch2Raum ? e.thU : e.thM)) / c.C_GB;
    return { th1_0: th1_0, thK_0: thK_0, th1: th1, th2: th2, dT: th1 - th2 };
  }
  // M10 (kann): Zeit in min bis zur Trinktemperatur thT
  function trinkzeit(e, thT) {
    const r = auswerten(e);
    const zeit = (th0, C, f) => th0 <= thT ? 0 : (thT <= e.thU ? Infinity : C / (f * r.kA) * Math.log((th0 - e.thU) / (thT - e.thU)) / 60);
    return { tasse1: zeit(r.th10, r.C_GB, e.kA1Faktor), schwarz: zeit(e.thK0, r.C_KB, 1) };
  }
  // M2: Ausgleichsgerade durch den Ursprung und mit freiem Achsenabschnitt; punkte = [[t_min, theta], ...] ohne Startpunkt
  function ausgleich(punkte, th0, thU, C_KB) {
    const xs = punkte.map(p => p[0] * 60), ys = punkte.map(p => Math.log((p[1] - thU) / (th0 - thU)));
    let sxy = 0, sxx = 0; for (let i = 0; i < xs.length; i++) { sxy += xs[i] * ys[i]; sxx += xs[i] * xs[i]; }
    const b0 = sxy / sxx, X = [0].concat(xs), Y = [0].concat(ys), n = X.length;
    const mx = X.reduce((a, v) => a + v, 0) / n, my = Y.reduce((a, v) => a + v, 0) / n;
    let s1 = 0, s2 = 0; for (let i = 0; i < n; i++) { s1 += (X[i] - mx) * (Y[i] - my); s2 += (X[i] - mx) ** 2; }
    const b1 = s1 / s2;
    return { kA_ursprung: -C_KB * b0, kA_frei: -C_KB * b1, achsenabschnitt: my - b1 * mx, n: punkte.length };
  }
  // Konzept 8.1: größter Unterschied über t_Z bei gleichem kA (analytisch über den Schnitt)
  function groessterUnterschied(e) {
    const c = kapazitaeten(e), r = auswerten(Object.assign({}, e, { tEnd_min: 1 }));
    const q = (e.thK0 - e.thU) / (r.th10 - e.thU), thx = e.thU + (e.thK0 - e.thU) * Math.pow(q, -c.C_GB / c.C_M);
    return { dT_max: c.C_M * (thx - e.thM) / c.C_GB, th_x: thx, t_min: Math.log(q) / (r.kA / c.C_KB - r.kA / c.C_GB) / 60 };
  }
  return { VOREINSTELLUNGEN, KA_AUFGABE, kapazitaeten, messwertFuer, fehler, modellEinstellung, auswerten, nachZugabe,
           becherKalt, trinkzeit, ausgleich, groessterUnterschied };
})();
// ERWEITERUNG-ENDE
// HILFEN-ANFANG: Zahlen lesen und schreiben, Kurslink (ZUSTAENDE.md, Abschnitt 5). Ohne Bezug zur Oberfläche, in Node testbar.
const HILFEN = (() => {
  // Eine Zahl nur, wenn der ganze Text eine Zahl ist (Komma oder Punkt), sonst NaN; aus dem geprüften Werkzeug (Befund Simulation 5),
  // ergänzt: mehr als ein Trennzeichen gilt als Tausendertrennung und wird abgelehnt ("tausender").
  function zahlLesen(text) {
    const t = String(text).trim().replace("−", "-");
    if ((t.match(/[.,]/g) || []).length > 1) return { wert: NaN, grund: "tausender" };
    const u = t.replace(",", ".");
    return /^[+-]?\d+(\.\d+)?$/.test(u) ? { wert: Number(u), grund: "" } : { wert: NaN, grund: t === "" ? "leer" : "keine_zahl" };
  }
  function zahlText(x, stellen, sprache) {
    if (!isFinite(x)) return "";
    let s = (Math.abs(x) < 0.5 * Math.pow(10, -stellen) ? 0 : x).toFixed(stellen);
    if (s.charAt(0) === "-") s = "−" + s.slice(1);
    return sprache === "de" ? s.replace(".", ",") : s;
  }

const TEXTE = {"de":{"abbrechen":"Abbrechen","anheften_an":"Diagramm oben anheften","anheften_aus":"Diagramm lösen","ansicht_aria":"Ansicht des Diagramms","ansicht_ln":"Messwerte linear (ln)","ansicht_temperatur":"Temperatur","ansicht_waermestrom":"Wärmestrom","aufl_f1":"Etwa nach 56 min (3,86 K; die Anzeige zeigt 3,86 K von 53 bis 59 min), genau am Schnittpunkt der Kurven. Solange der schwarze Kaffee wärmer ist als Tasse 1, gibt er mehr Wärme ab, und der Unterschied wächst; danach gibt er weniger ab. Der Unterschied geht nicht gegen null: Grenzwert 1,91 K (20 °C gegen 18,09 °C), weil die kalte Milch Tasse 2 beim Mischen erneut abkühlt. Seht euch in der Vertiefung in der Ansicht „Wärmestrom“ die Fläche zwischen den Kurven an.","aufl_f2":"Hängt von eurer Messung ab. Häufig beim offenen Becher und <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> aus den ersten 10 min: Spätere Punkte liegen über den Kurven. Mögliche Ursachen: Die Wärmeabgabe wächst stärker als linear mit <math><mrow><mi>ϑ<\/mi><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/math> (Verdunstung, freie Konvektion), die Raumtemperatur stimmt nicht, Anlauf beim Eingießen (Becher nicht ganz vorgewärmt), Lage des Thermometers, ungleiche Becher. Prüfende Messungen: Becher mit Deckel, Raumtemperatur neben den Bechern, gleiche Unterlage, Messreihe in der Ansicht „ln“ (Vertiefung). Der Unterschied zwischen Becher 1 und 2 passt oft besser als die Einzelwerte.","aufl_start":"Tasse 1, 3,85 K (34,05 gegen 30,19 °C). Erhalten bleibt die Energie von Kaffee, Milch und Raum zusammen; jede Tasse gibt Wärme an den Raum ab. Tasse 2 war fast bis zur Zugabe{bis} heißer als Tasse 1 und hat deshalb mehr Wärme abgegeben: <math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> = 3,69 kJ; 3,69 kJ geteilt durch 957,7 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">J<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/ _noch_nicht":"Noch keine Rechenwerte","rw_satz_1":"Tasse 1 wärmer","rw_satz_2":"Tasse 2 wärmer","rw_satz_gleich":"gleich warm","rw_schnitt":"Schnitt der Temperaturkurven","rw_schnitt_kein":"kein Schnitt bis zur Zugabe","rw_schnitt_spaeter":"sichtbar nach eurer Vorhersage zu Frage 1","rw_schnitt_wert":"nach {t} min","rw_tasse1":"Tasse 1 <math><mrow><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>","rw_tasse2":"Tasse 2 <math><mrow><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>","rw_unterschied":"Unterschied <math><mrow><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>","rw_unterschied_b3":"Unterschied Tasse 1 und Becher 3","rw_vorgewaermt":"(Becher vorgewärmt)","rw_vorhersage":"Eure Vorhersage","schalter_becher":"Wärmekapazität des Bechers berücksichtigen (Keramik)","schalter_kalt":"Becher beim Eingießen kalt (Raumtemperatur)","schalter_milch2Raum":"Milch für Tasse 2 bei Raumtemperatur","schalter_trinkzeit":"Trinkzeit bis 60 °C zeigen","soll_f1":"etwa 56 min","soll_start":"3,85 K (Standardwerte)","soll_v1":"47,0 °C","soll_v2":"etwa 100 min","speicher_aus":"Werte werden nicht gespeichert (Speicher im Browser gesperrt)","speicher_ok":"Werte bleiben nur in diesem Browser","sprache_knopf":"<b>DE<\/b> ↔ EN","sprache_knopf_aria":"DE ↔ EN: Sprache wechseln, jetzt Deutsch","sprung_inhalt":"Zum Inhalt springen","start_ausgangslage":"Standardwerte","start_k_label":"Unterschied etwa","start_opt_1":"Tasse 1 (Milch sofort)","start_opt_2":"Tasse 2 (Milch später)","start_opt_gleich":"beide gleich warm","start_text":"Beide Tassen stehen 60 min, die Milch kommt aus dem Kühlschrank. Dein Mitbewohner meint: „Ob man die Milch sofort oder später hineingießt, ist egal. Die Energie bleibt ja erhalten.“ Welche Tasse ist nach 60 min wärmer, und um etwa wie viel? Notiere zuerst für dich, dann einigt euch.","start_titel":"Erst vorhersagen","status_ansage":"Tasse 1 {a} °C, Tasse 2 {b} °C, Unterschied {d} K.","status_aufgedeckt":"Ohne Vorhersage aufgedeckt.","status_festgehalten":"Vorhersage festgehalten, Kurven und Rechenwerte sind sichtbar.","tasse_n":"Tasse {n}","text_annahmen":"<p>Wie auf dem Aufgabenblatt (in du-Form ohne inhaltliche Änderung):<\/p>\n<ul>\n<li>Der Tasseninhalt ist ideal durchmischt, die Milch mischt sich sofort und ohne Wärmeverlust.<\/li>\n<li>Die Wärmekapazität der Tasse wird vernachlässigt, außer wenn du den Becher einschaltest (Teil g): Dann ist der Becher immer so warm wie sein Inhalt, auch beim Zugießen.<\/li>\n<li>Die gesamte Wärmeabgabe (auch durch Strahlung und Verdunstung) ist <math><mrow><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mi mathvariant=\"normal\">ab<\/mi><\/msub><mo>=<\/mo><mi>k<\/mi><mi>A<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><mi>ϑ<\/mi><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math> mit konstantem <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>;<\/span> die verdunstete Masse wird vernachlässigt.<\/li>\n<li>Kaffee (Stoffdaten von Wasser) und Milch sind inkompressibel (<span class=\"nb\"><math><mrow><msub><mi>c<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><msub><mi>c<\/mi><mi>v<\/mi><\/msub><\/mrow><\/math>)<\/span>, die Stoffdaten konstant.<\/li>\n<\/ul>\n<p>Zusätzlich in der Simulation:<\/p>\n<ul>\n<li><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> gilt für beide Tassen; „<math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> von Tasse 1 relativ“ ändert das nur für Tasse 1. Festgehalten bleibt <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> gleich, wenn du Mengen oder Temperaturen änderst (die Füllhöhe ändert <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> hier nicht); aus der Messung wird es jedes Mal neu bestimmt.<\/li>\n<li>Voreinstellungen mit Stern sind Richtwerte, geschätzt, nicht gemessen; belegt sind „Keramik offen“ (Arbeitswert der Aufgabe, passt zu <math><mrow><mi>τ<\/mi><\/mrow><\/math> ≈ 41 min bei Ferreira 2025a) und „Keramik mit Deckel“ (Faktor 0,56 aus einem Becher mit Styropordeckel, Ferreira 2025a).<\/li>\n<li>Für die Übernahme gelten die Becher vor der Milch als schwarzer Kaffee mit gleichem Startwert und gleichem <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> (Mittel der Messwerte).<\/li>\n<li>Ideale Durchmischung und „Becher so warm wie der Inhalt“ sind bewusst vereinfachende Annahmen; die kleine Biot-Zahl der Keramikwand (etwa 0,035) spricht dafür, beweist sie aber nicht allein.<\/li>\n<\/ul>","text_code":"<p>Die Seite ist eine einzige Datei. Die Rechnung steht in zwei gekennzeichneten Blöcken: <code>MODELL<\/code> enthält dieselben Gleichungen und Standardwerte wie das Rechenskript <code>kaffee_modell.py<\/code> der Lösung (Funktionen <code>rechne<\/code> und <code>zwei_tassen<\/code>), <code>ERWEITERUNG<\/code> die Erweiterungen (Ausgleichsgerade, Energie, <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> festhalten und die gewählten Zusätze). Für jede Einstellung rechnet der Code die Kurven geschlossen aus; nur die Zeichnung tastet sie in 241 Punkten ab. Geprüft wird mit automatischen Tests: 10 000 Zufallssätze gegen <code>kaffee_modell.py<\/code>, die Erweiterungen gegen eine eigene Rechnung, Bedienung im Browser bei 360 bis 1920 px, beide Sprachen. Stand {stand}, Version {version}. Du kannst den Code mit „Quelltext anzeigen“ im Browser lesen.<\/p>","text_lesen":"<ul>\n<li><strong>Braune durchgezogene Linie:<\/strong> Tasse 1. Die Milch kommt bei <math><mrow><mi>t<\/mi><\/mrow><\/math> = 0 hinein; der kurze gepunktete Strich bei <math><mrow><mi>t<\/mi><\/mrow><\/math> = 0 ist der Mischsprung von 80 auf 70,47 °C (bei Standardwerten).<\/li>\n<li><strong>Schwarze gestrichelte Linie:<\/strong> Tasse 2, schwarzer Kaffee bis zur Zugabe der Milch; der gepunktete Strich am Ende ist der Mischsprung beim Zugießen.<\/li>\n<li><strong>Kreis:<\/strong> {kreis}<\/li>\n<li><strong>Graue gepunktete Linie:<\/strong> Raumtemperatur. Beide Kurven nähern sich ihr.<\/li>\n<li><strong>Formen:<\/strong> deine Messwerte (Kreis Becher 1, Quadrat Becher 2, Dreieck Becher 3).<\/li>\n<li><strong>Beschrifteter Kasten:<\/strong> eure festgehaltene Vorhersage. <strong>Blasse Kurven:<\/strong> der gemerkte Vergleichslauf.<\/li>\n<li><strong>Rechenwerte:<\/strong> Temperaturen direkt nach der Zugabe in Tasse 2. Der Unterschied ist <span class=\"nb\"><math><mrow><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>;<\/span> positiv heißt: Tasse 1 ist wärmer. <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> steht mit seiner Herkunft da (aus der Messung, festgehalten, Voreinstellung, Ausgleichsgerade).<\/li>\n<li><strong>Energie bis zur Zugabe:<\/strong> Wärme, die jede Tasse bis zur Zugabe abgegeben hat (Teil e). Bei gleicher Milch ist <math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> geteilt durch <math><mrow><mi>m<\/mi><mspace width=\"0.167em\"/><msub><mi>c<\/mi><mi>p<\/mi><\/msub><\/mrow><\/math> des Gemischs (mit Becher zuzüglich <span class=\"nb\"><math><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><msub><mi>c<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><\/mrow><\/math>)<\/span> genau der Unterschied; bei verschieden warmer Milch kommt der Milchbeitrag dazu.<\/li>\n<li><strong>Ansicht „Wärmestrom“ (Vertiefung):<\/strong> <math><mrow><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mi mathvariant=\"normal\">ab<\/mi><\/msub><\/mrow><\/math> beider Tassen über der Zeit. Die Fläche zwischen den Kurven ist eine Energie: {strom}<\/li>\n<li><strong>Ansicht „Messwerte linear (ln)“ (Vertiefung):<\/strong> <math><mrow><mi>ln<\/mi><mo>&#x2061;<\/mo><mfrac><mrow><mi>ϑ<\/mi><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><mrow><msub><mi>ϑ<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math> über <math><mrow><mi>t<\/mi><\/mrow><\/math> für die Becher vor der Milch. Bei konstantem <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> liegen die Punkte auf einer Geraden durch den Ursprung mit der Steigung <math><mrow><mo>−<\/mo><mi>k<\/mi><mi>A<\/mi><mo>/<\/mo><mo>(<\/mo><mi>m<\/mi><mspace width=\"0.167em\"/><msub><mi>c<\/mi><mi>p<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math> des schwarzen Kaffees (mit Becher zuzüglich <span class=\"nb\"><math><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><msub><mi>c<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><\/mrow><\/math>)<\/span>. Ein Muster in den Abständen zur Geraden zeigt, dass <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> oder die Messbedingungen nicht konstant waren; welche Ursache, sagt die Gerade allein nicht.<\/li>\n<li><strong>Rundung:<\/strong> Temperaturen auf 0,01 K, Wärmen auf 0,01 kJ.<\/li>\n<\/ul>","text_macht":"<ol>\n<li>Sie nimmt <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> der Tasse: festgehalten (Standard 0,3402 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">W<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> aus der Messung der Aufgabe, Voreinstellung oder eigener Wert) oder aus Anfangstemperatur und Messung nach 10 min (Teil c, mit Becher Teil g).<\/li>\n<li>Tasse 1: Sie mischt Kaffee und Milch bei <math><mrow><mi>t<\/mi><\/mrow><\/math> = 0 (Teil a) und lässt das Gemisch bis zur Zugabe abkühlen (Teil b und d).<\/li>\n<li>Tasse 2: Sie lässt den schwarzen Kaffee bis zur Zugabe abkühlen und mischt dann die Milch hinein.<\/li>\n<li>Sie vergleicht beide Tassen direkt nach der Zugabe, berechnet die abgegebene Wärme aus der Energiebilanz (Teil e) und den Schnittpunkt der Kurven.<\/li>\n<li>Sie zeichnet deine Messwerte ein; auf Wunsch übernimmt sie Starttemperatur und Messwert nach 10 min aus den Messungen oder bestimmt <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> aus allen Punkten vor der Milch.<\/li>\n<\/ol>\n<p>Sie rechnet nicht: Verdunstung als eigenen Vorgang (das ist deine Hausaufgabe), Temperaturunterschiede in der Tasse, eine Wärmeabgabe, die stärker als linear wächst. Alle Zahlen entstehen in deinem Browser; die Seite sendet nichts.<\/p>","text_probier":"<p><strong>Probier es aus: erst vorhersagen, dann prüfen.<\/strong> Bearbeitet die Fragen zu zweit. Notiere zuerst für dich, was passiert, dann einigt euch und haltet eure Vorhersage im Feld fest. Erst dann prüft ihr im Diagramm. Die Auflösung erscheint in der Karte, sobald eure Vorhersage festgehalten ist.<\/p>","text_problem":"<p>Sonntagmorgen in der WG-Küche: Du hast Filterkaffee gekocht und zwei gleiche Tassen mit je 200 ml gefüllt. Da klingelt das Telefon, das Gespräch wird eine Stunde dauern. Dein Mitbewohner gießt seine Milch sofort in den Kaffee (Tasse 1). Du stellst deine Tasse daneben und willst die Milch erst nach dem Telefonat hineingießen (Tasse 2), damit der Kaffee „länger heiß bleibt“. Die Milch kommt in beiden Fällen direkt aus dem Kühlschrank.<\/p>\n<p>Dein Mitbewohner meint: „Ob man die Milch sofort oder später hineingießt, ist egal. Die Energie bleibt ja erhalten.“ Welche Tasse ist nach einer Stunde wärmer?<\/p>\n<p>Beide Tassen geben über ihre Oberfläche Wärme an den Raum ab, und zwar umso mehr, je wärmer der Inhalt als der Raum ist. Die Simulation rechnet den Vorgang mit der instationären globalen Energiebilanz aus Tutorium 5; in der Vertiefung kannst du Mengen, Temperaturen, Tasse und Becher verändern.<\/p>","text_rechenweg":"<p><strong>Bilanz.<\/strong> Bilanzraum ist der Inhalt einer Tasse (mit Becher: Inhalt und Becher). Aus der allgemeinen Energiebilanz (Foliensatz 05, Folie 8) bleiben ohne Stoffströme und ohne Arbeit nur die Änderung der inneren Energie und der Wärmestrom an die Umgebung:<\/p>\n<span class=\"formel\"><math display=\"block\"><mrow><mi>C<\/mi><mspace width=\"0.167em\"/><mfrac><mrow><mi mathvariant=\"normal\">d<\/mi><mi>T<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">d<\/mi><mi>t<\/mi><\/mrow><\/mfrac><mo>=<\/mo><mo>−<\/mo><mi>k<\/mi><mi>A<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><mi>T<\/mi><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math><\/span>\n<p>mit <math><mrow><mi>C<\/mi><mo>=<\/mo><mi>m<\/mi><mspace width=\"0.167em\"/><msub><mi>c<\/mi><mi>p<\/mi><\/msub><\/mrow><\/math> des Inhalts (mit Becher zuzüglich <span class=\"nb\"><math><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><msub><mi>c<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><\/mrow><\/math>)<\/span>. Trennung der Variablen mit <math><mrow><mi>T<\/mi><mo>(<\/mo><mi>t<\/mi><mo>=<\/mo><mn>0<\/mn><mspace width=\"0.167em\"/><mi mathvariant=\"normal\">s<\/mi><mo>)<\/mo><mo>=<\/mo><msub><mi>T<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> ergibt<\/p>\n<span class=\"formel\"><math display=\"block\"><mrow><mi>T<\/mi><mo>(<\/mo><mi>t<\/mi><mo>)<\/mo><mo>=<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>+<\/mo><mo>(<\/mo><msub><mi>T<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><mi>exp<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mo>−<\/mo><mfrac><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><mrow><mi>C<\/mi><\/mrow><\/mfrac><mspace width=\"0.167em\"/><mi>t<\/mi><mo>)<\/mo><mo>,<\/mo><mspace width=\"2em\"/><mi>τ<\/mi><mo>=<\/mo><mfrac><mrow><mi>C<\/mi><\/mrow><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/mfrac><mo>.<\/mo><\/mrow><\/math><\/span>\n<p><strong>kA aus der Messung.<\/strong> <math><mrow><mi>k<\/mi><mi>A<\/mi><mo>=<\/mo><mo>−<\/mo><mfrac><mrow><mi>C<\/mi><\/mrow><mrow><msub><mi>t<\/mi><mi mathvariant=\"normal\">mess<\/mi><\/msub><\/mrow><\/mfrac><mi>ln<\/mi><mo>&#x2061;<\/mo><mfrac><mrow><msub><mi>T<\/mi><mi mathvariant=\"normal\">mess<\/mi><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><mrow><msub><mi>T<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math> (Teil c).<\/p>\n<p><strong>Mischen.<\/strong> <math><mrow><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">misch<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">K<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/msub><mspace width=\"0.167em\"/><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">K<\/mi><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">M<\/mi><\/mrow><\/msub><mspace width=\"0.167em\"/><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><\/mrow><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">K<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">M<\/mi><\/mrow><\/msub><\/mrow><\/mfrac><\/mrow><\/math> (Teil a; mit Becher dessen Wärmekapazität bei der Tasse dazu).<\/p>\n<p><strong>Abgegebene Wärme.<\/strong> <math><mrow><mi>Q<\/mi><mo>=<\/mo><mi>C<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">Anfang<\/mi><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">Ende<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math> für jeden Bilanzraum (Teil e); daraus direkt nach der Zugabe <span class=\"formel\"><math display=\"block\"><mrow><msub><mi>C<\/mi><mi mathvariant=\"normal\">G<\/mi><\/msub><mo>(<\/mo><msub><mi>ϑ<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mn>2<\/mn><\/msub><mo>)<\/mo><mo>=<\/mo><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">M<\/mi><\/mrow><\/msub><mo>(<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">M1<\/mi><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">M2<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math><\/span> mit <math><mrow><msub><mi>C<\/mi><mi mathvariant=\"normal\">G<\/mi><\/msub><mo>=<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">K<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><msub><mi>c<\/mi><mrow><mi>p<\/mi><mo>,<\/mo><mi mathvariant=\"normal\">M<\/mi><\/mrow><\/msub><\/mrow><\/math> (Kaffee und Milch); mit Becher steht <math><mrow><msub><mi>C<\/mi><mi mathvariant=\"normal\">GB<\/mi><\/msub><mo>=<\/mo><msub><mi>C<\/mi><mi mathvariant=\"normal\">G<\/mi><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><msub><mi>c<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><\/mrow><\/math> an Stelle von <span class=\"nb\"><math><mrow><msub><mi>C<\/mi><mi mathvariant=\"normal\">G<\/mi><\/msub><\/mrow><\/math>.<\/span> Bei gleicher Milch fällt der letzte Teil weg.<\/p>\n{zugabe}\n<p><strong>kA aus allen Messpunkten<\/strong> (Vertiefung): Ausgleichsgerade durch den Ursprung in der Ansicht „ln“, Steigung <math><mrow><mi>b<\/mi><mo>=<\/mo><mo>∑<\/mo><msub><mi>t<\/mi><mi>i<\/mi><\/msub><msub><mi>y<\/mi><mi>i<\/mi><\/msub><mo>/<\/mo><mo>∑<\/mo><msubsup><mi>t<\/mi><mi>i<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math> mit <span class=\"nb\"><math><mrow><msub><mi>y<\/mi><mi>i<\/mi><\/msub><mo>=<\/mo><mi>ln<\/mi><mo>&#x2061;<\/mo><mfrac><mrow><msub><mi>ϑ<\/mi><mi>i<\/mi><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><mrow><msub><mi>ϑ<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math>,<\/span> dann <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><mo>=<\/mo><mo>−<\/mo><mi>C<\/mi><mspace width=\"0.167em\"/><mi>b<\/mi><\/mrow><\/math>.<\/span> Die Streuung der Geraden ist keine Messunsicherheit von <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>,<\/span> weil alle Punkte denselben Startwert enthalten.<\/p>\n<p><strong>kA festhalten<\/strong> (Vertiefung): Das Werkzeug gibt dem Modell den gleichwertigen Wert nach 10 min (keine Messung), der zu diesem <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> gehört, und rechnet sonst unverändert.<\/p>","text_regler_einleitung":"<p>Standardwerte sind die Werte der Aufgabe. Fest sind die Stoffwerte: Kaffee 1000 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kg<\/mi><\/mrow><mrow><msup><mi mathvariant=\"normal\">m<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> und 4,18 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kJ<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">kg<\/mi><mo>·<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> (Stoffwerte von Wasser), Milch 1030 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kg<\/mi><\/mrow><mrow><msup><mi mathvariant=\"normal\">m<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> und 3,94 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kJ<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">kg<\/mi><mo>·<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> (aus der Lösung: Goff; Tutorium 8), Becher 0,85 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">kJ<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">kg<\/mi><mo>·<\/mo><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> (Teil g, Arbeitswert). Indizes: K Kaffee, M Milch, u Umgebung, G Gemisch, B Becher, Z Zugabe, ab abgegeben, mess Messung, misch Mischung.<\/p>","thmess_eigen":"Messwert {wert} °C wieder verwenden","thmess_ersatz":"Dieser Wert ist aus dem bisherigen <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> berechnet, er ist keine Messung. Trag deinen Messwert ein, dann gilt er.","titel_seite":"Kaffee mit Milch: Simulation","trink_nach":"nach {t} min","trink_nie":"nie (Raum zu warm)","trink_sofort":"schon beim Eingießen","trinkzeit_text":"Trinktemperatur 60 °C: Tasse 1 {a}, schwarzer Kaffee {b}.","v1_eingabe":"Milchtemperatur etwa","v1_text":"Notiere zuerst für dich, dann einigt euch zu zweit: Wie warm müsste die Milch sein, damit beide Tassen nach 60 min ungefähr gleich warm sind? Notiert für euch: Hängt diese Temperatur vom Zeitpunkt der Zugabe ab?","v1_titel":"Milchtemperatur","v2_eingabe":"Zeitpunkt etwa","v2_text":"Notiere zuerst für dich, dann einigt euch zu zweit: Mit Deckel kühlen beide Tassen langsamer ab. Wird der größte mögliche Unterschied größer, kleiner oder bleibt er gleich? Wann tritt er ein? Wähle bei <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> „Keramik mit Deckel“ und suche wie in Frage 1 den Zeitpunkt mit dem größten Unterschied.","v2_titel":"Deckel","v3_ausgangslage":"Standardwerte, Becher an, <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> aus der Messung nach 10 min (wie Teil g)","v3_text":"Notiere zuerst für dich, dann einigt euch zu zweit: Die Tassen sind vorgewärmte Keramikbecher wie in Teil g. Wird der Unterschied größer oder kleiner? Notiert für euch: Bleibt Tasse 1 wärmer?","v3_titel":"Becher","v4_opt_falsch":"falsches <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> beider Becher","v4_opt_ungleich":"ungleiches <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> der Becher","v4_text":"Notiere zuerst für dich, dann einigt euch zu zweit: Becher 1 hat 5 % mehr <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> als Becher 2 (andere Unterlage); oder <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> beider Becher ist um 10 % falsch bestimmt. Was verfälscht den Unterschied mehr? Prüft mit „<math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> von Tasse 1 relativ“ (105 %) und mit dem Regler <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> (±10 %).","v4_titel":"Versuchsplan","v5_text":"Notiere zuerst für dich, dann einigt euch zu zweit: Welcher Becher hält den Kaffee am längsten warm? Notiert für euch: Ändert sich damit der größte mögliche Unterschied zwischen den Tassen? Probiere die Voreinstellungen bei <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> aus.","v5_titel":"Welcher Becher?","v_einleitung":"Für Schnelle, zum Nachbereiten und zum Selbstlernen. Jede Frage wieder mit Vorhersage; „Prüfen“ stellt ihre Ausgangslage ein.","v_opt_gleich":"bleibt gleich","v_opt_groesser":"größer","v_opt_kleiner":"kleiner","vergleich_text":"Blass: gemerkter Vergleichslauf (Zugabe nach {t} min): Tasse 1 {a} °C, Tasse 2 {b} °C, Unterschied {d} K.","vergleich_zahl":"Eure Zahl: {ist} · Modell: {soll}","vertiefung_frueh":"Die Vertiefung ist für danach gedacht. Erst Frage 1 und 2.","vor_edelstahl":"Edelstahl einwandig offen","vor_glas":"Glas offen","vor_kein_thermo_deckel":"Thermobecher mit Deckel ist nicht dabei: Es gibt dafür keinen belastbaren Messwert.","vor_keramik":"Keramik offen","vor_keramik_deckel":"Keramik mit Deckel","vor_pappe":"Pappbecher offen","vor_text_edelstahl":"Blankes Metall strahlt weniger Wärme ab; die offene Oberfläche bleibt.","vor_text_glas":"Glas gibt etwa so viel Wärme ab wie Keramik.","vor_text_keramik":"Becher der Aufgabe: 200 ml kühlen in 10 min von 80 auf 67 °C.","vor_text_keramik_deckel":"Ein Deckel bremst Verdunstung und Luftbewegung an der Oberfläche: <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> wird 44 % kleiner.","vor_text_pappe":"Die dünne Wand bremst kaum; Pappe strahlt ähnlich ab wie Keramik.","vor_text_thermo_offen":"Die Vakuumwand hält fast alles; Wärme geht vor allem über die offene Oberfläche.","vor_thermo_offen":"Thermobecher offen","werte_tabelle":"Werte als Tabelle","werte_tabelle_kopf_1":"Tasse 1 [°C]","werte_tabelle_kopf_2":"Tasse 2 [°C]","werte_tabelle_kopf_t":"<math><mrow><mi>t<\/mi><\/mrow><\/math> [min]","zurueckgesetzt":"Zurückgesetzt."},"en":{"abbrechen":"Cancel","anheften_an":"Pin diagram at the top","anheften_aus":"Unpin diagram","ansicht_aria":"View of the diagram","ansicht_ln":"Measured values, linearised (ln)","ansicht_temperatur":"Temperature","ansicht_waermestrom":"Heat flow rate","aufl_f1":"At about 56 min (3.86 K; the display shows 3.86 K from 53 to 59 min), exactly at the intersection of the curves. As long as the black coffee is warmer than cup 1, it releases more heat and the difference grows; afterwards it releases less. The difference does not go to zero: the limit is 1.91 K (20 °C versus 18.09 °C), because the cold milk cools cup 2 again when it is mixed in. In going further, look at the area between the curves in the “Heat flow rate” view.","aufl_f2":"This depends on your measurement. Often, with an open mug and <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> from the first 10 min, later points lie above the curves. Possible causes: the heat loss grows faster than linearly with <math><mrow><mi>ϑ<\/mi><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/math> (evaporation, free convection), the room temperature is not right, a start-up effect when pouring (mug not fully preheated), the position of the thermometer, mugs that are not the same. Measurements to test this: a mug with a lid, the room temperature measured next to the mugs, the same surface under each mug, the measurement series in the “ln” view (going further). The difference between mug 1 and mug 2 often fits better than the individual values.","aufl_start":"Cup 1, 3.85 K (34.05 versus 30.19 °C). What is conserved is the energy of coffee, milk and room together; each cup releases heat to the room. Cup 2 was hotter than cup 1 almost until the milk was added{bis} and therefore released more heat: <math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> = 3.69 kJ; 3.69 kJ divided by 957.7 <math><mrow><mfrac><mrow><mi mathvariant=\"normal\">J<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">K<\/mi><\/mrow><\/mfrac><\/mrow><\/math> (coffee and milk) gives 3.85 K.","aufl_start_bis":"(until about 56 min)","aufl_v1":"47.0 °C; 60.9 °C when the milk is added after 30 min, 37.3 °C after 90 min. Yes, the temperature depends on the time: at 47.0 °C, the warmer milk just makes up for the extra heat loss of cup 2. The later the milk is added, the colder cup 2 is beforehand and the less warm the milk has to be.","aufl_v2":"The same (3.86 K), but later: when the milk is added after about 100 min instead of 56 min (display 3.86 K from 94 to 106 min). After 60 min the difference with a lid is smaller (3.51 K). Reason: <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> appears only in the product <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><mspace width=\"0.167em\"/><mi>t<\/mi><\/mrow><\/math>;<\/span> the lid stretches the time axis. This holds when both cups have the same <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>.<\/span>","aufl_v3":"Smaller: 3.08 instead of 3.85 K; the heat released increases (46.60 and 50.34 kJ instead of 34.88 and 38.57 kJ) because the mug cools down too; cup 1 stays warmer.","aufl_v4":"Different <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>:<\/span> the difference drops from 3.85 to 2.98 K. A wrong <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> of both mugs changes it by at most 0.04 K. Identical mugs and conditions matter more than an exact <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>.<\/span>","aufl_v5":"The open vacuum mug keeps it warm the longest (estimate: from 80 to 63.5 °C in 30 min, compared with 48.8 °C for the open ceramic mug), followed by ceramic with a lid. The largest difference stays 3.86 K; it only comes later (open vacuum mug after about 127 min). According to the estimates (*), glass and paper are roughly like ceramic: the wall is not the main resistance; what matters is the open surface and the radiation.","auftrag_erklaeren":"Does your prediction match? Explain to each other why.","auftrag_start":"Explain the difference using <math><mrow><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> and <span class=\"nb\"><math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>.<\/spa fter the milk","csv_t":"t [min]","csv_tasse1":"Model cup 1 [°C]","csv_tasse2":"Model cup 2, black until the milk [°C]","dia_achse_ln_txt":"ln((*ϑ* − *ϑ*_u)/(*ϑ*_0 − *ϑ*_u))","dia_achse_q_txt":"Heat flow rate *Q̇*_ab [W]","dia_achse_t_txt":"Time *t* [min]","dia_achse_th_txt":"Temperature *ϑ* [°C]","dia_becher_n":"mug {n}","dia_beschreibung":"Cup 1: after mixing {m} °C, after {t} min {b} °C. Cup 2: black coffee from {a} to {k} °C, after the milk {c} °C. Difference {d} K.","dia_beschreibung_b3":"Mug 3 after the milk {c} °C.","dia_beschreibung_ln":"{n} measured points of the mugs without milk, with fitted line.","dia_beschreibung_start":"Axes without curves: the curves appear after your prediction.","dia_beschreibung_waermestrom":"Up to the intersection of the heat flow rates: {a} ({v} kJ); afterwards: {b} ({n} kJ); together {d} kJ.","dia_legende_mess":"Measured points: {liste}","dia_raum":"Room {th} °C","dia_schnitt":"intersection","dia_tasse1":"Cup 1: milk right away","dia_tasse2":"Cup 2: milk after {t} min","dia_titel":"Temperature of both cups over time","dia_titel_ln":"Measured values, linearised (ln), with fitted line","dia_titel_waermestrom":"Heat flow rate of both cups","dia_trinklinie":"drinking temperature 60 °C","dia_ungueltig":"No calculation: settings not valid","dia_vergleich":"faint: stored run","dia_vorhersage":"Your prediction: {text}","einheit_wk":"W/K","energie_aria":"Heat released up to adding the milk: cup 1 {q1} kJ, cup 2 {q2} kJ.","energie_satz":"<math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> = {dq} kJ corresponds to a difference of {dt} K.","energie_satz_milch":"<math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> = {dq} kJ, plus a milk contribution of {m} kJ, together {s} kJ: corresponds to a difference of {dt} K.","energie_titel":"Energy up to adding the milk: heat released to the room","ergebnis_verdeckt":"appears after y ts when you check.","f2_titel":"Experiment","f2_ueberspringen":"Skip question 2 (experiment did not take place)","f2_uebersprungen":"Question 2 skipped: there are no measured values.","f2_werte_da":"Class data loaded: {n} measured values.","fehler_anfang_ueber_raum":"The initial coffee temperature must be above the room temperature.","fehler_kA_positiv":"<math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> must be greater than zero.","fehler_messung_zwischen":"The measured value after 10 min must lie between the room temperature and the initial coffee temperature.","feld_aria":"{name} as a number","feld_bereich":"Please enter a value from {min} to {max} {einheit}.","feld_keine_zahl":"Please enter a number, for example {beispiel}.","feld_tausender":"Please enter the number without a thousands separator.","fertig_pflicht":"Done. Key point: whatever is hotter releases more heat; so add the milk straight away. What is conserved is the energy of the cups and the room together. Continue with going further.","flaeche_gesamt":"Up to adding the milk, cup 2 releases {wert} kJ more heat in total than cup 1.","flaeche_gesamt_weniger":"Up to adding the milk, cup 2 releases {wert} kJ less heat in total than cup 1.","flaeche_mehr":"cup 2 releases more","flaeche_ort_nach":"after the heat flow rates intersect","flaeche_ort_vor":"before the heat flow rates intersect","flaeche_summe":"<math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> = {wert} kJ (sum of both areas)","flaeche_weniger":"cup 2 releases less","frage_ausblenden":"Hide question","frage_zeigen":"Show question","fuss_quelle":"Belongs to: Tutorial 5, “Coffee with milk” (problem sheet and solution of the tutorial).","fuss_stand":"As of {stand} · version {version} · built according to KONZEPT.md version 2","g_aufgabe":"problem","g_becher":"part g, working value","g_kA":"kept fixed: problem (part c) and presets; from the measurement: part c","g_kA1":"discussion in part c em loaded.","knopf_vergleich":"Store run for comparison","knopf_vergleich_weg":"Remove comparison","knopf_versuch":"As in the experiment (60 min, mug)","knopf_versuch_info":"Starting point as in the experiment: milk added after 60 min, mug included.","knopf_vertiefung_oeffnen":"Open going further","knopf_vorhersage":"Lock in your prediction, then check","knopf_vorhersage_start":"Lock in your prediction and show the curves","knopf_weiter":"Next","knopf_zur_karte":"Work on this question","knopf_zurueck":"Back","kopf_titel":"Coffee with milk: simulation","kopf_zeile":"Tutorial 5 · Heat balances, transient lumped","leiste_frage":"Question {n} of 2","leiste_start":"Start","leiste_vertiefung":"Going further","lesehinweis":"The brown line is cup 1 (milk right away), the black dashed line is cup 2 (milk later); the short dotted lines are the mixing jumps when the milk is poured in, the grey dotted line is the room temperature.","lesehinweis_ln":"With a constant <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>,<\/span> the points lie on a straight line through the origin with the slope <math><mrow><mo>−<\/mo><mi>k<\/mi><mi>A<\/mi><mo>/<\/mo><mo>(<\/mo><mi>m<\/mi><mspace width=\"0.167em\"/><msub><mi>c<\/mi><mi>p<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math> of the black coffee (with the mug, plus <span class=\"nb\"><math><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><msub><mi>c<\/mi><mi mathvariant=\"normal\">B<\/mi><\/msub><\/mrow><\/math>)<\/span> (solid line; dashed: with a free intercept).","lesehinweis_waermestrom":"<math><mrow><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mi mathvariant=\"normal\">ab<\/mi><\/msub><\/mrow><\/math> of both cups over time. The area between the curves is an energy: {strom}","lesen_kreis_frei":"intersection of the two curves. To the left of it, the black coffee is warmer than cup 1 and releases more heat; to the right, less (with the same <math><mrow><mi>k<\/mi><
