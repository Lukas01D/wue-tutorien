/* Kaffee-Simulation Fassung 3. Optik von Entwurf A „Messprotokoll“ (Papier, Tinte, Tintenblau, IBM Plex), dazu je Element das
   Beste aus A, B, C und Variante 0 (simulation/KONZEPT_F3.md, Anhang A; Entscheidung der TL D10). Kontraste (WCAG-Formel, gegen
   die Karte #fffdf8): Text 16,3; leiser Text 7,4; Akzent 8,0; Weiß auf Akzent 8,1; Tasse 1 6,7; Raumlinie 4,8. */
:root {
  --papier: #f6f3ea; --karte: #fffdf8; --tinte: #1c1f24; --leise: #4f5560; --linie: #8f887a; --linie-fein: #d8d1c0;
  --blau: #1d4f91; --blau-tief: #163d70; --blau-hell: #e7eef8; --feld: #fbf8f0; --rot: #a3261b;
  --k1: #8a4a17; --k1-text: #7a3f12; --k2: #1c1f24; --raum: #767164; --gitter: #e4ddcc; --gitter-haupt: #cfc7b4;
  --schrift: "Plex Sans", "Plex Math", system-ui, sans-serif;
  --zahl: "Plex Mono", "Plex Sans", "Plex Math", ui-monospace, monospace;
  --formel: "Plex Math", "Plex Sans", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--papier); color: var(--tinte); font-family: var(--schrift); line-height: 1.5; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--papier); font-size: 1rem; }
@media (min-width: 1024px) { body { font-size: 1.0625rem; } }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; font-weight: 600; }
h3 { font-size: 1.02rem; margin-top: .9em; }
p { margin: 0 0 .7em; }
a { color: var(--blau); }
b, strong { font-weight: 600; }
math { font-family: var(--formel); font-size: 1.05em; }
.formel { display: block; overflow-x: auto; overflow-y: hidden; padding: 2px 0; margin: 4px 0 10px; }
.nb { white-space: nowrap; }
.leise { color: var(--leise); }
.klein { font-size: .875rem; }
.nur-leser { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.sprung { position: absolute; left: 8px; top: -60px; padding: 12px 16px; background: var(--blau); color: #fff; font-weight: 600; text-decoration: none; z-index: 10; }
.sprung:focus { top: 8px; }
.banner { margin: 0; padding: 12px 16px; background: var(--blau-hell); border-bottom: 2px solid var(--blau); }

/* Kopf wie die Kopfzeile eines Protokollblatts (A) */
.kopf { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 16px; align-items: center; padding: 10px 16px;
        border-bottom: 2px solid var(--tinte); background: var(--karte); }
.kopf-marke { font-family: var(--zahl); font-weight: 600; border: 2px solid var(--tinte); padding: 4px 6px; }
.kopf-zeile { margin: 0; font-family: var(--zahl); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--leise); }
.kopf-titel { margin: 0; font-size: 1.2rem; }
.sprache { min-height: 48px; min-width: 76px; padding: 0 12px; border: 2px solid var(--tinte); background: var(--karte);
           font-family: var(--zahl); font-size: .95rem; color: var(--tinte); cursor: pointer; }
.sprache b { text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 600px) { .kopf { grid-template-columns: 1fr auto; padding: 8px 12px; } .kopf-marke { display: none; } .kopf-titel { font-size: 1.05rem; } }

.seite { max-width: 1400px; margin: 0 auto; padding: 14px 16px 24px; }
.seite:focus { outline: none; }
.zweck { margin: 0 0 12px; max-width: 72ch; }

/* Anordnung: Laptop und Beamer zwei Spalten, rechts die Bühne angeheftet; Handy eine Spalte mit den Reglern unter dem Diagramm */
.raster { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
#s1 { order: 1; } .buehne { order: 2; } #s2 { order: 3; } #s3 { order: 4; } #s4 { order: 5; } #weiter { order: 6; } #modell { order: 7; } .von-vorn { order: 8; }
@media (min-width: 1024px) {
  .raster { grid-template-columns: minmax(360px, 430px) minmax(0, 1fr); align-items: start; }
  .buehne { order: 0; grid-column: 2; grid-row: 1 / span 8; position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow-y: auto; }
  .schritt, .modell, .von-vorn { grid-column: 1; }
}

/* Schritte als nummerierte Protokollabschnitte (A) */
.schritt { background: var(--karte); border: 1.5px solid var(--tinte); padding: 14px 16px; min-width: 0; }
.nr { margin: 0 0 2px; font-family: var(--zahl); font-size: .8rem; letter-spacing: .06em; color: var(--blau); font-weight: 600; text-transform: uppercase; }
.schritt h2 { font-size: 1.25rem; }
.schritt.erledigt { border-color: var(--linie); }
.zusammenfassung { margin: 0; }
.weiter { border-style: dashed; }

/* Auswahl als ganze Zeile mit rundem Marker (B, C), Formularlinien (A) */
fieldset { border: 0; margin: 0 0 12px; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 6px; font-weight: 600; }
.wahl { display: grid; border-top: 1px solid var(--linie-fein); }
.wahl label { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 4px; border-bottom: 1px solid var(--linie-fein); cursor: pointer; }
.wahl input, .haken input { width: 22px; height: 22px; margin: 0; accent-color: var(--blau); flex: none; }
.wahl label:has(input:checked) { background: var(--blau-hell); font-weight: 600; }
.wahl input:disabled + span { color: var(--leise); }
.wahl input:checked:disabled + span { color: var(--tinte); }
.nach-oben { display: inline-flex; align-items: center; min-height: 44px; }
@media (min-width: 1024px) { .nach-oben-zeile { display: none; } }
.haken { display: flex; align-items: flex-start; gap: 12px; min-height: 48px; padding: 10px 0; cursor: pointer; }
.haken input { margin-top: 2px; }
.block-label { display: block; margin: 10px 0 4px; font-weight: 600; }
.feld { min-height: 48px; padding: 6px 10px; font: inherit; font-size: 1rem; font-family: var(--zahl); border: 0; border-bottom: 2px solid var(--tinte); background: var(--feld); color: var(--tinte); border-radius: 0; }
.feld-text { width: 100%; font-family: var(--schrift); }
.feld-zahlen { font-family: var(--zahl); }
textarea.feld { resize: vertical; line-height: 1.4; }
.feld[aria-invalid="true"] { border-bottom-color: var(--rot); }
.zahlen-zeile { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.zahlen-zeile label { display: flex; gap: 8px; align-items: center; }
.zahlen-zeile .feld { width: 6.5em; }
.meldung { margin: 6px 0 0; color: var(--rot); font-size: .9rem; }
.meldung:empty, .info:empty { display: none; }
.info { margin: 4px 0 0; font-size: .85rem; color: var(--leise); font-family: var(--zahl); overflow-wrap: anywhere; }
.info.fehler { color: var(--rot); font-family: var(--schrift); }
.knopf { min-height: 48px; padding: 8px 16px; margin: 4px 0; font: inherit; font-weight: 600; border: 2px solid var(--blau); background: var(--karte); color: var(--blau); cursor: pointer; border-radius: 0; }
.knopf:hover:not(:disabled) { background: var(--blau-hell); }
.knopf-haupt { background: var(--blau); color: #fff; }
.knopf-haupt:hover:not(:disabled) { background: var(--blau-tief); }
.knopf:disabled { border-color: var(--linie); background: #efeadf; color: #5d636d; cursor: not-allowed; }
.knopf:not(:disabled) + .leise.klein[id$="fehlt"] { display: none; }
:focus-visible { outline: 3px solid var(--blau); outline-offset: 2px; }
input[type=radio]:focus-visible, input[type=checkbox]:focus-visible { outline-offset: 3px; }

/* Bühne: Kernzahlen als Messwertzeile (A), groß genug für den Beamer (C) */
.buehne { background: var(--karte); border: 1.5px solid var(--tinte); min-width: 0; }
.kern { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); border-bottom: 1.5px solid var(--tinte); }
.kern:focus { outline: none; }
.kern > div { padding: 6px 12px; border-right: 1px solid var(--linie-fein); min-width: 0; }
.kern > div:last-child { border-right: 0; }
.kern .lab { display: block; font-size: .8rem; color: var(--leise); line-height: 1.25; }
.kern .wert { display: block; font-family: var(--zahl); font-weight: 600; font-size: 1.35rem; line-height: 1.25; white-space: nowrap; }
.kern .zeit { font-family: var(--zahl); font-size: .85rem; color: var(--leise); align-self: center; }
.kern .diff { color: var(--blau); }
@media (min-width: 1024px) { .kern .wert { font-size: 1.7rem; } }
@media (max-width: 480px) { .kern { grid-template-columns: repeat(auto-fit, minmax(6.6em, 1fr)); } .kern .zeit { display: none; } .kern .wert { font-size: 1.12rem; } .kern > div { padding: 5px 8px; border-bottom: 1px solid var(--linie-fein); margin-bottom: -1px; } }
.kernsatz, .auftrag-zeile { margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--linie-fein); background: var(--blau-hell); font-size: .95rem; }
.auftrag-zeile { background: var(--karte); border-left: 4px solid var(--blau); }
.dia-figur { margin: 0; }
.dia { display: block; width: 100%; }
.legende { margin: 0; padding: 0 12px 6px; font-size: .8rem; color: var(--leise); font-family: var(--zahl); }
.annahmen { margin: 0; padding: 6px 12px 8px; font-size: .82rem; color: var(--leise); border-top: 1px solid var(--linie-fein); }

/* Regler: Bedienung von C (großer Griff, Plus und Minus 48 px, Wert daneben), Optik von A (Lineal mit Skalenstrichen) */
.regler-bereich { border-top: 1.5px solid var(--tinte); padding: 6px 12px 4px; }
.regler-paar { display: grid; gap: 0 20px; }
@media (min-width: 1024px) { .regler-paar { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.regler { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; align-content: flex-start; margin: 4px 0 8px; min-width: 0; }
.regler .name { flex: 1 0 100%; font-weight: 600; font-size: .95rem; margin: 0; }
.regler .einheit { font-family: var(--zahl); font-weight: 400; color: var(--leise); }
.pm { flex: 0 0 48px; width: 48px; height: 48px; border: 2px solid var(--tinte); background: var(--karte); font-family: var(--zahl); font-size: 1.4rem; line-height: 1; color: var(--tinte); padding: 0; cursor: pointer; border-radius: 0; }
.pm:hover { background: var(--blau-hell); }
.lineal { position: relative; flex: 1 1 5.5em; min-width: 5.5em; }
.lineal input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 48px; margin: 0; background: transparent; display: block; cursor: pointer; }
.lineal input[type=range]::-webkit-slider-runnable-track { height: 20px;
   background: linear-gradient(var(--tinte), var(--tinte)) bottom / 100% 2px no-repeat,
               repeating-linear-gradient(90deg, var(--tinte) 0 1.5px, transparent 1.5px 10%) bottom / calc(100% + 1.5px) 12px no-repeat,
               repeating-linear-gradient(90deg, var(--linie) 0 1px, transparent 1px 2%) bottom / 100% 6px no-repeat; }
.lineal input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 38px; margin-top: -9px; background: var(--blau); border: 3px solid var(--karte); outline: 2px solid var(--blau); }
.lineal input[type=range]::-moz-range-track { height: 20px; background: linear-gradient(var(--tinte), var(--tinte)) bottom / 100% 2px no-repeat,
               repeating-linear-gradient(90deg, var(--tinte) 0 1.5px, transparent 1.5px 10%) bottom / 100% 12px no-repeat; }
.lineal input[type=range]::-moz-range-thumb { width: 18px; height: 34px; background: var(--blau); border: 3px solid var(--karte); border-radius: 0; outline: 2px solid var(--blau); }
.lineal input[type=range]:focus-visible { outline: 3px solid var(--blau); outline-offset: 2px; }
.skala { position: relative; height: 1.1em; font-family: var(--zahl); font-size: .72rem; color: var(--leise); margin: -4px 11px 0; }
.skala span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.regler .feld { flex: 0 0 5.4em; width: 5.4em; text-align: right; padding: 6px 8px; }
.regler .hinweis { flex: 1 0 100%; margin: 0; padding-left: 56px; font-size: .82rem; color: var(--leise); }
.regler .hinweis:empty { display: none; }
.regler .meldung { flex: 1 0 100%; }
details.gruppe { border-top: 1px solid var(--linie-fein); margin-top: 2px; }
details.gruppe > summary { min-height: 48px; padding: 12px 0; cursor: pointer; font-size: .92rem; color: var(--leise); line-height: 1.5; }
details.gruppe > summary b { color: var(--tinte); }
details.gruppe[open] > summary { color: var(--tinte); }
.vorl { font-family: var(--zahl); font-size: .78rem; border: 1px solid var(--linie); padding: 0 4px; color: var(--leise); white-space: nowrap; }

/* Säulen, Rückmeldung, Aufträge */
.saeulen-titel { margin: 4px 0 0; font-size: .85rem; color: var(--leise); }
.saeulen { display: block; max-width: 100%; height: auto; margin-bottom: 8px; }
.rueck { margin: 10px 0 0; padding: 10px 12px; border-left: 4px solid var(--blau); background: var(--blau-hell); }
.rueck:focus { outline: 3px solid var(--blau); outline-offset: 2px; }
.rueck p:last-child { margin-bottom: 0; }
.auftrag { border-top: 1px solid var(--linie-fein); }
.auftrag > summary { min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 600; padding: 6px 0; }
.auftrag[open] { padding-bottom: 10px; }
.auftrag .zahlen-zeile .feld { width: 7em; }
.modell > summary { min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 600; }
.modell ol, .modell ul { padding-left: 1.3em; margin: 0 0 .7em; }
.von-vorn { padding: 0 2px; }
.fuss { max-width: 1400px; margin: 0 auto; padding: 0 16px 24px; font-size: .8rem; color: var(--leise); }
.fuss p { margin: 0 0 4px; }

/* Diagramm und Säulen (SVG): Farben und Linienarten wie in den Texten (Tasse 1 braun durchgezogen, Tasse 2 schwarz gestrichelt) */
.dia text, .saeulen text { font-family: var(--schrift); }
.dia .ax, .saeulen .zahl { font-family: var(--zahl); fill: var(--leise); }
.saeulen .zahl { fill: var(--tinte); }
.dia .beschr { fill: var(--tinte); }
.leise-text { fill: var(--leise); }
.gitter { stroke: var(--gitter); stroke-width: 1; }
.gitter-haupt { stroke: var(--gitter-haupt); stroke-width: 1; }
.achse { stroke: var(--tinte); stroke-width: 1.5; }
.raum { stroke: var(--raum); stroke-width: 2; stroke-dasharray: 2 4; }
.kurve { fill: none; }
.k1 { stroke: var(--k1); } .k2 { stroke: var(--k2); }
.gestrichelt { stroke-dasharray: 7 4; }
.abfall { stroke-dasharray: 6 4; stroke-linecap: butt; }   /* Abfall durch die Milch, Breite wie die Kurven */
.pfeil.k1 { fill: var(--k1); } .pfeil.k2 { fill: var(--k2); }
.punkt { stroke-width: 1.8; }
.punkt.k1 { fill: var(--k1); } .punkt.k2 { fill: var(--k2); }
.punkt.hohl { fill: none; }
.ende { fill: var(--karte); stroke-width: 2.5; }
.kreuz { fill: var(--blau); font-weight: 600; }
.kbeschr { font-weight: 600; }
.k1-text { fill: var(--k1-text); } .k2-text { fill: var(--k2); }
.saeule1 { fill: var(--k1); }
.saeule2 { fill: url(#schraffur); stroke: var(--k2); stroke-width: 2; }
.schraffur-grund { fill: var(--karte); } .schraffur-linie { stroke: var(--k2); stroke-width: 2.4; }
.bezug { stroke: var(--blau); stroke-width: 1.5; stroke-dasharray: 3 3; }
.klammer { fill: none; stroke: var(--blau); stroke-width: 2.5; }
.diff-text { fill: var(--blau); font-weight: 600; }
@media (max-width: 1023px) { body.z0 .buehne { display: none; } }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

<script>// Kaffee mit Milch: Simulation. Gebaut aus simulation/site/src mit simulation/site/bauen.py (Stand 2026-11-11, Quellen f22c36df98).
// MODELL-ANFANG: gleiche Gleichungen und Standardwerte wie kaffee_modell.py (P, rechne); unverändert aus dem geprüften Block der Fassung 2
const P = { V_K: 200e-6, rho_K: 1000.0, cp_K: 4180.0, V_M: 30e-6, rho_M: 1030.0, cp_M: 3940.0, th_K0: 80.0, th_M: 5.0,
            th_U: 20.0, t_end: 60 * 60.0, t_mess: 10 * 60.0, th_mess: 67.0, th_Mh: 60.0, m_B: 0.300, c_B: 850.0 };
const K = 273.15;

function rechne(p) {
  const r = Object.assign({}, p);
  r.m_K = p.rho_K * p.V_K;
  r.m_M = p.rho_M * p.V_M;
  r.C_K = r.m_K * p.cp_K;
  r.C_M = r.m_M * p.cp_M;
  r.C_G = r.C_K + r.C_M;
  const T_K0 = p.th_K0 + K, T_M = p.th_M + K, T_U = p.th_U + K;
  Object.assign(r, { T_K0: T_K0, T_M: T_M, T_U: T_U, T_mess: p.th_mess + K });
  r.ln_mess = Math.log((r.T_mess - T_U) / (T_K0 - T_U));
  r.kA = -r.C_K / p.t_mess * r.ln_mess;
  r.a_K = r.kA / r.C_K;
  r.a_G = r.kA / r.C_G;
  const mix = TK => (r.C_K * TK + r.C_M * T_M) / r.C_G;
  r.T1_0 = mix(T_K0);
  r.e_G = Math.exp(-r.a_G * p.t_end);
  r.T1 = T_U + (r.T1_0 - T_U) * r.e_G;
  r.e_K = Math.exp(-r.a_K * p.t_end);
  r.T2_K = T_U + (T_K0 - T_U) * r.e_K;
  r.T2 = mix(r.T2_K);
  r.dT = r.T1 - r.T2;
  r.Q1 = r.C_G * (r.T1_0 - r.T1);
  r.Q2 = r.C_K * (T_K0 - r.T2_K);
  const d = r.a_K - r.a_G;
  r.t_schnitt = d > 0 ? Math.log((T_K0 - T_U) / (r.T1_0 - T_U)) / d : Infinity;
  return r;
}
// MODELL-ENDE

// Werte des Blatts Fassung 3 (werte.py; vorläufig bis zur Messung im Januar 2027). Die einzige Stelle für Standardwerte (SE6).
const STANDARD = { thK0: 80.0, thM: 5.0, thU: 20.0, VK_ml: 200, VM_ml: 100, thMess: 72.0, tZ: 45, thMh: 70.0, trink: 50.0 };
const ZEITEN = [0, 10, 20, 30, 40, 45];   // Messzeitpunkte des Experiments in min (alle 10 min und bei der Zugabe)
// Beispielwerte der Kontrollseite (werte.py, Modell mit vorgewärmter Tasse, gerundet wie auf dem Blatt; berechnet, keine Messung)
const BEISPIEL = { t1: [59.7, 55.7, 52.2, 49.0, 46.1, 44.8], t2: [80.0, 72.0, 65.1, 59.1, 53.9, 51.5], t2Milch: 38.9 };

// Parameter für rechne() aus den Einstellungen der Seite. kA bleibt beim Ändern von Kaffee- oder Raumtemperatur fest
// (Eigenschaft der Tasse); rechne() bekommt dafür den gleichwertigen Messwert nach 10 min, aus dem es genau dieses kA bestimmt.
function parameter(e) {
  const p = Object.assign({}, P, { V_K: STANDARD.VK_ml * 1e-6, V_M: e.VM_ml * 1e-6, th_K0: e.thK0, th_M: e.thM, th_U: e.thU,
                                   t_end: e.tZ * 60.0 });
  const C_K = p.rho_K * p.V_K * p.cp_K;
  p.th_mess = e.kA === null ? STANDARD.thMess : e.thU + (e.thK0 - e.thU) * Math.exp(-e.kA * p.t_mess / C_K);
  return p;
}

// kA des Blatts (aus 72 °C nach 10 min bei den Werten des Blatts)
function kABlatt() {
  return rechne(parameter({ thK0: STANDARD.thK0, thM: STANDARD.thM, thU: STANDARD.thU, VM_ml: STANDARD.VM_ml, kA: null, tZ: STANDARD.tZ })).kA;
}

function auswerten(e) {
  const p = parameter(e);
  const r = rechne(p);
  return { kA: r.kA, th_mess: p.th_mess, C_K: r.C_K, C_G: r.C_G, a_K: r.a_K, a_G: r.a_G, t_schnitt: r.t_schnitt,
           th10: r.T1_0 - K, th1: r.T1 - K, th2K: r.T2_K - K, th2: r.T2 - K, dT: r.dT, Q1: r.Q1, Q2: r.Q2, thK0: e.thK0, thU: e.thU,
           kurve1: t => p.th_U + (r.T1_0 - r.T_U) * Math.exp(-r.a_G * t),      // Tasse 1, t in s, Ergebnis in °C
           kurve2: t => p.th_U + (r.T_K0 - r.T_U) * Math.exp(-r.a_K * t) };    // schwarzer Kaffee in Tasse 2 vor der Zugabe
}

ormal\">M<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math><\/span><p>Abgegebene Wärme bis zur Zugabe: <span class=\"nb\"><math><mrow><mi>Q<\/mi><mo>=<\/mo><mi>C<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><msub><mi>ϑ<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><mi>ϑ<\/mi><mo>)<\/mo><\/mrow><\/math>.<\/span><\/p>","m_rechnung_titel":"So rechnet die Seite","m_titel":"Modell: Annahmen, Rechnung, Grenzen","r_VM":"Milchmenge <math><mrow><msub><mi>V<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><\/mrow><\/math>","r_falsch":"Bitte eine Zahl zwischen {min} und {max} eingeben.","r_feld_aria":"{name} in {einheit}","r_kA":"<math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> der Tasse","r_kA_mess":"entspricht {th} °C nach 10 min (Blatt: 72 °C, vorläufig)","r_minus":"weniger","r_plus":"mehr","r_tZ":"Zugabe in Tasse 2 nach <math><mrow><msub><mi>t<\/mi><mi mathvariant=\"normal\">Z<\/mi><\/msub><\/mrow><\/math>","r_thK0":"Kaffee bei <span class=\"nb\"><math><mrow><msub><mi>t<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>:<\/span> <math><mrow><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">K,0<\/mi><\/msub><\/mrow><\/math>","r_thM":"Milchtemperatur <math><mrow><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">M<\/mi><\/msub><\/mrow><\/math>","r_thM_sperre":"über 30 °C erst in Auftrag 3 (nach Teil g3)","r_thM_warm":"Warme Milch: Die Seite nimmt an, dass sie ihre Temperatur bis zur Zugabe hält (frisch erwärmt, wie in Teil g). Ist sie wärmer als der Kaffee, steigt die Temperatur beim Zugießen.","r_thU":"Raum <math><mrow><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><\/mrow><\/math>","s1_e":"Deine Ergebnisse aus Teil e (freiwillig)","s1_e1_aria":"Tasse 1 nach 45 min in Grad Celsius","s1_e2_aria":"Tasse 2 nach 45 min in Grad Celsius","s1_fehlt":"Wähle eine Tasse und einen Grund.","s1_feld_falsch":"Bitte eine Zahl zwischen 0 und 100 eingeben oder das Feld leer lassen.","s1_freitext":"In eigenen Worten (freiwillig)","s1_grund":"Dein Grund (tippe einen an)","s1_grund_e":"Die Energie bleibt erhalten.","s1_grund_h":"Heißer Kaffee gibt mehr Wärme ab.","s1_grund_s":"Der schwarze Kaffee bleibt länger heiß.","s1_grund_x":"anderer Grund","s1_knopf":"Festhalten und Kurven zeigen","s1_lage":"Zwei gleiche Tassen mit Deckel, je 200 ml Kaffee mit 80 °C, Raum 20 °C. Tasse 1 bekommt 100 ml Milch aus dem Kühlschrank sofort, Tasse 2 erst nach 45 min.","s1_nr":"01 Vorhersage","s1_titel":"Welche Tasse ist nach 45 min wärmer?","s1_wahl":"Deine Wahl","s1_wahl_0":"beide gleich warm","s1_wahl_1":"Tasse 1 (Milch sofort)","s1_wahl_2":"Tasse 2 (Milch später)","s1_zus":"<b>Deine Vorhersage:<\/b> {wahl}. Grund: {grund}","s1_zus_rechnung":"Deine Rechnung aus e: {e1} und {e2} °C.","s2_a":"Tasse 2 hat in den 45 min mehr Wärme an den Raum abgegeben.","s2_b":"Die kalte Milch kühlt Tasse 2 am Ende stärker ab als Tasse 1 am Anfang.","s2_c":"Beim Mischen geht Energie verloren.","s2_fehlt":"Wähle eine Erklärung.","s2_frage":"Beide Tassen starten mit derselben Energie in Kaffee und Milch. Warum ist Tasse 2 am Ende trotzdem kälter? Wähle die Erklärung, die die Säulen zeigen.","s2_knopf":"Antwort festhalten","s2_nr":"02 Warum?","s2_rueck_a":"<p><b>Ja.<\/b> Der schwarze Kaffee in Tasse 2 war die ganze Zeit heißer als Tasse 1 und hat deshalb mehr Wärme abgegeben: <math><mrow><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> = 15,50 kJ, <math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math> = 23,82 kJ (Werte des Blatts). Die 8,31 kJ fehlen Tasse 2; geteilt durch 1241,8 J/K (Kaffee und Milch) sind das 6,69 K.<\/p>","s2_rueck_b":"<p><b>Das denken viele.<\/b> Der Sprung beim Zugießen ist bei Tasse 2 sogar kleiner (15,2 K gegen 24,5 K), weil ihr Kaffee dann kühler ist. Entscheidend ist die Wärme, die beide vorher abgeben. Der schwarze Kaffee in Tasse 2 war die ganze Zeit heißer als Tasse 1 und hat deshalb mehr Wärme abgegeben: <math><mrow><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> = 15,50 kJ, <math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math> = 23,82 kJ (Werte des Blatts). Die 8,31 kJ fehlen Tasse 2; geteilt durch 1241,8 J/K (Kaffee und Milch) sind das 6,69 K.<\/p>","s2_rueck_c":"<p><b>Nein.<\/b> Beim Mischen geht im Modell nichts verloren (Annahme 1). Entscheidend ist die Wärme, die beide an den Raum abgeben. Der schwarze Kaffee in Tasse 2 war die ganze Zeit heißer als Tasse 1 und hat deshalb mehr Wärme abgegeben: <math><mrow><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> = 15,50 kJ, <math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math> = 23,82 kJ (Werte des Blatts). Die 8,31 kJ fehlen Tasse 2; geteilt durch 1241,8 J/K (Kaffee und Milch) sind das 6,69 K.<\/p>","s2_rueck_kern":"Der schwarze Kaffee in Tasse 2 war die ganze Zeit heißer als Tasse 1 und hat deshalb mehr Wärme abgegeben: <math><mrow><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> = 15,50 kJ, <math><mrow><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math> = 23,82 kJ (Werte des Blatts). Die 8,31 kJ fehlen Tasse 2; geteilt durch 1241,8 J/K (Kaffee und Milch) sind das 6,69 K.","s2_saeulen":"An den Raum abgegebene Wärme bis zur Zugabe","s2_saeulen_aria":"Säulen: an den Raum abgegebene Wärme bis zur Zugabe, Tasse 2 mehr als Tasse 1","s2_saeulen_aria_zahl":"Säulen: an den Raum abgegebene Wärme bis zur Zugabe, Tasse 1 {q1} kJ, Tasse 2 {q2} kJ, Unterschied {dq} kJ","s2_titel":"Wohin ist die Energie gegangen?","s2_weiter":"Weiter auf dem Blatt: In f1 und f2 rechnest du das nach.","s3_beispiel":"Beispielwerte des Blatts zeigen (berechnet mit dem Modell und vorgewärmter Tasse, vorläufig, keine Messung)","s3_erkannt":"erkannt in °C: {liste}","s3_f_bereich":"{w} °C liegt nicht zwischen 0 und 100 °C.","s3_f_hoch":"{w} °C liegt über dem ersten Wert von Tasse 2. Bitte prüfen.","s3_f_viele":"Höchstens {n} Werte.","s3_f_zahl":"„{w}“ ist keine Zahl.","s3_frage":"Wo weichen Punkte und Kurven am stärksten ab? (Experiment 3 auf dem Blatt)","s3_ln":"Tasse 2 als ln-Darstellung (Experiment 4: Ist <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> konstant?)","s3_ln_hinweis":"Liegen die Punkte auf einer Geraden, ist <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> konstant. Die Gerade ist das Modell mit dem eingestellten <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>.<\/span>","s3_nach_milch":"nach der Milch","s3_nr":"03 Messung dazulegen","s3_passen":"Damit die Kurven zu deinem Experiment passen: unter „Ausgangswerte“ Kaffee bei <span class=\"nb\"><math><mrow><msub><mi>t<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>,<\/span> Raum und dein <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> aus der Messung bei 10 min (wie in Teil d) einstellen, oben die Milchtemperatur.","s3_t1":"Tasse 1","s3_t2":"Tasse 2 (letzter Wert: 45 min, nach der Milch)","s3_text":"Lege deine Messwerte über die Kurven: Werte in der Reihenfolge des Messblatts (0, 10, 20, 30, 40, 45 min), getrennt durch Leerzeichen; Komma oder Punkt. Fehlt ein Wert, schreibe x.","s3_titel":"Rechnung, Simulation und Messung","s4_fehlt":"Schreibe zuerst deine Antwort.","s4_frage":"Was zeigt die Simulation, was das Experiment nicht zeigen kann, und umgekehrt? Notiere je einen Satz.","s4_gedanken":"<p><b>Simulation:<\/b> den ganzen Verlauf, die abgegebene Wärme und viele Fälle in Sekunden, aber nur, was im Modell steht.<\/p><p><b>Experiment:<\/b> ob das Modell die echten Tassen trifft, mit Tasse, Dampf und Raum, aber nur einen Fall und mit Messunsicherheit.<\/p><p><b>Rechnung:<\/b> warum es so ist.<\/p>","s4_knopf":"Gedanken dazu zeigen","s4_label":"Deine Antwort","s4_nr":"04 Zum Schluss","s4_titel":"Was zeigt welches Medium?","saeule_diff":"Q₂ − Q₁","saeule_t1":"Tasse 1","saeule_t2":"Tasse 2","speicher_aus":"Eingaben werden nicht gespeichert (Speicher im Browser gesperrt); nichts wird gesendet.","speicher_ok":"Eingaben bleiben nur in diesem Browser; nichts wird gesendet.","sprache_knopf":"<b>DE<\/b> ↔ EN","sprache_knopf_aria":"DE ↔ EN: Sprache wechseln, jetzt Deutsch","sprung_inhalt":"Zum Inhalt springen","status_blatt":"Die Werte des Blatts sind eingestellt.","status_werte":"Nach {t} min: Tasse 1 {th1} °C, Tasse 2 {th2} °C, Unterschied {dT} K.","titel_seite":"Kaffee mit Milch: Simulation","vermutung_fehlt":"Wähle oder gib zuerst deine Vermutung ein.","von_vorn_frage":"Alle Eingaben löschen und von vorn beginnen?","vorlaeufig":"vorläufig","w_text":"Drei kleine Aufträge: erst vermuten, dann mit den Reglern prüfen.","w_titel":"Weiterdenken: nach dem Tutorium oder zu Hause","zum_diagramm":"Zum Diagramm ↑","zweck":"<strong>Wozu?<\/strong> Die Seite klärt, welche Tasse nach 45 min wärmer ist und warum. Gedacht für die Zeit nach Teil e des Blatts: erst die Temperaturen beider Tassen nach 45 min selbst rechnen."},"en":{"a1_frage":"The milk is at 20 °C. Does the timing still matter?","a1_gedanken":"Cup 1 stays warmer, but the difference drops from 6.69 to 4.97 K. Even without cold milk the hotter black coffee releases more heat until the milk is added. How the milk acts is part of g4.","a1_o1":"no, both equally warm","a1_o2":"yes, cup 1 stays warmer","a1_o3":"yes, now cup 2 is warmer","a1_pruefen":"Set the milk temperature to 20 °C.","a1_titel":"Task 1: milk at room temperature","a2_frage":"For which adding time is the difference largest?","a2_gedanken":"Largest for adding after about 112 min (8.83 K), where the curves intersect. As long as the black coffee is warmer than cup 1, it releases more heat and the difference grows; after that it releases less. For very late adding 4.90 K remain, because the cold milk cools cup 2 when mixing.","a2_label":"Adding after … min","a2_pruefen":"Move the adding time for cup 2.","a2_titel":"Task 2: when the milk is added","a3_frage":"Does the milk temperature at which both cups are equally warm depend on when the milk is added?","a3_gedanken":"The later the milk is added, the lower: 68.3 °C after 30 min, 63.2 °C after 45 min, 50.8 °C after 90 min. In cup 1 the warm milk releases heat to the room until the adding time, the longer the more; cup 2 only gets it when the milk is added.","a3_o1":"later adding: higher","a3_o2":"later adding: lower","a3_o3":"the same","a3_pruefen":"Set an adding time, for example 30 or 90 min, and use the milk temperature to find a difference of 0.","a3_titel":"Task 3: warmed milk (after part g3)","annahmen":"Calculated, not measured. Assumptions as on the worksheet: contents ideally mixed, lid tight (no evaporation), heat loss <math><mrow><mi>k<\/mi><mi>A<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><mi>ϑ<\/mi><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math> with constant <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>,<\/span> cup without heat capacity, constant room temperature. <a href=\"#modell\" id=\"zum-modell\">Model<\/a>","auftrag_zeile":"<b>Task {n}:<\/b> {frage} <b>Your guess:<\/b> {v}","buehne_aria":"Result of the simulation","deine_vermutung":"Your guess: {v}","dia_beschreibung":"Both cups start with coffee at {a2} °C. The milk {v1} cup 1 to {a1} °C right away, then it cools to {e1} °C. Cup 2 cools to {e2} °C, and after {t} min the milk {v2} it to {m2} °C. Room {u} °C.","dia_hoch":"raises","dia_leer":"The curves appear after your prediction.","dia_ln_leer":"Enter values for cup 2 or show the example values.","dia_ln_modell":"model with kA = {kA} W/K","dia_ln_titel":"Cup 2 before the milk as a ln plot","dia_ln_y":"ln((ϑ − ϑu)/(ϑ(0) − ϑu))","dia_milch":"milk","dia_raum":"Room {th} °C","dia_runter":"drops","dia_t1":"Cup 1: milk right away","dia_t2":"Cup 2: milk after {t} min","dia_temp":"Temperature ϑ [°C]","dia_titel":"Temperature of both cups over time","dia_zeit":"Time t [min]","fuss":"Version date {stand} · version {version} · calculation: model of the worksheet (kaffee_modell.py), worksheet values (werte.py) · made with AI support (Claude), checked by Codex, decided by the tutorial lead","gruppe_titel":"Starting values of the worksheet","gruppe_zus":"Coffee {thK0} °C · room {thU} °C · <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> {kA} W/K · milk {VM} ml","kern_diff":"Difference","kern_nach":"after {t} min","kern_t1":"Cup 1","kern_t2":"Cup 2, after the milk","kernsatz":"If the simulation agrees with your calculation, your calculation is confirmed, not the model. Only the experiment shows whether the model is right.","kernsatz_ab":"<b>Your calculation differs<\/b> ({abw}). Check time in seconds and rounding; common mistakes are listed on the self-check page of the worksheet.","kernsatz_ab_teil":"{tasse}: {e} instead of {s} °C","kernsatz_gleich":"<b>Simulation and your calculation agree:<\/b> this confirms your calculation, not the model. Only the experiment shows whether the model is right.","knopf_blatt":"Worksheet values","knopf_gedanken":"Some thoughts","knopf_vermutung":"Lock in your guess, then check","knopf_von_vorn":"Start again (for the next group)","kopf_titel":"Coffee with milk: simulation","kopf_zeile":"Tutorial 5 · Heat balances, transient lumped","leg_beispiel":"○ □ example values of the worksheet (calculated, provisional)","leg_messung":"● ■ your measurement","leg_rechnung":"× your calculation","m_annahmen":"<ol><li>The contents of the cup are ideally mixed; the milk mixes at once and without heat loss.<\/li><li>No water vapour escapes under the lid; the mass of the contents stays constant.<\/li><li>The total heat loss through wall, bottom and lid is <math><mrow><msub><mover accent=\"true\"><mrow><mi>Q<\/mi><\/mrow><mo class=\"punkt\">˙<\/mo><\/mover><mi mathvariant=\"normal\">ab<\/mi><\/msub><mo>=<\/mo><mi>k<\/mi><mi>A<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><mi>T<\/mi><mo>−<\/mo><msub><mi>T<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math> with constant <span class=\"nb\"><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math>.<\/span><\/li><li>The room temperature is constant.<\/li><li>The heat capacity of cup and lid is negligible.<\/li><li>Coffee (like water) and milk are incompressible with constant properties.<\/li><\/ol>","m_annahmen_titel":"Assumptions (as on the self-check page)","m_code":"The source code is openly readable in this file (block MODELL).","m_grenzen":"<ul><li>The cup stores heat: in the experiment the mixing temperature is higher and the difference smaller.<\/li><li><math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> is not quite constant.<\/li><li>Without a lid, evaporation adds to the heat loss (part j); the page does not calculate it.<\/li><li>The page shows calculated values, not measured values.<\/li><\/ul>","m_grenzen_titel":"Limits","m_pruef":"<b>Check values from the worksheet:<\/b> <math><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><\/math> = 0.1994 W/K from 72 °C after 10 min (d, provisional); cup 1 reaches 50 °C after 17.4 min (h1).","m_rechnung":"<p>The same equations as the worksheet, time in seconds. Balance for the contents of one cup:<\/p><span class=\"formel\"><math display=\"block\"><mrow><mi>m<\/mi><mspace width=\"0.167em\"/><msub><mi>c<\/mi><mi>p<\/mi><\/msub><mspace width=\"0.167em\"/><mfrac><mrow><mi mathvariant=\"normal\">d<\/mi><mi>ϑ<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">d<\/mi><mi>t<\/mi><\/mrow><\/mfrac><mo>=<\/mo><mo>−<\/mo><mi>k<\/mi><mi>A<\/mi><mspace width=\"0.167em\"/><mo>(<\/mo><mi>ϑ<\/mi><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><\/mrow><\/math><\/span><p>Solution with the initial temperature <span class=\"nb\"><math><mrow><msub><mi>ϑ<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>:<\/span><\/p><span class=\"formel\"><math display=\"block\"><mrow><mi>ϑ<\/mi><mo>(<\/mo><mi>t<\/mi><mo>)<\/mo><mo>=<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>+<\/mo><mo>(<\/mo><msub><mi>ϑ<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><msub><mi>ϑ<\/mi><mi mathvariant=\"normal\">u<\/mi><\/msub><mo>)<\/mo><mi>exp<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mo>−<\/mo><mfrac><mrow><mi>k<\/mi><mi>A<\/mi><\/mrow><mrow><mi>m<\/mi><mspace width=\"0.167em\"/><msub><mi>c<\/mi><mi>p<\/mi><\/msub><\/mrow><\/mfrac><mspace width=\"0.167em\"/><mi>t<\/mi><mo>)<\/mo><\/mrow><\/math><\       else { if (z.v !== null) $("a2-zahl").value = zahl(z.v, 0); $("a2-zahl").disabled = z.fest; }
      $("a" + a.n + "-knopf").hidden = z.fest;
      $("a" + a.n + "-pruefen").hidden = !z.fest;
      $("a" + a.n + "-vermutung").textContent = z.fest ? F("deine_vermutung", { v: vermutungText(a.n) }) : "";
      $("a" + a.n + "-ged-knopf").hidden = z.ged;
      $("a" + a.n + "-ged").hidden = !z.ged;
      $("a" + a.n + "-ged").innerHTML = z.ged ? "<p>" + T("a" + a.n + "_gedanken") + "</p>" : "";
    }
    const zeile = $("auftrag-zeile");
    if (S.aktiv && S.a[S.aktiv].fest && S.z >= 2) {
      zeile.innerHTML = F("auftrag_zeile", { n: S.aktiv, frage: T("a" + S.aktiv + "_frage"), v: vermutungText(S.aktiv) });
      zeile.hidden = false;
    } else zeile.hidden = true;
  }

  // ------------------------------------------------------------ Ansage, Kernzahlen, Kernsatz
  let ansageTimer = 0;
  function ansage(text) {
    window.clearTimeout(ansageTimer);
    $("ansage").textContent = "";
    if (S.z < 1) return;                                   // vor der Vorhersage keine Ergebnisansage (X6-01)
    const erg = auswerten(S.e);
    const t = text || F("status_werte", { t: S.e.tZ, th1: zahl(erg.th1, 2), th2: zahl(erg.th2, 2), dT: zahl(erg.dT, 2) });
    ansageTimer = window.setTimeout(() => { if (S.z >= 1) $("ansage").textContent = t; }, 60);
  }
  // Im Startzustand alle Ergebnisinhalte und -attribute leeren, auch nach „Von vorn“ (X6-01)
  function ergebnisseLeeren() {
    window.clearTimeout(ansageTimer);
    for (const id of ["ansage", "w1", "w2", "wd", "kern-zeit", "kernsatz", "s1-zusammenfassung", "s2-rueck", "s4-rueck", "auftrag-zeile", "legende", "gruppe-zus"]) $(id).textContent = "";
    $("saeulen").textContent = "";
    $("saeulen").removeAttribute("aria-label");
    for (const r of REGLER) {
      $("rf-" + r.id).value = "";
      $("rr-" + r.id).removeAttribute("aria-valuetext");
      $("rh-" + r.id).textContent = "";
      $("rm-" + r.id).textContent = "";
    }
  }
  function kern(erg) {
    $("kern-zeit").textContent = F("kern_nach", { t: S.e.tZ });
    $("w1").textContent = zahl(erg.th1, 2) + " °C";
    $("w2").textContent = zahl(erg.th2, 2) + " °C";
    $("wd").textContent = zahl(erg.dT, 2) + " K";
    const r1 = liesZahl(S.e1), r2 = liesZahl(S.e2);
    let html = T("kernsatz");
    if (istBlatt() && (isFinite(r1) || isFinite(r2))) {
      const ab = [];
      if (isFinite(r1) && Math.abs(r1 - erg.th1) > TOLERANZ_RECHNUNG) ab.push(F("kernsatz_ab_teil", { tasse: T("kern_t1"), e: zahl(r1, 2), s: zahl(erg.th1, 2) }));
      if (isFinite(r2) && Math.abs(r2 - erg.th2) > TOLERANZ_RECHNUNG) ab.push(F("kernsatz_ab_teil", { tasse: T("kern_t2"), e: zahl(r2, 2), s: zahl(erg.th2, 2) }));
      html = ab.length ? F("kernsatz_ab", { abw: ab.join("; ") }) : T("kernsatz_gleich");
    }
    $("kernsatz").innerHTML = html;
  }

  // ------------------------------------------------------------ Zustand anzeigen
  function zeigeZustand() {
    const z = S.z;
    if (z === 0) ergebnisseLeeren();
    // X6-04: Link „Modell“ erst mit seinem Ziel (ab Zustand 2), dann klappt er den Bereich auf
    const link = $("zum-modell");
    if (link && z < 2) link.remove();
    document.body.classList.toggle("z0", z === 0);
    $("s1-offen").hidden = z !== 0;
    $("s1-zu").hidden = z === 0;
    $("s1").classList.toggle("erledigt", z > 0);
    $("kern").hidden = z === 0;
    $("kernsatz").hidden = z === 0;
    $("s2").hidden = z === 0;
    for (const id of ["s3", "s4", "weiter", "modell", "von-vorn-zeile", "regler-bereich"]) $(id).hidden = z < 2;
    if (z === 0) $("legende").hidden = true;
    // 01
    document.querySelectorAll('input[name="tasse"]').forEach(x => { x.checked = S.tasse !== null && x.value === String(S.tasse); });
    document.querySelectorAll('input[name="grund"]').forEach(x => { x.checked = S.grund !== null && x.value === S.grund; });
    $("freitext").value = S.freitext; $("e1").value = S.e1; $("e2").value = S.e2;
    $("s1-knopf").disabled = !(S.tasse !== null && S.grund !== null);
    if (z > 0) {
      const wahl = textOhneTags(T("s1_wahl_" + S.tasse)), grund = textOhneTags(T("s1_grund_" + S.grund));
      let html = F("s1_zus", { wahl: wahl, grund: grund }) + (S.freitext.trim() ? " „" + escape(S.freitext.trim()) + "“" : "");
      const r1 = liesZahl(S.e1), r2 = liesZahl(S.e2);
      if (isFinite(r1) || isFinite(r2)) html += " " + F("s1_zus_rechnung", { e1: isFinite(r1) ? zahl(r1, 2) : "…", e2: isFinite(r2) ? zahl(r2, 2) : "…" });
      $("s1-zusammenfassung").innerHTML = html;
    }
    // 02
    document.querySelectorAll('input[name="warum"]').forEach(x => { x.checked = S.warum !== null && x.value === S.warum; x.disabled = S.warumFest; });
    $("s2-knopf").disabled = S.warum === null || S.warumFest;
    $("s2-knopf").hidden = S.warumFest;
    $("s2-fehlt").hidden = S.warumFest;
    $("s2-rueck").hidden = !S.warumFest;
    $("s2-rueck").innerHTML = S.warumFest ? T("s2_rueck_" + S.warum) + "<p>" + T("s2_weiter") + "</p>" : "";
    // 03
    $("m1").value = S.m1; $("m2").value = S.m2; $("beispiel").checked = S.bsp; $("ln").checked = S.ln; $("ln-hinweis").hidden = !S.ln;
    messInfo();
    // 04
    $("s4-text").value = S.schluss;
    $("s4-knopf").disabled = !S.schluss.trim() || S.schlussGez;
    $("s4-knopf").hidden = S.schlussGez;
    $("s4-fehlt").hidden = S.schlussGez;
    $("s4-rueck").hidden = !S.schlussGez;
    $("s4-rueck").innerHTML = S.schlussGez ? T("s4_gedanken") : "";
    zeigeAuftraege();
  }
  function escape(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  function aktualisiere() {
    const erg = auswerten(S.e);
    if (S.z >= 1) { kern(erg); saeulen(erg); }
    if (S.z >= 2) reglerAnzeigen(erg);
    zeichne(erg);
    zeigeAuftraege();
    speichern();
  }
  function alles() { texteSetzen(); zeigeZustand(); aktualisiere(); }

  // ------------------------------------------------------------ Ereignisse
  function verbinden() {
    $("sprache").addEventListener("click", () => {
      L = L === "de" ? "en" : "de";
      if (speicherOk) { try { localStorage.setItem(SPRACHE, L); } catch (err) { /* nur Arbeitsspeicher */ } }
      alles();
    });
    document.querySelectorAll('input[name="tasse"]').forEach(x => x.addEventListener("change", () => { S.tasse = Number(x.value); zeigeZustand(); speichern(); }));
    document.querySelectorAll('input[name="grund"]').forEach(x => x.addEventListener("change", () => { S.grund = x.value; zeigeZustand(); speichern(); }));
    $("freitext").addEventListener("input", () => { S.freitext = $("freitext").value; speichern(); });
    for (const id of ["e1", "e2"]) $(id).addEventListener("input", () => { S[id] = $(id).value; speichern(); });
    $("s1-knopf").addEventListener("click", () => {
      const falsch = ["e1", "e2"].filter(id => { const s = $(id).value.trim(); const x = liesZahl(s); return s !== "" && !(x >= 0 && x <= 100); });
      ["e1", "e2"].forEach(id => { if (falsch.includes(id)) $(id).setAttribute("aria-invalid", "true"); else $(id).removeAttribute("aria-invalid"); });
      if (falsch.length) { $("e-meldung").textContent = T("s1_feld_falsch"); $(falsch[0]).focus(); return; }
      $("e-meldung").textContent = "";
      S.z = 1;
      alles();
      nachOben();
      $("kern").focus({ preventScroll: true });
      ansage();
    });
    document.querySelectorAll('input[name="warum"]').forEach(x => x.addEventListener("change", () => { S.warum = x.value; zeigeZustand(); speichern(); }));
    $("s2-knopf").addEventListener("click", () => {
      if (S.warum === null) return;
      S.warumFest = true; S.z = 2;
      alles();
      $("s2-rueck").focus();
    });
    for (const nr of [1, 2]) $("m" + nr).addEventListener("input", () => { S["m" + nr] = $("m" + nr).value; messInfo(); aktualisiere(); });
    $("beispiel").addEventListener("change", () => { S.bsp = $("beispiel").checked; aktualisiere(); });
    $("ln").addEventListener("change", () => { S.ln = $("ln").checked; $("ln-hinweis").hidden = !S.ln; aktualisiere(); });
    $("s4-text").addEventListener("input", () => { S.schluss = $("s4-text").value; $("s4-knopf").disabled = !S.schluss.trim(); speichern(); });
    $("s4-knopf").addEventListener("click", () => { if (!S.schluss.trim()) return; S.schlussGez = true; zeigeZustand(); speichern(); $("s4-rueck").focus(); });
    $("knopf-blatt").addEventListener("click", () => { S.e = blatt(); aktualisiere(); ansage(T("status_blatt")); });
    $("von-vorn").addEventListener("click", () => {
      if (!window.confirm(T("von_vorn_frage"))) return;
      S = neu();
      if (speicherOk) { try { localStorage.removeItem(SPEICHER); } catch (err) { /* egal */ } }
      document.querySelectorAll(".auftrag").forEach(d => { d.open = false; });
      $("gruppe").open = false; $("modell").open = false;
      alles();
      window.scrollTo(0, 0);
      $("s1-titel").setAttribute("tabindex", "-1"); $("s1-titel").focus();
    });
    let warten = 0;
    window.addEventListener("resize", () => { cancelAnimationFrame(warten); warten = requestAnimationFrame(() => zeichne(auswerten(S.e))); });
    $("gruppe").addEventListener("toggle", () => zeichne(auswerten(S.e)));
    document.addEventListener("click", ev => { if (ev.target.closest && ev.target.closest("#zum-modell")) $("modell").open = true; });
  }
  function nachOben() {
    if (window.innerWidth >= 1024) window.scrollTo(0, Math.max(0, document.querySelector(".raster").getBoundingClientRect().top + window.scrollY - 10));
    else $("buehne").scrollIntoView({ block: "start" });
  }

  // ------------------------------------------------------------ Start
  laden();
  reglerBauen();
  auftraegeBauen();
  verbinden();
  alles();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => zeichne(auswerten(S.e)));
  window.KAFFEE = { auswerten: auswerten, STANDARD: STANDARD, BEISPIEL: BEISPIEL, KA_BLATT: KA_BLATT, zustand: () => JSON.parse(JSON.stringify(S)) };
})();
</script>
</body>
</html>
