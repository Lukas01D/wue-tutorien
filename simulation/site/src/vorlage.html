<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="theme-color" content="#f6f3ea">
<title>Kaffee mit Milch: Simulation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fffdf8' stroke='%231c1f24' stroke-width='3'/%3E%3Ctext x='5' y='22' font-size='14' font-family='monospace' fill='%231c1f24'%3ET5%3C/text%3E%3C/svg%3E">
<style>{{CSS}}</style>
</head>
<body>
<noscript><p class="banner">Diese Seite braucht JavaScript. This page needs JavaScript.</p></noscript>
<a class="sprung" href="#inhalt" data-t="sprung_inhalt"></a>
<header class="kopf">
  <span class="kopf-marke" aria-hidden="true">T5</span>
  <div><p class="kopf-zeile" data-t="kopf_zeile"></p><h1 class="kopf-titel" data-t="kopf_titel"></h1></div>
  <button type="button" class="sprache" id="sprache"><span data-t="sprache_knopf"></span></button>
</header>
<main class="seite" id="inhalt" tabindex="-1">
  <p class="zweck" data-t="zweck"></p>
  <div class="raster">

    <section class="schritt" id="s1" aria-labelledby="s1-titel">
      <p class="nr" data-t="s1_nr"></p>
      <div id="s1-offen">
        <h2 id="s1-titel" data-t="s1_titel"></h2>
        <p data-t="s1_lage"></p>
        <fieldset><legend data-t="s1_wahl"></legend><div class="wahl">
          <label><input type="radio" name="tasse" value="1"> <span data-t="s1_wahl_1"></span></label>
          <label><input type="radio" name="tasse" value="2"> <span data-t="s1_wahl_2"></span></label>
          <label><input type="radio" name="tasse" value="0"> <span data-t="s1_wahl_0"></span></label>
        </div></fieldset>
        <fieldset><legend data-t="s1_grund"></legend><div class="wahl">
          <label><input type="radio" name="grund" value="e"> <span data-t="s1_grund_e"></span></label>
          <label><input type="radio" name="grund" value="s"> <span data-t="s1_grund_s"></span></label>
          <label><input type="radio" name="grund" value="h"> <span data-t="s1_grund_h"></span></label>
          <label><input type="radio" name="grund" value="x"> <span data-t="s1_grund_x"></span></label>
        </div>
          <label class="block-label" for="freitext" data-t="s1_freitext"></label>
          <input class="feld feld-text" type="text" id="freitext" maxlength="200" autocomplete="off">
        </fieldset>
        <fieldset><legend data-t="s1_e"></legend>
          <div class="zahlen-zeile">
            <label><math><msub><mi>ϑ</mi><mn>1</mn></msub></math> <input class="feld" id="e1" inputmode="decimal" autocomplete="off" size="6"> °C</label>
            <label><math><msub><mi>ϑ</mi><mn>2</mn></msub></math> <input class="feld" id="e2" inputmode="decimal" autocomplete="off" size="6"> °C</label>
          </div>
          <p class="meldung" id="e-meldung" role="alert"></p>
        </fieldset>
        <button type="button" class="knopf knopf-haupt" id="s1-knopf" disabled aria-describedby="s1-fehlt" data-t="s1_knopf"></button>
        <p class="leise klein" id="s1-fehlt" data-t="s1_fehlt"></p>
      </div>
      <div id="s1-zu" hidden><p class="zusammenfassung" id="s1-zusammenfassung"></p></div>
    </section>

    <section class="buehne" id="buehne" aria-labelledby="dia-titel">
      <h2 class="nur-leser" id="dia-titel" data-t="dia_titel"></h2>
      <div class="kern" id="kern" tabindex="-1" hidden>
        <div class="zeit" id="kern-zeit"></div>
        <div><span class="lab" data-t="kern_t1"></span><span class="wert" id="w1"></span></div>
        <div><span class="lab" data-t="kern_t2"></span><span class="wert" id="w2"></span></div>
        <div><span class="lab" data-t="kern_diff"></span><span class="wert diff" id="wd"></span></div>
      </div>
      <p class="kernsatz" id="kernsatz" hidden></p>
      <p class="auftrag-zeile" id="auftrag-zeile" hidden></p>
      <figure class="dia-figur">
        <svg class="dia" id="dia" role="img" aria-labelledby="dia-beschreibung"></svg>
        <figcaption class="nur-leser" id="dia-beschreibung"></figcaption>
      </figure>
      <p class="legende" id="legende" hidden></p>
      <p class="annahmen" data-t="annahmen"></p>
      <div class="regler-bereich" id="regler-bereich" data-ab="2" hidden>
        <div class="regler-paar" id="regler-sichtbar"></div>
        <details class="gruppe" id="gruppe">
          <summary><b data-t="gruppe_titel"></b> <span id="gruppe-zus"></span></summary>
          <div class="regler-paar" id="regler-gruppe"></div>
          <button type="button" class="knopf" id="knopf-blatt" data-t="knopf_blatt"></button>
        </details>
      </div>
    </section>

    <section class="schritt" id="s2" aria-labelledby="s2-titel" data-ab="1" hidden>
      <p class="nr" data-t="s2_nr"></p>
      <h2 id="s2-titel" data-t="s2_titel"></h2>
      <p data-t="s2_frage"></p>
      <p class="saeulen-titel" id="saeulen-titel" data-t="s2_saeulen"></p>
      <svg id="saeulen" class="saeulen" viewBox="0 0 250 176" width="250" height="176" role="img"></svg>
      <fieldset><legend class="nur-leser" data-t="s2_frage"></legend><div class="wahl">
        <label><input type="radio" name="warum" value="a"> <span data-t="s2_a"></span></label>
        <label><input type="radio" name="warum" value="b"> <span data-t="s2_b"></span></label>
        <label><input type="radio" name="warum" value="c"> <span data-t="s2_c"></span></label>
      </div></fieldset>
      <button type="button" class="knopf knopf-haupt" id="s2-knopf" disabled aria-describedby="s2-fehlt" data-t="s2_knopf"></button>
      <p class="leise klein" id="s2-fehlt" data-t="s2_fehlt"></p>
      <div class="rueck" id="s2-rueck" tabindex="-1" hidden></div>
    </section>

    <section class="schritt" id="s3" aria-labelledby="s3-titel" data-ab="2" hidden>
      <p class="nr" data-t="s3_nr"></p>
      <h2 id="s3-titel" data-t="s3_titel"></h2>
      <p data-t="s3_text"></p>
      <label class="block-label" for="m1" data-t="s3_t1"></label>
      <input class="feld feld-text feld-zahlen" type="text" id="m1" inputmode="decimal" autocomplete="off" aria-describedby="m1-info">
      <p class="info" id="m1-info" aria-live="polite"></p>
      <label class="block-label" for="m2" data-t="s3_t2"></label>
      <input class="feld feld-text feld-zahlen" type="text" id="m2" inputmode="decimal" autocomplete="off" aria-describedby="m2-info">
      <p class="info" id="m2-info" aria-live="polite"></p>
      <p class="nach-oben-zeile"><a class="nach-oben" href="#buehne" data-t="zum_diagramm"></a></p>
      <label class="haken"><input type="checkbox" id="beispiel"> <span data-t="s3_beispiel"></span></label>
      <p class="leise klein" data-t="s3_passen"></p>
      <p data-t="s3_frage"></p>
      <label class="haken"><input type="checkbox" id="ln"> <span data-t="s3_ln"></span></label>
      <p class="leise klein" id="ln-hinweis" data-t="s3_ln_hinweis" hidden></p>
    </section>

    <section class="schritt" id="s4" aria-labelledby="s4-titel" data-ab="2" hidden>
      <p class="nr" data-t="s4_nr"></p>
      <h2 id="s4-titel" data-t="s4_titel"></h2>
      <p data-t="s4_frage"></p>
      <label class="block-label" for="s4-text" data-t="s4_label"></label>
      <textarea class="feld feld-text" id="s4-text" rows="3" maxlength="600"></textarea>
      <button type="button" class="knopf" id="s4-knopf" disabled aria-describedby="s4-fehlt" data-t="s4_knopf"></button>
      <p class="leise klein" id="s4-fehlt" data-t="s4_fehlt"></p>
      <div class="rueck" id="s4-rueck" tabindex="-1" hidden></div>
    </section>

    <section class="schritt weiter" id="weiter" aria-labelledby="w-titel" data-ab="2" hidden>
      <h2 id="w-titel" data-t="w_titel"></h2>
      <p data-t="w_text"></p>
      <div id="auftraege"></div>
    </section>

    <details class="schritt modell" id="modell" data-ab="2" hidden>
      <summary><span data-t="m_titel"></span></summary>
      <h3 data-t="m_annahmen_titel"></h3>
      <div data-t="m_annahmen"></div>
      <h3 data-t="m_rechnung_titel"></h3>
      <div data-t="m_rechnung"></div>
      <p data-t="m_pruef"></p>
      <h3 data-t="m_grenzen_titel"></h3>
      <div data-t="m_grenzen"></div>
      <p class="leise klein" data-t="m_code"></p>
    </details>

    <div class="von-vorn" id="von-vorn-zeile" hidden>
      <button type="button" class="knopf" id="von-vorn" data-t="knopf_von_vorn"></button>
    </div>
  </div>
  <p class="nur-leser" id="ansage" role="status" aria-live="polite"></p>
</main>
<footer class="fuss"><p id="fuss-text"></p><p id="speicher-text"></p></footer>
<script>{{JS}}</script>
</body>
</html>
