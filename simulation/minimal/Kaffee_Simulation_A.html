/* Kaffee-Simulation, schlanke Varianten A und B: nur Diagramm, Säulen der abgegebenen Wärme und Regler.
   Farben und Schriften wie die Hauptseite (simulation/site/src/stil.css). */
:root {
  --papier: #f6f3ea; --karte: #fffdf8; --tinte: #1c1f24; --leise: #4f5560; --linie: #8f887a;
  --blau: #1d4f91; --blau-hell: #e7eef8;
  --k1: #8a4a17; --k1-text: #7a3f12; --k2: #1c1f24; --raum: #767164; --gitter: #e4ddcc; --gitter-haupt: #cfc7b4;
  --schrift: "Plex Sans", "Plex Math", system-ui, sans-serif;
  --zahl: "Plex Mono", "Plex Sans", "Plex Math", ui-monospace, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--papier); color: var(--tinte); font-family: var(--schrift); line-height: 1.45; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--papier); }
h1 { line-height: 1.2; margin: 0; font-weight: 600; }
p { margin: 0; }
.nur-leser { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.banner { padding: 12px 16px; background: var(--blau-hell); border-bottom: 2px solid var(--blau); }
.kopf { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; padding: 8px 16px;
        border-bottom: 2px solid var(--tinte); background: var(--karte); }
.kopf-marke { font-family: var(--zahl); font-weight: 600; border: 2px solid var(--tinte); padding: 4px 6px; }
.kopf-zeile { font-family: var(--zahl); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--leise); }
.kopf-titel { font-size: 1.15rem; }
.seite { max-width: 1320px; margin: 0 auto; padding: 10px 16px 16px; }
.lage { color: var(--leise); font-size: .95rem; margin-bottom: 8px; }
.buehne { display: grid; gap: 12px; background: var(--karte); border: 1.5px solid var(--tinte); padding: 10px; }
@media (min-width: 760px) { .buehne { grid-template-columns: minmax(0, 1fr) 240px; align-items: stretch; } }
figure { margin: 0; min-width: 0; }
.dia, .q { display: block; width: 100%; }
.feld-q { display: flex; flex-direction: column; }
@media (min-width: 760px) { .feld-q { border-left: 1px solid var(--gitter-haupt); padding-left: 12px; } }
.q-titel { font-size: .9rem; font-weight: 600; margin-bottom: 4px; }
.dia text, .q text { font-family: var(--schrift); }
.ax { font-family: var(--zahl); fill: var(--leise); }
.beschr { fill: var(--leise); }
.kbeschr { font-weight: 600; }
.k1-text { fill: var(--k1-text); } .k2-text { fill: var(--k2); }
.gitter { stroke: var(--gitter); stroke-width: 1; } .gitter-haupt { stroke: var(--gitter-haupt); stroke-width: 1; }
.achse { stroke: var(--tinte); stroke-width: 1.5; }
.raum { stroke: var(--raum); stroke-width: 1.5; stroke-dasharray: 2 3; } .raum-text { fill: var(--raum); font-family: var(--zahl); }
.kurve { fill: none; stroke-linejoin: round; } .k1 { stroke: var(--k1); } .k2 { stroke: var(--k2); }
.gestrichelt { stroke-dasharray: 7 4; }
.blass { opacity: .18; }
.abfall { stroke-dasharray: 6 4; }
.pfeil.k1 { fill: var(--k1); stroke: none; } .pfeil.k2 { fill: var(--k2); stroke: none; }
.ende { fill: var(--karte); stroke-width: 2.5; }
.jetzt { stroke: var(--blau); stroke-width: 1.5; stroke-dasharray: 3 3; }
.punkt.k1 { fill: var(--k1); stroke: none; } .punkt.k2 { fill: var(--k2); stroke: none; }
.saeule1 { fill: var(--k1); } .saeule2 { fill: url(#schraffur); stroke: var(--k2); stroke-width: 2; }
.schraffur-grund { fill: var(--karte); } .schraffur-linie { stroke: var(--k2); stroke-width: 2; }
.zahl { font-family: var(--zahl); }
.q .zahl { fill: var(--tinte); font-weight: 600; }
.diff { fill: var(--tinte); }
.klammer { fill: none; stroke: var(--tinte); stroke-width: 1.5; }
.ergebnis { margin: 8px 0 0; font-size: 1.02rem; }
.ergebnis b { font-family: var(--zahl); font-weight: 600; white-space: nowrap; }
.zeit { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 10px; }
.zeit-label { font-weight: 600; min-width: 7.5em; }
.zeit input { flex: 1 1 220px; min-width: 0; height: 32px; accent-color: var(--blau); }
.knopf { min-height: 44px; padding: 6px 14px; font: inherit; font-weight: 600; border: 2px solid var(--blau); background: var(--karte); color: var(--blau); cursor: pointer; }
.knopf:hover { background: var(--blau-hell); }
.knopf:focus-visible, input:focus-visible { outline: 3px solid var(--blau); outline-offset: 2px; }
.regler-bereich { margin-top: 12px; border-top: 1.5px solid var(--tinte); padding-top: 8px; }
.regler-raster { display: grid; gap: 4px 24px; }
@media (min-width: 640px) { .regler-raster { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .regler-raster { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.regler { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0 8px; }
.regler label { font-size: .95rem; }
.regler output { font-family: var(--zahl); font-weight: 600; font-size: .95rem; }
.regler input { grid-column: 1 / -1; width: 100%; height: 30px; margin: 0; accent-color: var(--blau); }
.fuss { max-width: 1320px; margin: 0 auto; padding: 0 16px 16px; font-size: .8rem; color: var(--leise); }

    const st = schritt(Math.max(e1, e2, 0.1)), qmax = Math.ceil(Math.max(e1, e2, 0.1) / st) * st;
    const qmin = Math.min(0, Math.floor(Math.min(e1, e2, 0) / st) * st);
    const L = 40, top = 22, unten = H - 48, Yq = v => unten - (unten - top) * (v - qmin) / (qmax - qmin);
    const defs = el("defs", {}), pat = el("pattern", { id: "schraffur", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
    pat.appendChild(el("rect", { width: 6, height: 6, class: "schraffur-grund" }));
    pat.appendChild(el("line", { x1: 0, y1: 0, x2: 0, y2: 6, class: "schraffur-linie" }));
    defs.appendChild(pat); svg.appendChild(defs);
    for (let v = qmin; v <= qmax + 1e-9; v += st) {
      svg.appendChild(el("line", { x1: L, x2: W - 6, y1: Yq(v), y2: Yq(v), class: "gitter-haupt" }));
      svg.appendChild(el("text", { x: L - 6, y: Yq(v) + 4, "text-anchor": "end", "font-size": 12, class: "ax" }, zahl(v, st < 1 ? 1 : 0)));
    }
    svg.appendChild(el("text", { x: L - 6, y: top - 10, "text-anchor": "end", "font-size": 12, class: "ax" }, "kJ"));
    svg.appendChild(el("line", { x1: L, x2: W - 6, y1: Yq(0), y2: Yq(0), class: "achse" }));
    const bw = Math.min(56, (W - L - 30) / 3), x1 = L + (W - L) * 0.28 - bw / 2, x2 = L + (W - L) * 0.68 - bw / 2;
    for (const [x, v, kl, name, ktext] of [[x1, q1, "saeule1", "Tasse 1", "k1-text"], [x2, q2, "saeule2", "Tasse 2", "k2-text"]]) {
      const y0 = Yq(Math.max(v, 0)), y1 = Yq(Math.min(v, 0));
      svg.appendChild(el("rect", { x: x, y: y0, width: bw, height: Math.max(0, y1 - y0), class: kl }));
      svg.appendChild(el("text", { x: x + bw / 2, y: y0 - 6, "text-anchor": "middle", "font-size": 13, class: "zahl" }, zahl(v, 2)));
      svg.appendChild(el("text", { x: x + bw / 2, y: unten + 18, "text-anchor": "middle", "font-size": 13, class: "kbeschr " + ktext }, name));
    }
    svg.appendChild(el("text", { x: L + (W - L) / 2, y: H - 6, "text-anchor": "middle", "font-size": 13, class: "diff zahl" }, "Q₂ − Q₁ = " + zahl(q2 - q1, 2) + " kJ"));
    $("q-bis").textContent = VARIANTE === "B" && tBis < E.tZ ? "bis t = " + zahl(tBis, 1) + " min" : "bis zur Zugabe (" + zahl(E.tZ, 0) + " min)";
    $("q-text").textContent = "Säulen: an den Raum abgegebene Wärme " + $("q-bis").textContent + ", Tasse 1 " + zahl(q1, 2) + " kJ, Tasse 2 " + zahl(q2, 2) + " kJ.";
  }

  // ------------------------------------------------------------ Texte
  function texte(erg) {
    $("lage").textContent = "Zwei gleiche Tassen mit Deckel, je " + zahl(STANDARD.VK_ml, 0) + " ml Kaffee mit " + zahl(E.thK0, 1) + " °C, Raum " + zahl(E.thU, 1) +
      " °C. Tasse 1 bekommt " + zahl(E.VM_ml, 0) + " ml Milch mit " + zahl(E.thM, 1) + " °C sofort, Tasse 2 erst nach " + zahl(E.tZ, 0) + " min.";
    const d = erg.dT, wer = Math.abs(d) < 0.005 ? "Beide sind gleich warm." : (d > 0 ? "Tasse 1 ist " : "Tasse 2 ist ") + "<b>" + zahl(Math.abs(d), 2) + " K</b> wärmer.";
    $("ergebnis").innerHTML = "Nach " + zahl(E.tZ, 0) + " min: Tasse 1 <b>" + zahl(erg.th1, 2) + " °C</b>, Tasse 2 <b>" + zahl(erg.th2, 2) + " °C</b>. " + wer;
    const v1 = erg.th10 > E.thK0 ? "steigt" : "fällt", v2 = erg.th2 > erg.th2K ? "steigt" : "fällt";
    $("dia-text").textContent = "Diagramm: Beide Tassen beginnen mit Kaffee bei " + zahl(E.thK0, 1) + " °C. Tasse 1 " + v1 + " durch die Milch sofort auf " + zahl(erg.th10, 1) +
      " °C und kühlt dann auf " + zahl(erg.th1, 1) + " °C ab. Tasse 2 kühlt auf " + zahl(erg.th2K, 1) + " °C ab und " + v2 + " nach " + zahl(E.tZ, 0) + " min durch die Milch auf " + zahl(erg.th2, 1) + " °C.";
    $("fuss").textContent = "Berechnet, nicht gemessen (Modell wie im Blatt, Werte vorläufig bis zur Messung). Variante " + VARIANTE + " · Stand " + BAU.stand + " · Version " + BAU.version;
  }

  function alles() {
    const erg = auswerten(E);
    const tBis = VARIANTE === "B" ? Math.min(tJetzt, E.tZ) : E.tZ;
    reglerAnzeigen();
    if (VARIANTE === "B") {
      const z = $("zeit");
      z.max = E.tZ;
      if (Number(z.value) !== tBis) z.value = tBis;
      $("zeit-wert").textContent = zahl(tBis, 1) + " min";
      z.setAttribute("aria-valuetext", zahl(tBis, 1) + " min");
    }
    const h = diagramm(erg, tBis);
    saeulen(erg, tBis, window.innerWidth >= 760 ? h - 28 : 180);
    texte(erg);
  }

  reglerBauen();
  if (VARIANTE === "B") zeitBauen();
  let warte = 0;
  window.addEventListener("resize", () => { cancelAnimationFrame(warte); warte = requestAnimationFrame(alles); });
  alles();
})();
</script>
</body>
</html>
